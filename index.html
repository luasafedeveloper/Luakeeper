<script>

  } else {
    de.className = 'tab-active px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold transition-all';
    ob.className = 'px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white';
    $('input').placeholder = '-- 디컴파일할 난독화 코드를 붙여넣으세요...';
    setStatus('Deobfuscate 모드 · Moonveil.cc · Luraph · Moonsec 등 모든 패턴을 분석합니다.', 'idle');
  }
}
$('tabObf').onclick = () => setMode('obfuscate');
$('tabDeobf').onclick = () => setMode('deobfuscate');

function setStatus(msg, type = 'idle') {
  const el = $('status');
  const colors = {
    idle: 'text-gray-400 border-[#1e2633]',
    ok: 'text-green-400 border-green-800/50',
    error: 'text-red-400 border-red-800/50',
    info: 'text-cyan-300 border-cyan-800/50',
    warn: 'text-yellow-400 border-yellow-800/50'
  };
  el.className = 'mt-3 px-3 py-2 rounded-md border bg-[#0d1117] text-sm min-h-[42px] flex items-center ' + (colors[type] || colors.idle);
  el.textContent = msg;
}

function updateStats() {
  const inp = $('input').value, out = $('output').value;
  const inB = new TextEncoder().encode(inp).length;
  const outB = new TextEncoder().encode(out).length;
  $('inStats').textContent  = `${inp.split('\n').length} lines · ${inB.toLocaleString()} B`;
  $('outStats').textContent = `${out.split('\n').length} lines · ${outB.toLocaleString()} B`;
  $('stats').textContent = `IN ${inB.toLocaleString()} B → OUT ${outB.toLocaleString()} B`;
}
$('input').addEventListener('input', updateStats);

/* ============ Dual XOR 인코더 / 디코더 ============ */
function encodeSource(src, seed1, seed2) {
  const bytes = new TextEncoder().encode(src);
  const enc = new Uint8Array(bytes.length);
  let k1 = seed1 & 0xFF, k2 = seed2 & 0xFF;
  for (let i = 0; i < bytes.length; i++) {
    let v = bytes[i] ^ k1;
    k1 = (k1 * 31 + i + 13) & 0xFF;
    let v2 = v ^ k2;
    k2 = (k2 * 17 + i + 7) & 0xFF;
    enc[i] = v2;
  }
  let hex = '';
  for (let i = 0; i < enc.length; i++) hex += enc[i].toString(16).padStart(2, '0');
  return hex;
}

function decodeDualXOR(hex, seed1, seed2) {
  if (hex.length % 2 !== 0) throw new Error('Hex 홀수');
  const byteLen = hex.length / 2;
  const out = new Uint8Array(byteLen);
  let k1 = seed1 & 0xFF, k2 = seed2 & 0xFF;
  for (let i = 0; i < byteLen; i++) {
    const b = parseInt(hex.substr(i * 2, 2), 16);
    if (isNaN(b)) throw new Error(`bad hex @${i*2}`);
    let v = b ^ k2; k2 = (k2 * 17 + i + 7) & 0xFF;
    let v2 = v ^ k1; k1 = (k1 * 31 + i + 13) & 0xFF;
    out[i] = v2;
  }
  return new TextDecoder('utf-8', { fatal: false }).decode(out);
}

/* ============ 난독화 엔진 v12 (완전 수정) ============ */
function generateObfuscated(source) {
  const seed1 = Math.floor(Math.random() * 255) + 1;
  const seed2 = Math.floor(Math.random() * 255) + 1;
  const fakeA1 = Math.floor(Math.random() * 200) + 10;
  const fakeB1 = seed1 ^ fakeA1;
  const fakeA2 = Math.floor(Math.random() * 200) + 10;
  const fakeB2 = seed2 ^ fakeA2;

  const hex = encodeSource(source, seed1, seed2);

  // 청크 16384글자 (8192바이트) → 오버헤드 최소화
  const CHUNK_SIZE = 16384;
  const chunks = [];
  for (let i = 0; i < hex.length; i += CHUNK_SIZE) chunks.push(hex.slice(i, i + CHUNK_SIZE));
  if (chunks.length === 0) chunks.push('');

  // 진짜 = "D" 접두사, 가짜 = "J" 접두사
  const dataLines = [];
  for (let i = 0; i < chunks.length; i++) {
    dataLines.push(`"D${chunks[i]}"`);
    if (i % 4 === 0 && i < chunks.length - 1) {
      dataLines.push(`"J${i}_${Math.random().toString(36).substring(2, 6)}"`);
    }
  }

  // Dead branches (20개)
  const deadBranches = [];
  for (let i = 0; i < 20; i++) {
    deadBranches.push(`elseif _S==${-100 - i}then return`);
  }

  // ★ v12: loadstring(_R) → _L(_R) 완벽 수정 + 모든 주석 최소화
  return `-- Obfuscated by LuaKeeper
local _S,_L,_P,_K1,_K2,_R=1,nil,{},0,0,nil
pcall(function()_L=rawget(getfenv(),"loadstring")or rawget(getfenv(),"load")end)
if type(_L)~="function"then return end
if type(bit32)~="table"then return end
local _C={[1]=${fakeA1},[2]=${fakeB1},[3]=${fakeA2},[4]=${fakeB2}}
local _D={
${dataLines.join(',\n')}
}
while _S~=0 do
if _S==1 then
_K1=bit32.bxor(_C[1],_C[2])_K2=bit32.bxor(_C[3],_C[4])_S=2
elseif _S==2 then
local _h={}
for i=1,#_D do local _v=_D[i]if type(_v)=="string"and string.sub(_v,1,1)=="D"then _h[#_h+1]=string.sub(_v,2)end end
_P=_h _D=nil _S=3
elseif _S==3 then
local _H=table.concat(_P)_P=nil
local _a=_K1 local _b=_K2 local _O={}local _bi=1
for i=1,#_H,2 do
local _x=tonumber(string.sub(_H,i,i+1),16)or 0
local _j=_bi-1
_O[_bi]=string.char(bit32.bxor(bit32.bxor(_x,_b),_a))
_b=(_b*17+_j+7)%256
_a=(_a*31+_j+13)%256
_bi=_bi+1
end
_R=table.concat(_O)_O=nil _H=nil _S=4
elseif _S==4 then
local _f=_L(_R)_R=nil
if _f then pcall(function()task.spawn(_f)end)end
_S=0
${deadBranches.join('\n')}
end
end
`;
}

/* ============ 디컴파일러 v12 (Moonveil · 15+ 패턴) ============ */
function extractLuaStrings(str) {
  const result = [];
  let i = 0;
  while (i < str.length) {
    if (str[i] === '"') {
      let j = i + 1, current = "";
      while (j < str.length && str[j] !== '"') {
        if (str[j] === '\\') {
          if (str[j+1] === '"') { current += '"'; j += 2; }
          else if (str[j+1] === '\\') { current += '\\'; j += 2; }
          else { current += str[j+1]; j += 2; }
        } else { current += str[j]; j++; }
      }
      result.push(current);
      i = j + 1;
    } else i++;
  }
  return result;
}

function numArrayDump(arr) {
  let best = '';
  const candidates = [];
  for (let k = 0; k < 256; k++) {
    let s = '';
    for (let i = 0; i < arr.length; i++) {
      const v = (arr[i] ^ k) & 0xFF;
      s += String.fromCharCode(v);
    }
    const printable = (s.match(/[\x20-\x7E\uAC00-\uD7A3\n\t\r]/g) || []).length;
    candidates.push({ key: k, text: s, score: printable / Math.max(1, s.length) });
  }
  candidates.sort((a, b) => b.score - a.score);
  return candidates[0].score > 0.7 ? candidates[0] : null;
}

function universalDeobfuscate(code) {
  let log = [], out = '';

  // ===== [1] LuaKeeper v11/v12 (Dual XOR) =====
  if (code.includes('Obfuscated by LuaKeeper') || (code.includes('bit32.bxor') && code.includes('_C') && code.includes('_D'))) {
    try {
      const cMatch = code.match(/_C\s*=\s*\{([^}]+)\}/);
      if (cMatch) {
        const nums = {};
        [...cMatch[1].matchAll(/\[(\d+)\]\s*=\s*(\d+)/g)].forEach(m => nums[+m[1]] = +m[2]);
        if (nums[1] && nums[2] && nums[3] && nums[4]) {
          const seed1 = nums[1] ^ nums[2], seed2 = nums[3] ^ nums[4];
          const dMatch = code.match(/_D\s*=\s*\{([\s\S]*?)\n\s*\}/);
          if (dMatch) {
            const strArr = [...dMatch[1].matchAll(/"([^"]*)"/g)].map(m => m[1]);
            const real = strArr.filter(s => s.startsWith('D')).map(s => s.substr(1));
            if (real.length > 0) {
              return { code: decodeDualXOR(real.join(''), seed1, seed2), log: ['[성공] LuaKeeper v12 (Dual XOR)'], isRaw: false };
            }
          }
        }
      }
    } catch (e) { log.push('[실패] v12: ' + e.message); }
  }

  // ===== [2] Moonveil.cc 패턴 =====
  if (code.includes('moonveil') || code.includes('Moonveil')) {
    log.push('[Moonveil] 시그니처 감지');
  }
  
  // Moonveil 패턴 A: `return (function(...)...end)(...)` IIFE
  const iifeMatch = code.match(/^[\s\n]*return\s*\(?\s*function\s*\(\.\.\.\)([\s\S]*?)\bend\)?\s*\(\s*\.\.\.\s*\)/);
  if (iifeMatch && iifeMatch[1]) {
    log.push('[Moonveil] IIFE 구조 감지 → 내부 추출');
    code = iifeMatch[1];
  }

  // Moonveil 패턴 B: 숫자 배열 + XOR 루프 (상수 키)
  const arrXorRegex = /local\s+([a-zA-Z_]\w*)\s*=\s*\{([\d,\s]{50,})\}[\s\S]{0,400}?bit32\.bxor\s*\(\s*\1\s*\[\s*[a-zA-Z_]\w*\s*\]\s*,\s*(\d+)\s*\)/;
  const arrXorMatch = code.match(arrXorRegex);
  if (arrXorMatch) {
    const arr = arrXorMatch[2].split(',').map(v => parseInt(v.trim(), 10)).filter(v => !isNaN(v));
    const key = parseInt(arrXorMatch[3], 10);
    if (arr.length > 20) {
      let decoded = '';
      for (let i = 0; i < arr.length; i++) decoded += String.fromCharCode((arr[i] ^ key) & 0xFF);
      const printable = (decoded.match(/[\x20-\x7E\uAC00-\uD7A3\n\t\r]/g) || []).length;
      if (printable / decoded.length > 0.7) {
        return { code: decoded, log: ['[성공] Moonveil XOR (상수 키 ' + key + ')'], isRaw: false };
      }
    }
  }

  // Moonveil 패턴 C: 숫자 배열 + 동적 키 `(i * N) % 256`
  const dynXorRegex = /local\s+([a-zA-Z_]\w*)\s*=\s*\{([\d,\s]{50,})\}[\s\S]{0,400}?bit32\.bxor\s*\(\s*\1\s*\[\s*([a-zA-Z_]\w*)\s*\]\s*,\s*\(\s*([a-zA-Z_]\w*)\s*\*\s*(\d+)\s*\)\s*%\s*256\s*\)/;
  const dynXorMatch = code.match(dynXorRegex);
  if (dynXorMatch) {
    const arr = dynXorMatch[2].split(',').map(v => parseInt(v.trim(), 10)).filter(v => !isNaN(v));
    const mult = parseInt(dynXorMatch[5], 10);
    if (arr.length > 20) {
      let decoded = '';
      for (let i = 0; i < arr.length; i++) {
        const key = ((i + 1) * mult) % 256;
        decoded += String.fromCharCode((arr[i] ^ key) & 0xFF);
      }
      const printable = (decoded.match(/[\x20-\x7E\uAC00-\uD7A3\n\t\r]/g) || []).length;
      if (printable / decoded.length > 0.7) {
        return { code: decoded, log: ['[성공] Moonveil 동적 키 (×' + mult + ')'], isRaw: false };
      }
    }
  }

  // Moonveil 패턴 D: 두 숫자 배열 XOR (키 테이블 매칭)
  const doubleArrRegex = /local\s+([a-zA-Z_]\w*)\s*=\s*\{([\d,\s]{50,})\}[\s\S]{0,100}?local\s+([a-zA-Z_]\w*)\s*=\s*\{([\d,\s]{50,})\}/;
  const doubleArrMatch = code.match(doubleArrRegex);
  if (doubleArrMatch) {
    const arrA = doubleArrMatch[2].split(',').map(v => parseInt(v.trim(), 10)).filter(v => !isNaN(v));
    const arrB = doubleArrMatch[4].split(',').map(v => parseInt(v.trim(), 10)).filter(v => !isNaN(v));
    if (arrA.length > 20 && arrB.length > 20 && arrA.length === arrB.length) {
      let decoded = '';
      for (let i = 0; i < arrA.length; i++) decoded += String.fromCharCode((arrA[i] ^ arrB[i]) & 0xFF);
      const printable = (decoded.match(/[\x20-\x7E\uAC00-\uD7A3\n\t\r]/g) || []).length;
      if (printable / decoded.length > 0.7) {
        return { code: decoded, log: ['[성공] Moonveil 이중 배열 XOR'], isRaw: false };
      }
    }
  }

  // Moonveil 패턴 E: 단순 배열 + 자동 브루트포스
  if (!out) {
    const simpleArrRegex = /local\s+([a-zA-Z_]\w*)\s*=\s*\{([\d,\s]{100,})\}/g;
    let m;
    while ((m = simpleArrRegex.exec(code)) !== null) {
      const arr = m[2].split(',').map(v => parseInt(v.trim(), 10)).filter(v => !isNaN(v));
      if (arr.length > 30) {
        const result = numArrayDump(arr);
        if (result) {
          out += `-- [브루트포스 결과 (배열 ${m[1]}, 키 ${result.key})]\n${result.text}\n\n`;
          log.push(`[성공] Moonveil 브루트포스 (키 ${result.key})`);
          break;
        }
      }
    }
  }

  // ===== [3] Chanhyuk lua =====
  if (code.includes('chanhyuk lua') || (code.includes('local n=') && code.includes('local o=') && code.includes('local k='))) {
    try {
      const nMatch = code.match(/local\s+n\s*=\s*\{([\s\S]*?)\}\s*local\s+o/);
      const oMatch = code.match(/local\s+o\s*=\s*\{([\s\S]*?)\}\s*local\s+k/);
      const kMatch = code.match(/local\s+k\s*=\s*(\d+)/);
      const qMatch = code.match(/local\s+q\s*=\s*(\d+)/);
      const aMatch = code.match(/local\s+a\s*=\s*\{([\s\S]*?)\}\s*local\s+g/);
      if (nMatch && oMatch && kMatch && qMatch && aMatch) {
        const nStrings = extractLuaStrings(nMatch[1]);
        const oArr = [...oMatch[1].matchAll(/\d+/g)].map(mm => parseInt(mm[0], 10));
        const k = parseInt(kMatch[1], 10), q = parseInt(qMatch[1], 10);
        const aArr = [...aMatch[1].matchAll(/\d+/g)].map(mm => parseInt(mm[0], 10));
        function decCH(s, k, q, a) {
          let r = "", j = 1;
          for (let i = 0; i < s.length; i += 2) {
            const v = (s.charCodeAt(i) - 33) * 95 + (s.charCodeAt(i + 1) - 33);
            let idx = (v - k - (((j - 1) * q) % 251) - a[((j - 1) % a.length)] + 512) % 256;
            if (idx < 0) idx += 256;
            r += String.fromCharCode(idx);
            j++;
          }
          return r;
        }
        let decoded = "";
        for (let i = 0; i < oArr.length; i++) {
          const idx = oArr[i] - 1;
          if (nStrings[idx]) decoded += decCH(nStrings[idx], k, q, aArr);
        }
        return { code: decoded, log: ['[성공] Chanhyuk lua'], isRaw: false };
      }
    } catch (e) { log.push('[실패] Chanhyuk'); }
  }

  // ===== [4] 다중 loadstring 래퍼 (최대 8회) =====
  let iter = 0;
  const loadRegex = /(?:loadstring|load)\s*\(\s*(["'])([\s\S]*?)\1\s*\)/;
  let loadMatch;
  while ((loadMatch = code.match(loadRegex)) && iter < 8) {
    let inner = loadMatch[2].replace(/\\(\d{1,3})/g, (m, p1) => String.fromCharCode(parseInt(p1, 10)));
    inner = inner.replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\'/g, "'");
    if (inner === loadMatch[2]) break;
    code = inner;
    iter++;
  }
  if (iter > 0) log.push(`[성공] loadstring x${iter}`);

  // ===== [5] base64 =====
  const b64Regex = /base64,([A-Za-z0-9+\/=]{20,})/g;
  if (b64Regex.test(code)) {
    code = code.replace(b64Regex, (m, b64) => {
      try {
        const dec = atob(b64);
        return '"' + dec.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"';
      } catch { return m; }
    });
    log.push('[성공] base64');
  }

  // ===== [6] string.char =====
  const charRegex = /string\.char\s*\(\s*([0-9,\s]+)\s*\)/g;
  if (charRegex.test(code)) {
    code = code.replace(charRegex, (m, p1) => {
      try {
        const bytes = p1.split(',').map(n => parseInt(n.trim(), 10));
        const text = new TextDecoder('utf-8').decode(new Uint8Array(bytes));
        return '"' + text.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"';
      } catch { return m; }
    });
    log.push('[성공] string.char');
  }

  // ===== [7] string.reverse =====
  const revRegex = /string\.reverse\s*\(\s*(["'])([\s\S]*?)\1\s*\)/g;
  if (revRegex.test(code)) {
    code = code.replace(revRegex, (m, q, s) => {
      return '"' + s.split('').reverse().join('').replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
    });
    log.push('[성공] string.reverse');
  }

  // ===== [8] string.rep =====
  const repRegex = /string\.rep\s*\(\s*(["'])([\s\S]*?)\1\s*,\s*(\d+)\s*\)/g;
  if (repRegex.test(code)) {
    code = code.replace(repRegex, (m, q, s, n) => {
      const rep = s.repeat(parseInt(n, 10));
      return '"' + rep.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
    });
    log.push('[성공] string.rep');
  }

  // ===== [9] table.concat({...}) =====
  const tcRegex = /table\.concat\s*\(\s*\{([^}]+)\}\s*(?:,\s*["'][^"']*["'])?\s*\)/g;
  if (tcRegex.test(code)) {
    code = code.replace(tcRegex, (m, inner) => {
      const strs = [...inner.matchAll(/"([^"]*)"/g)].map(mm => mm[1]);
      if (strs.length > 0) {
        return '"' + strs.join('').replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
      }
      return m;
    });
    log.push('[성공] table.concat');
  }

  // ===== [10] UTF-8 / Hex 디코딩 =====
  const hexRegex = /\\x([0-9a-fA-F]{2})/g;
  if (hexRegex.test(code)) {
    code = code.replace(hexRegex, (m, h) => String.fromCharCode(parseInt(h, 16)));
    log.push('[성공] hex escape');
  }

  // 결과 조합
  if (log.length === 0) {
    log.push('[정보] 알려진 패턴 없음 (원본 반환)');
    return { code: code, log, isRaw: true };
  }
  if (out.length > 0 && code.length < 500) {
    return { code: out, log, isRaw: false };
  }
  if (iter > 0 || out.length > 0) {
    out += code;
    return { code: out, log, isRaw: false };
  }
  return { code: code, log, isRaw: false };
}

/* ============ 이벤트 ============ */
$('btnProcess').onclick = () => {
  const input = $('input').value;
  if (!input.trim()) { setStatus('[오류] 입력 없음', 'error'); $('output').value = ''; updateStats(); return; }
  try {
    if (MODE === 'obfuscate') {
      $('output').value = generateObfuscated(input);
      setStatus('[성공] Dual XOR v12 난독화 완료 · loadstring 버그 수정 · 주석 최소화', 'ok');
    } else {
      const { code: r, log, isRaw } = universalDeobfuscate(input);
      $('output').value = r;
      if (isRaw) setStatus(`[경고] ${log.join(' | ')}`, 'warn');
      else setStatus(`[성공] ${log.join(' | ')}`, 'ok');
    }
  } catch (e) {
    $('output').value = `-- 오류: ${e.message}\n\n${input}`;
    setStatus(`[오류] ${e.message}`, 'error');
  }
  updateStats();
};

$('btnLoad').onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.lua,.luau,.txt,.obf,.code';
  inp.onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { $('input').value = r.result; updateStats(); setStatus(`[파일] ${f.name}`, 'info'); };
    r.readAsText(f, 'UTF-8');
  };
  inp.click();
};

$('btnSave').onclick = () => {
  const c = $('output').value;
  if (!c) return setStatus('[오류] 출력 없음', 'error');
  const b = new Blob([c], { type: 'text/plain;charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = MODE === 'obfuscate' ? 'luakeeper_protected.lua' : 'luakeeper_deobfuscated.lua';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(u);
  setStatus(`[저장] ${a.download}`, 'ok');
};

$('btnCopy').onclick = () => {
  const c = $('output').value; if (!c) return;
  navigator.clipboard.writeText(c).then(
    () => setStatus('[복사] 완료', 'info'),
    () => setStatus('[오류] 복사 실패', 'error')
  );
};

$('btnClear').onclick = () => { $('input').value = ''; $('output').value = ''; updateStats(); setStatus('[초기화]', 'idle'); };

updateStats();
setMode('deobfuscate');
</script>
