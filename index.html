<script>
const $ = (id) => document.getElementById(id);
let MODE = 'deobfuscate';

function setMode(m) {
  MODE = m;
  const ob = $('tabObf'), de = $('tabDeobf');
  if (m === 'obfuscate') {
    ob.className = 'tab-active px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold transition-all';
    de.className = 'px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white';
    $('input').placeholder = '-- Luau 소스를 여기에 붙여넣으세요...';
    setStatus('Obfuscate 모드 · Dual XOR VM 난독화를 적용합니다.', 'idle');
  } else {
    de.className = 'tab-active px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold transition-all';
    ob.className = 'px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white';
    $('input').placeholder = '-- 디컴파일할 난독화 코드를 붙여넣으세요...';
    setStatus('Deobfuscate 모드 · VM 패턴을 분석합니다.', 'idle');
  }
}
$('tabObf').onclick = () => setMode('obfuscate');
$('tabDeobf').onclick = () => setMode('deobfuscate');

function setStatus(msg, type = 'idle') {
  const el = $('status');
  const colors = {
    idle: 'text-gray-400 border-[#1e2633]',
    ok: 'text-green-400 border-green-800/50',
    error: 'text-red-400 border-red-800/50',
    info: 'text-cyan-300 border-cyan-800/50',
    warn: 'text-yellow-400 border-yellow-800/50'
  };
  el.className = 'mt-3 px-3 py-2 rounded-md border bg-[#0d1117] text-sm min-h-[42px] flex items-center ' + (colors[type] || colors.idle);
  el.textContent = msg;
}

function updateStats() {
  const inp = $('input').value, out = $('output').value;
  const inB = new TextEncoder().encode(inp).length;
  const outB = new TextEncoder().encode(out).length;
  $('inStats').textContent  = `${inp.split('\n').length} lines · ${inB.toLocaleString()} B`;
  $('outStats').textContent = `${out.split('\n').length} lines · ${outB.toLocaleString()} B`;
  $('stats').textContent = `IN ${inB.toLocaleString()} B → OUT ${outB.toLocaleString()} B`;
}
$('input').addEventListener('input', updateStats);

/* ============ 인코딩 / 디코딩 (Dual XOR + Rolling Key) ============ */
function encodeSource(src, seed1, seed2) {
  const bytes = new TextEncoder().encode(src);
  const enc = new Uint8Array(bytes.length);
  let k1 = seed1 & 0xFF;
  let k2 = seed2 & 0xFF;
  for (let i = 0; i < bytes.length; i++) {
    // 1차 XOR (Rolling Key A)
    let v = bytes[i] ^ k1;
    k1 = (k1 * 31 + i + 13) & 0xFF;
    // 2차 XOR (Rolling Key B)
    let v2 = v ^ k2;
    k2 = (k2 * 17 + i + 7) & 0xFF;
    enc[i] = v2;
  }
  let hex = '';
  for (let i = 0; i < enc.length; i++) hex += enc[i].toString(16).padStart(2, '0');
  return hex;
}

function decodeHex(hex, seed1, seed2) {
  if (hex.length % 2 !== 0) throw new Error('Hex 길이 홀수');
  const byteLen = hex.length / 2;
  const out = new Uint8Array(byteLen);
  let k1 = seed1 & 0xFF;
  let k2 = seed2 & 0xFF;
  for (let i = 0; i < byteLen; i++) {
    const b = parseInt(hex.substr(i * 2, 2), 16);
    if (isNaN(b)) throw new Error(`Hex 오류 @${i*2}`);
    // 2차 역
    let v = b ^ k2;
    k2 = (k2 * 17 + i + 7) & 0xFF;
    // 1차 역
    let v2 = v ^ k1;
    k1 = (k1 * 31 + i + 13) & 0xFF;
    out[i] = v2;
  }
  return new TextDecoder('utf-8', { fatal: false }).decode(out);
}

/* ============ VM 난독화 엔진 (Dual XOR) ============ */
function generateObfuscated(source) {
  // 키 4개 생성 (2중 XOR)
  const realSeed1 = Math.floor(Math.random() * 255) + 1;
  const realSeed2 = Math.floor(Math.random() * 255) + 1;
  const fakeA1 = Math.floor(Math.random() * 200) + 10;
  const fakeB1 = realSeed1 ^ fakeA1;
  const fakeA2 = Math.floor(Math.random() * 200) + 10;
  const fakeB2 = realSeed2 ^ fakeA2;

  const hex = encodeSource(source, realSeed1, realSeed2);

  // 청크 2048글자 (1024바이트)
  const CHUNK_SIZE = 2048;
  const chunks = [];
  for (let i = 0; i < hex.length; i += CHUNK_SIZE) chunks.push(hex.slice(i, i + CHUNK_SIZE));
  if (chunks.length === 0) chunks.push('');

  // 진짜 데이터는 "D_"로 시작, 쓰레기는 "J_"로 시작 (마커 명확화)
  const dataLines = [];
  for (let i = 0; i < chunks.length; i++) {
    dataLines.push(`"D${chunks[i]}"`);  // 진짜 데이터는 D로 시작
    if (i % 6 === 0) {
      dataLines.push(`"J${i}_${Math.random().toString(36).substring(2, 8)}"`);
    }
  }

  // Decoy 함수들
  const funcNames = [];
  const junkFuncs = [];
  for (let i = 0; i < 80; i++) {
    const name = `_z${i}_${Math.floor(Math.random() * 10000)}`;
    funcNames.push(name);
    const r1 = Math.floor(Math.random() * 1000);
    junkFuncs.push(`local function ${name}(a, b) return ((a or 1) * ${r1}) - ${r1} end`);
  }

  // Dead code branches
  const deadBranches = [];
  for (let i = 0; i < 60; i++) {
    deadBranches.push(`elseif _S == ${-100 - i} then return`);
  }

  return `-- [Luakeeper VM v10 - Dual XOR · Debug Mode]
-- F9 콘솔에 [LuaKeeper] 로그가 표시됩니다.

local _LOG = true
local function _W(m)
    if _LOG then pcall(function() warn("[LuaKeeper] " .. tostring(m)) end) end
end

_W("boot")

-- [Decoy 함수 80개 - Opcode Randomization]
${junkFuncs.join('\n')}

-- [상수 테이블 (Constant Scattering)]
-- 진짜 시드: [1]^[2] = 1차 키, [3]^[4] = 2차 키
local _C = {
    [1] = ${fakeA1},
    [2] = ${fakeB1},
    [3] = ${fakeA2},
    [4] = ${fakeB2},
    [5] = ${chunks.length},
}

-- [암호화 데이터 (D=진짜, J=가짜)]
local _D = {
${dataLines.join(',\n')}
}

_W("const+data loaded: " .. tostring(#_D))

-- [VM 상태]
local _PC = 1
local _S = 1
local _P = {}      -- parts
local _SRC = nil
local _K1 = 0
local _K2 = 0

-- [VM 디스패처 - State Machine]
while _S ~= 0 do
    if _S == 1 then
        -- Phase 1: 진짜 청크 수집 (점진적, 60개씩)
        local _end = math.min(_PC + 59, #_D)
        local _cnt = 0
        for i = _PC, _end do
            local _v = _D[i]
            if type(_v) == "string" and string.sub(_v, 1, 1) == "D" then
                -- 첫 글자 'D' 제거하고 나머지 저장
                _P[#_P + 1] = string.sub(_v, 2)
                _cnt = _cnt + 1
            end
        end
        _PC = _end + 1
        if _PC > #_D then
            _W("phase1 done: " .. tostring(_cnt) .. " chunks collected")
            _S = 2
        end
        task.wait()

    elseif _S == 2 then
        -- Phase 2: 이중 XOR 디코딩
        _K1 = bit32.bxor(_C[1], _C[2])
        _K2 = bit32.bxor(_C[3], _C[4])
        local _hex = table.concat(_P)
        _P = nil
        _W("phase2: hex len=" .. tostring(#_hex) .. " k1=" .. tostring(_K1) .. " k2=" .. tostring(_K2))
        local _out = {}
        local _bad = 0
        for i = 1, #_hex, 2 do
            local _b = tonumber(string.sub(_hex, i, i + 1), 16)
            if not _b then _bad = _bad + 1; _b = 0 end
            local _idx = math.floor((i - 1) / 2)
            -- 2차 역
            local _v = bit32.bxor(_b, _K2)
            _K2 = (_K2 * 17 + _idx + 7) % 256
            -- 1차 역
            local _v2 = bit32.bxor(_v, _K1)
            _K1 = (_K1 * 31 + _idx + 13) % 256
            _out[#_out + 1] = string.char(_v2)
        end
        if _bad > 0 then _W("WARN: bad hex count=" .. tostring(_bad)) end
        _SRC = table.concat(_out)
        _out = nil
        _hex = nil
        _W("phase2 done: src len=" .. tostring(#_SRC))
        _S = 3

    elseif _S == 3 then
        -- Phase 3: 컴파일
        local _len = #_SRC
        local _f, _err = loadstring(_SRC)
        _SRC = nil
        if not _f then
            _W("COMPILE FAIL: " .. tostring(_err))
            return
        end
        _W("compiled ok (len=" .. tostring(_len) .. "), executing...")
        _S = 0
        -- 실행 (pcall로 감싸서 에러 추적)
        local _ok, _runErr = pcall(_f)
        if not _ok then
            _W("RUNTIME ERR: " .. tostring(_runErr))
        else
            _W("SUCCESS")
        end
${deadBranches.join('\n    ')}
    end
end
`;
}

/* ============ 디컴파일러 ============ */
function extractLuaStrings(str) {
    const result = [];
    let i = 0;
    while (i < str.length) {
        if (str[i] === '"') {
            let j = i + 1, current = "";
            while (j < str.length && str[j] !== '"') {
                if (str[j] === '\\') {
                    if (str[j+1] === '"') { current += '"'; j += 2; }
                    else if (str[j+1] === '\\') { current += '\\'; j += 2; }
                    else { current += str[j+1]; j += 2; }
                } else { current += str[j]; j++; }
            }
            result.push(current);
            i = j + 1;
        } else i++;
    }
    return result;
}

function universalDeobfuscate(code) {
  let log = [], out = '';

  // [1] VM v10 (Dual XOR)
  if (code.includes('Luakeeper VM v10') || code.includes('Dual XOR')) {
    try {
      // 시드 4개 추출
      const constMatch = code.match(/local\s+_C\s*=\s*\{([\s\S]*?)\n\s*\}/);
      if (!constMatch) throw new Error('_C 테이블 없음');
      const cBody = constMatch[1];
      const cNums = [...cBody.matchAll(/\[(\d+)\]\s*=\s*(\d+)/g)].map(m => ({ idx: parseInt(m[1], 10), val: parseInt(m[2], 10) }));
      const cMap = {};
      cNums.forEach(({idx, val}) => cMap[idx] = val);
      
      const realSeed1 = cMap[1] ^ cMap[2];
      const realSeed2 = cMap[3] ^ cMap[4];

      // 데이터 테이블 추출
      const dataMatch = code.match(/local\s+_D\s*=\s*\{([\s\S]*?)\n\s*\}/);
      if (!dataMatch) throw new Error('_D 테이블 없음');
      const dBody = dataMatch[1];
      const strMatches = [...dBody.matchAll(/"([^"]*)"/g)].map(m => m[1]);
      
      // 'D'로 시작하는 진짜 청크만
      const realChunks = strMatches
        .filter(s => s.startsWith('D'))
        .map(s => s.substring(1));
      
      if (realChunks.length === 0) throw new Error('진짜 데이터 없음');
      
      const decoded = decodeHex(realChunks.join(''), realSeed1, realSeed2);
      return { code: decoded, log: ['[성공] Luakeeper VM v10 (Dual XOR) 복원'], isRaw: false };
    } catch (e) {
      log.push('[실패] VM v10: ' + e.message);
    }
  }

  // [2] VM v9 (Single XOR, 이전 버전)
  if (code.includes('Luakeeper VM v9') || code.includes('_VM.STATE')) {
    try {
      const seedMatch = code.match(/_VM\.CONST\s*=\s*\{[\s\S]*?\[1\]\s*=\s*(\d+)\s*,[\s\S]*?\[2\]\s*=\s*(\d+)/);
      if (!seedMatch) throw new Error('시드 없음');
      const realSeed = parseInt(seedMatch[1], 10) ^ parseInt(seedMatch[2], 10);
      
      const dataMatch = code.match(/_VM\.DATA\s*=\s*\{([\s\S]*?)\n\s*\}/);
      if (!dataMatch) throw new Error('데이터 없음');
      const strMatches = [...dataMatch[1].matchAll(/"([^"]*)"/g)].map(m => m[1]);
      const realChunks = strMatches.filter(s => !s.startsWith('J_') && /^[a-fA-F0-9]+$/.test(s));
      
      if (realChunks.length === 0) throw new Error('진짜 데이터 없음');
      
      // 구버전은 single XOR이라 이 함수로 복호화 (seed2 = 0 처리 필요)
      // 이전 v9 형식으로 디코딩 시도
      const byteLen = realChunks.join('').length / 2;
      const hex = realChunks.join('');
      const outBytes = new Uint8Array(byteLen);
      let k = realSeed;
      for (let i = 0; i < byteLen; i++) {
        const b = parseInt(hex.substr(i*2, 2), 16);
        outBytes[i] = b ^ k;
        k = (k * 31 + i + 13) & 0xFF;
      }
      const decoded = new TextDecoder('utf-8', { fatal: false }).decode(outBytes);
      return { code: decoded, log: ['[성공] Luakeeper VM v9 복원'], isRaw: false };
    } catch (e) { log.push('[실패] v9: ' + e.message); }
  }

  // [3] Luakeeper v7/v8
  if (code.includes('_x == 5') && code.includes('_x == 1')) {
    const seedMatch = code.match(/_k\s*=\s*bit32\.bxor\((\d+),\s*(\d+)\)/);
    const hexMatches = code.match(/"[a-fA-F0-9]{10,}"/g);
    if (seedMatch && hexMatches) {
      const realSeed = parseInt(seedMatch[1], 10) ^ parseInt(seedMatch[2], 10);
      const chunks = hexMatches.map(h => h.replace(/"/g, ''));
      try {
        // v7/v8은 single XOR
        const hex = chunks.join('');
        const byteLen = hex.length / 2;
        const outBytes = new Uint8Array(byteLen);
        let k = realSeed;
        for (let i = 0; i < byteLen; i++) {
          const b = parseInt(hex.substr(i*2, 2), 16);
          outBytes[i] = b ^ k;
          k = (k * 31 + i + 13) & 0xFF;
        }
        const decoded = new TextDecoder('utf-8', { fatal: false }).decode(outBytes);
        return { code: decoded, log: ['[성공] Luakeeper v7/v8 복원'], isRaw: false };
      } catch (e) { log.push('[실패] v7/v8: ' + e.message); }
    }
  }

  // [4] Chanhyuk
  if (code.includes('chanhyuk lua') || (code.includes('local n=') && code.includes('local o=') && code.includes('local k='))) {
    try {
      const nMatch = code.match(/local\s+n\s*=\s*\{([\s\S]*?)\}\s*local\s+o/);
      const oMatch = code.match(/local\s+o\s*=\s*\{([\s\S]*?)\}\s*local\s+k/);
      const kMatch = code.match(/local\s+k\s*=\s*(\d+)/);
      const qMatch = code.match(/local\s+q\s*=\s*(\d+)/);
      const aMatch = code.match(/local\s+a\s*=\s*\{([\s\S]*?)\}\s*local\s+g/);
      if (nMatch && oMatch && kMatch && qMatch && aMatch) {
        const nStrings = extractLuaStrings(nMatch[1]);
        const oArr = [...oMatch[1].matchAll(/\d+/g)].map(m => parseInt(m[0], 10));
        const k = parseInt(kMatch[1], 10), q = parseInt(qMatch[1], 10);
        const aArr = [...aMatch[1].matchAll(/\d+/g)].map(m => parseInt(m[0], 10));
        function decCH(s, k, q, a) {
          let r = "", j = 1;
          for (let i = 0; i < s.length; i += 2) {
            const v = (s.charCodeAt(i) - 33) * 95 + (s.charCodeAt(i + 1) - 33);
            let idx = (v - k - (((j - 1) * q) % 251) - a[((j - 1) % a.length)] + 512) % 256;
            if (idx < 0) idx += 256;
            r += String.fromCharCode(idx);
            j++;
          }
          return r;
        }
        let decoded = "";
        for (let i = 0; i < oArr.length; i++) {
          const idx = oArr[i] - 1;
          if (nStrings[idx]) decoded += decCH(nStrings[idx], k, q, aArr);
        }
        return { code: decoded, log: ['[성공] Chanhyuk 복원'], isRaw: false };
      }
    } catch (e) { log.push('[실패] Chanhyuk'); }
  }

  // [5] 휴리스틱
  const charRegex = /string\.char\s*\(\s*([0-9,\s]+)\s*\)/g;
  if (charRegex.test(code)) {
    code = code.replace(charRegex, (m, p1) => {
      try {
        const bytes = p1.split(',').map(n => parseInt(n.trim(), 10));
        const text = new TextDecoder('utf-8').decode(new Uint8Array(bytes));
        return '"' + text.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"';
      } catch { return m; }
    });
    log.push('[성공] string.char');
  }

  const loadRegex = /(?:loadstring|load)\(\s*(["'])([\s\S]*?)\1\s*\)/;
  const loadMatch = code.match(loadRegex);
  if (loadMatch && loadMatch[2]) {
    let inner = loadMatch[2].replace(/\\(\d{1,3})/g, (m, p1) => String.fromCharCode(parseInt(p1, 10)));
    inner = inner.replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\'/g, "'");
    out += `-- ==========================================\n-- [loadstring 내부]\n-- ==========================================\n${inner}\n`;
    log.push('[성공] loadstring');
  }

  if (log.length === 0) {
    log.push('[정보] 알 수 없는 패턴');
    return { code: code, log, isRaw: true };
  }
  if (out.length > 0) {
    out += `-- ==========================================\n-- [원본]\n-- ==========================================\n${code}`;
    return { code: out, log, isRaw: false };
  }
  return { code: code, log, isRaw: false };
}

/* ============ 이벤트 ============ */
$('btnProcess').onclick = () => {
  const input = $('input').value;
  if (!input.trim()) { setStatus('[오류] 입력 없음', 'error'); $('output').value = ''; updateStats(); return; }
  try {
    if (MODE === 'obfuscate') {
      $('output').value = generateObfuscated(input);
      setStatus('[성공] Dual XOR VM 난독화 완료 · F9 콘솔에 로그 표시됨', 'ok');
    } else {
      const { code: r, log, isRaw } = universalDeobfuscate(input);
      $('output').value = r;
      if (isRaw) setStatus(`[경고] ${log.join(' | ')}`, 'warn');
      else setStatus(`[성공] ${log.join(' | ')}`, 'ok');
    }
  } catch (e) {
    $('output').value = `-- 오류: ${e.message}\n\n${input}`;
    setStatus(`[오류] ${e.message}`, 'error');
  }
  updateStats();
};

$('btnLoad').onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.lua,.luau,.txt,.obf,.code';
  inp.onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { $('input').value = r.result; updateStats(); setStatus(`[파일] ${f.name}`, 'info'); };
    r.readAsText(f, 'UTF-8');
  };
  inp.click();
};

$('btnSave').onclick = () => {
  const c = $('output').value;
  if (!c) return setStatus('[오류] 출력 없음', 'error');
  const b = new Blob([c], { type: 'text/plain;charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = MODE === 'obfuscate' ? 'luakeeper_protected.lua' : 'luakeeper_deobfuscated.lua';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(u);
  setStatus(`[저장] ${a.download}`, 'ok');
};

$('btnCopy').onclick = () => {
  const c = $('output').value; if (!c) return;
  navigator.clipboard.writeText(c).then(
    () => setStatus('[복사] 완료', 'info'),
    () => setStatus('[오류] 복사 실패', 'error')
  );
};

$('btnClear').onclick = () => { $('input').value = ''; $('output').value = ''; updateStats(); setStatus('[초기화]', 'idle'); };

updateStats();
setMode('deobfuscate');
</script>
