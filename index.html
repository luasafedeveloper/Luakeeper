<script>
const $ = (id) => document.getElementById(id);
let MODE = 'deobfuscate';

function setMode(m) {
  MODE = m;
  const ob = $('tabObf'), de = $('tabDeobf');
  if (m === 'obfuscate') {
    ob.className = 'tab-active px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold transition-all';
    de.className = 'px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white';
    $('input').placeholder = '-- Luau 소스를 여기에 붙여넣으세요...';
    setStatus('Obfuscate 모드 · 다중 VM 난독화를 적용합니다.', 'idle');
  } else {
    de.className = 'tab-active px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold transition-all';
    ob.className = 'px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white';
    $('input').placeholder = '-- 디컴파일할 난독화 코드를 붙여넣으세요...';
    setStatus('Deobfuscate 모드 · MoonVeil/Luraph/Moonsec VM 구조를 분석합니다.', 'idle');
  }
}
$('tabObf').onclick = () => setMode('obfuscate');
$('tabDeobf').onclick = () => setMode('deobfuscate');

function setStatus(msg, type = 'idle') {
  const el = $('status');
  const colors = {
    idle: 'text-gray-400 border-[#1e2633]',
    ok: 'text-green-400 border-green-800/50',
    error: 'text-red-400 border-red-800/50',
    info: 'text-cyan-300 border-cyan-800/50',
    warn: 'text-yellow-400 border-yellow-800/50'
  };
  el.className = 'mt-3 px-3 py-2 rounded-md border bg-[#0d1117] text-sm min-h-[42px] flex items-center ' + (colors[type] || colors.idle);
  el.textContent = msg;
}

function updateStats() {
  const inp = $('input').value, out = $('output').value;
  const inB = new TextEncoder().encode(inp).length;
  const outB = new TextEncoder().encode(out).length;
  $('inStats').textContent  = `${inp.split('\n').length} lines · ${inB.toLocaleString()} B`;
  $('outStats').textContent = `${out.split('\n').length} lines · ${outB.toLocaleString()} B`;
  $('stats').textContent = `IN ${inB.toLocaleString()} B → OUT ${outB.toLocaleString()} B`;
}
$('input').addEventListener('input', updateStats);

/* ============ Dual XOR ============ */
function encodeSource(src, seed1, seed2) {
  const bytes = new TextEncoder().encode(src);
  const enc = new Uint8Array(bytes.length);
  let k1 = seed1 & 0xFF, k2 = seed2 & 0xFF;
  for (let i = 0; i < bytes.length; i++) {
    let v = bytes[i] ^ k1; k1 = (k1 * 31 + i + 13) & 0xFF;
    let v2 = v ^ k2; k2 = (k2 * 17 + i + 7) & 0xFF;
    enc[i] = v2;
  }
  let hex = '';
  for (let i = 0; i < enc.length; i++) hex += enc[i].toString(16).padStart(2, '0');
  return hex;
}

function decodeDualXOR(hex, seed1, seed2) {
  if (hex.length % 2 !== 0) throw new Error('Hex 홀수');
  const byteLen = hex.length / 2;
  const out = new Uint8Array(byteLen);
  let k1 = seed1 & 0xFF, k2 = seed2 & 0xFF;
  for (let i = 0; i < byteLen; i++) {
    const b = parseInt(hex.substr(i * 2, 2), 16);
    if (isNaN(b)) throw new Error(`bad hex @${i*2}`);
    let v = b ^ k2; k2 = (k2 * 17 + i + 7) & 0xFF;
    let v2 = v ^ k1; k1 = (k1 * 31 + i + 13) & 0xFF;
    out[i] = v2;
  }
  return new TextDecoder('utf-8', { fatal: false }).decode(out);
}

/* ============ 랜덤 헬퍼 ============ */
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randVar() { return "_" + Math.random().toString(36).substring(2, 6); }
function randMarker() {
  const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  return A[randInt(0,25)] + A[randInt(0,25)];
}

/* ============ v14 VM 난독화 (MoonVeil/Luraph 스타일) ============ */
function generateObfuscated(source) {
  const seed1 = randInt(1, 255);
  const seed2 = randInt(1, 255);
  const fakeA1 = randInt(10, 200);
  const fakeB1 = seed1 ^ fakeA1;
  const fakeA2 = randInt(10, 200);
  const fakeB2 = seed2 ^ fakeA2;

  // 2단계 인코딩 (다중 VM 레이어)
  const hex = encodeSource(source, seed1, seed2);

  const CHUNK_SIZE = 8192;
  const chunks = [];
  for (let i = 0; i < hex.length; i += CHUNK_SIZE) chunks.push(hex.slice(i, i + CHUNK_SIZE));
  if (chunks.length === 0) chunks.push('');

  const markerD = randMarker();
  let markerJ = randMarker();
  while (markerJ === markerD) markerJ = randMarker();

  const dataLines = [];
  for (let i = 0; i < chunks.length; i++) {
    dataLines.push(`"${markerD}${chunks[i]}"`);
    if (i % 3 === 0 && i < chunks.length - 1) {
      dataLines.push(`"${markerJ}${randInt(100, 999)}${Math.random().toString(36).substring(2, 6)}"`);
    }
  }

  // ★ VM 레이어 2: opcode 테이블 (랜덤 순열)
  const opcodes = [1, 2, 3, 4, 5, 6, 7, 8];
  const shuffled = [...opcodes].sort(() => Math.random() - 0.5);
  const opcodeTable = shuffled.map((v, i) => `[${i + 1}]=${v}`).join(',');

  const vS = randVar();   // state
  const vL = randVar();   // loader
  const vP = randVar();   // parts
  const vK1 = randVar();  // key1
  const vK2 = randVar();  // key2
  const vR = randVar();   // result
  const vC = randVar();   // const
  const vD = randVar();   // data
  const vH = randVar();   // hex
  const vA = randVar();   // keyA
  const vB = randVar();   // keyB
  const vO = randVar();   // output
  const vF = randVar();   // fn
  const vI = randVar();   // index
  const vJ = randVar();   // byte
  const vX = randVar();   // xor
  const vN = randVar();   // count
  const vOP = randVar();  // opcode table

  const states = new Set();
  while (states.size < 5) states.add(randInt(100, 9999));
  const [sInit, s1, s2, s3, s4] = [...states];

  const idxs = new Set();
  while (idxs.size < 4) idxs.add(randInt(100, 9999));
  const [i1, i2, i3, i4] = [...idxs];

  const deadBranches = [];
  for (let i = 0; i < 12; i++) {
    deadBranches.push(`elseif ${vS}==${-randInt(100,999)}then return`);
  }

  // ★ 최종 v14 코드 (VM 디스패처 스타일 - 상태머신 + 가짜 opcode)
  return `-- Obfuscated by LuaKeeper v14
local ${vS},${vL},${vP},${vK1},${vK2},${vR}=${sInit},nil,{},0,0,nil
local ${vOP}={${opcodeTable}}
pcall(function()${vL}=rawget(getfenv(),"loadstring")or rawget(getfenv(),"load")end)
if type(${vL})~="function"then return end
if type(bit32)~="table"then return end
local ${vC}={[${i1}]=${fakeA1},[${i2}]=${fakeB1},[${i3}]=${fakeA2},[${i4}]=${fakeB2}}
local ${vD}={
${dataLines.join(',\n')}
}
-- 가짜 opcode 매핑을 통한 상태머신 (Luraph 스타일)
local ${vX}=function(${vI}) return ${vOP}[(${vI}%8)+1] end
while ${vS}~=0 do
if ${vS}==${s1} then
${vK1}=bit32.bxor(${vC}[${i1}],${vC}[${i2}])
${vK2}=bit32.bxor(${vC}[${i3}],${vC}[${i4}])
${vS}=${s2}
elseif ${vS}==${s2} then
local ${vH}={}
for ${vI}=1,#${vD} do
local ${vJ}=${vD}[${vI}]
if type(${vJ})=="string"and string.sub(${vJ},1,2)=="${markerD}"then ${vH}[#${vH}+1]=string.sub(${vJ},3)end
end
${vP}=${vH}
${vD}=nil
${vS}=${s3}
elseif ${vS}==${s3} then
local ${vJ}=table.concat(${vP})
${vP}=nil
local ${vA}=${vK1}
local ${vB}=${vK2}
local ${vO}={}
local ${vN}=1
for ${vI}=1,#${vJ},2 do
local ${vX}=tonumber(string.sub(${vJ},${vI},${vI}+1),16)or 0
local ${vN}=${vN}-1
${vO}[${vN}+1]=string.char(bit32.bxor(bit32.bxor(${vX},${vB}),${vA}))
${vB}=(${vB}*17+${vN}+7)%256
${vA}=(${vA}*31+${vN}+13)%256
${vN}=${vN}+2
end
${vR}=table.concat(${vO})
${vO}=nil
${vJ}=nil
${vS}=${s4}
elseif ${vS}==${s4} then
local ${vF}=${vL}(${vR})
${vR}=nil
if ${vF} then
pcall(function()
task.spawn(${vF})
end)
end
${vS}=0
${deadBranches.join('\n')}
end
end
`;
}

/* ============ v14 디컴파일러 (MoonVeil / Luraph / Moonsec VM 해체) ============ */
function extractLuaStrings(str) {
  const result = [];
  let i = 0;
  while (i < str.length) {
    if (str[i] === '"') {
      let j = i + 1, current = "";
      while (j < str.length && str[j] !== '"') {
        if (str[j] === '\\') {
          if (str[j+1] === '"') { current += '"'; j += 2; }
          else if (str[j+1] === '\\') { current += '\\'; j += 2; }
          else { current += str[j+1]; j += 2; }
        } else { current += str[j]; j++; }
      }
      result.push(current);
      i = j + 1;
    } else i++;
  }
  return result;
}

/* VM 디스패처 자동 해체 (Luraph / MoonVeil / Moonsec 스타일) */
function devirtualize(code) {
  let log = [];
  let result = code;

  // 1) VM 바이트코드 컨테이너 탐지 (base64 또는 hex로 인코딩된 대용량 문자열)
  const vmContainerRegex = /local\s+([a-zA-Z_]\w*)\s*=\s*["']([A-Za-z0-9+\/=\\x]{500,})["']/g;
  let m;
  while ((m = vmContainerRegex.exec(code)) !== null) {
    const varName = m[1];
    const encoded = m[2];
    
    // Hex 시도
    if (/^[a-fA-F0-9]+$/.test(encoded) && encoded.length % 2 === 0) {
      try {
        const decoded = decodeDualXOR(encoded, 1, 1); // 시드 1,1로 시도
        if (/[a-zA-Z]/.test(decoded) && decoded.includes('function')) {
          log.push(`[VM] Hex 컨테이너 ${varName} → 평문 추출 성공`);
          result = result.replace(m[0], `local ${varName} = [[\n${decoded}\n]]`);
        }
      } catch (e) {}
    }
    
    // Base64 시도
    try {
      const decoded = atob(encoded);
      if (/[a-zA-Z]/.test(decoded) && decoded.includes('function')) {
        log.push(`[VM] Base64 컨테이너 ${varName} → 평문 추출 성공`);
        result = result.replace(m[0], `local ${varName} = [[\n${decoded}\n]]`);
      }
    } catch (e) {}
  }

  // 2) VM opcode 테이블 탐지 및 복원
  const opcodeRegex = /local\s+([a-zA-Z_]\w*)\s*=\s*\{([\d,\s]{20,})\}/g;
  while ((m = opcodeRegex.exec(code)) !== null) {
    const arr = m[2].split(',').map(v => parseInt(v.trim(), 10)).filter(v => !isNaN(v));
    if (arr.length > 10 && arr.length < 100) {
      log.push(`[VM] opcode 테이블 ${m[1]} (${arr.length}개) 탐지`);
    }
  }

  // 3) 상수 풀 추출 (MoonVeil ConstantArray)
  const constPoolRegex = /local\s+([a-zA-Z_]\w*)\s*=\s*\{((?:\s*["'][^"']*["']\s*,?\s*){10,})\}/g;
  while ((m = constPoolRegex.exec(code)) !== null) {
    const strs = extractLuaStrings(m[2]);
    if (strs.length > 10) {
      log.push(`[VM] 상수 풀 ${m[1]} (${strs.length}개) → 디코딩 시도`);
      // 각 문자열이 Hex/Base64일 수 있으므로 시도
      let decodedAll = '';
      for (const s of strs) {
        if (/^[a-fA-F0-9]+$/.test(s) && s.length % 2 === 0) {
          try { decodedAll += decodeDualXOR(s, 1, 1); } catch (e) {}
        } else {
          try { decodedAll += atob(s); } catch (e) { decodedAll += s; }
        }
      }
      if (/[a-zA-Z]/.test(decodedAll)) {
        result = result.replace(m[0], `local ${m[1]} = [[\n${decodedAll}\n]]`);
      }
    }
  }

  return { code: result, log };
}

function universalDeobfuscate(code) {
  let log = [], out = '';

  // ===== [1] LuaKeeper v14 (구조 인식) =====
  if (code.includes('Obfuscated by LuaKeeper v14')) {
    try {
      const constMatch = code.match(/local\s+([a-zA-Z_]\w*)\s*=\s*\{([^}]+)\}/);
      if (constMatch) {
        const nums = {};
        [...constMatch[2].matchAll(/\[(\d+)\]\s*=\s*(\d+)/g)].forEach(m => nums[+m[1]] = +m[2]);
        const vals = Object.values(nums);
        if (vals.length >= 4) {
          const seed1 = vals[0] ^ vals[1];
          const seed2 = vals[2] ^ vals[3];
          
          const dataMatch = code.match(/local\s+[a-zA-Z_]\w*\s*=\s*\{([\s\S]*?)\n\s*\}/);
          if (dataMatch) {
            const strArr = [...dataMatch[1].matchAll(/"([^"]*)"/g)].map(m => m[1]);
            const markerD = strArr[0]?.substring(0, 2);
            if (markerD) {
              const real = strArr.filter(s => s.startsWith(markerD)).map(s => s.substr(2));
              const validHex = real.filter(s => /^[a-fA-F0-9]+$/.test(s));
              if (validHex.length > 0) {
                return { code: decodeDualXOR(validHex.join(''), seed1, seed2), log: ['[성공] LuaKeeper v14 복원'], isRaw: false };
              }
            }
          }
        }
      }
    } catch (e) { log.push('[실패] v14: ' + e.message); }
  }

  // ===== [2] MoonVeil / Luraph / Moonsec VM 해체 =====
  if (code.includes('MoonVeil') || code.includes('moonveil') || 
      code.includes('Luraph') || code.includes('Moonsec') ||
      (code.includes('return({function') && code.includes('a.ia['))) {
    
    log.push('[VM] MoonVeil/Luraph/Moonsec 시그니처 감지');
    
    // VM 디스패처 해체 시도
    const devirt = devirtualize(code);
    if (devirt.log.length > 0) {
      log.push(...devirt.log);
      code = devirt.code;
    }

    // VM 디스패처 루프 탐지 및 구조화
    const dispatchRegex = /while\s+([a-zA-Z_]\w*)\s*~=\s*0\s+do([\s\S]*?)\bend\b/g;
    let dm;
    while ((dm = dispatchRegex.exec(code)) !== null) {
      const stateVar = dm[1];
      const body = dm[2];
      
      // if/elseif 체인 추출
      const branchRegex = /if\s+\1\s*==\s*(\d+)\s+then([\s\S]*?)(?=elseif\s+\1\s*==|else|end)/g;
      let bm, branches = [];
      while ((bm = branchRegex.exec(body)) !== null) {
        branches.push({ state: parseInt(bm[1], 10), body: bm[2].trim() });
      }
      
      if (branches.length > 3) {
        log.push(`[VM] 디스패처 ${stateVar} → ${branches.length}개 상태 추출`);
        branches.sort((a, b) => a.state - b.state);
        out += `-- [VM 디스패처 ${stateVar} 해체 결과]\n`;
        out += branches.map(b => `-- [State ${b.state}]\n${b.body}`).join('\n\n') + '\n\n';
      }
    }

    // opcode 테이블 복원 시도
    const opcodeTableRegex = /local\s+([a-zA-Z_]\w*)\s*=\s*\{([\d,\s]{20,})\}/g;
    let om;
    while ((om = opcodeTableRegex.exec(code)) !== null) {
      const arr = om[2].split(',').map(v => parseInt(v.trim(), 10)).filter(v => !isNaN(v));
      if (arr.length > 10 && arr.length < 100) {
        log.push(`[VM] opcode 테이블 ${om[1]}: [${arr.join(', ')}]`);
      }
    }
  }

  // ===== [3] Chanhyuk lua =====
  if (code.includes('chanhyuk lua') || (code.includes('local n=') && code.includes('local o='))) {
    try {
      const nMatch = code.match(/local\s+n\s*=\s*\{([\s\S]*?)\}\s*local\s+o/);
      const oMatch = code.match(/local\s+o\s*=\s*\{([\s\S]*?)\}\s*local\s+k/);
      const kMatch = code.match(/local\s+k\s*=\s*(\d+)/);
      const qMatch = code.match(/local\s+q\s*=\s*(\d+)/);
      const aMatch = code.match(/local\s+a\s*=\s*\{([\s\S]*?)\}\s*local\s+g/);
      if (nMatch && oMatch && kMatch && qMatch && aMatch) {
        const nStrings = extractLuaStrings(nMatch[1]);
        const oArr = [...oMatch[1].matchAll(/\d+/g)].map(mm => parseInt(mm[0], 10));
        const k = parseInt(kMatch[1], 10), q = parseInt(qMatch[1], 10);
        const aArr = [...aMatch[1].matchAll(/\d+/g)].map(mm => parseInt(mm[0], 10));
        function decCH(s, k, q, a) {
          let r = "", j = 1;
          for (let i = 0; i < s.length; i += 2) {
            const v = (s.charCodeAt(i) - 33) * 95 + (s.charCodeAt(i + 1) - 33);
            let idx = (v - k - (((j - 1) * q) % 251) - a[((j - 1) % a.length)] + 512) % 256;
            if (idx < 0) idx += 256;
            r += String.fromCharCode(idx); j++;
          }
          return r;
        }
        let decoded = "";
        for (let i = 0; i < oArr.length; i++) {
          const idx = oArr[i] - 1;
          if (nStrings[idx]) decoded += decCH(nStrings[idx], k, q, aArr);
        }
        return { code: decoded, log: ['[성공] Chanhyuk lua'], isRaw: false };
      }
    } catch (e) { log.push('[실패] Chanhyuk'); }
  }

  // ===== [4] 다중 loadstring =====
  let iter = 0;
  const loadRegex = /(?:loadstring|load)\s*\(\s*(["'])([\s\S]*?)\1\s*\)/;
  let loadMatch;
  while ((loadMatch = code.match(loadRegex)) && iter < 8) {
    let inner = loadMatch[2].replace(/\\(\d{1,3})/g, (m, p1) => String.fromCharCode(parseInt(p1, 10)));
    inner = inner.replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\'/g, "'");
    if (inner === loadMatch[2]) break;
    code = inner; iter++;
  }
  if (iter > 0) log.push(`[성공] loadstring x${iter}`);

  // ===== [5] base64 =====
  const b64Regex = /base64,([A-Za-z0-9+\/=]{20,})/g;
  if (b64Regex.test(code)) {
    code = code.replace(b64Regex, (m, b64) => {
      try { return '"' + atob(b64).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"'; }
      catch { return m; }
    });
    log.push('[성공] base64');
  }

  // ===== [6] string.char =====
  const charRegex = /string\.char\s*\(\s*([0-9,\s]+)\s*\)/g;
  if (charRegex.test(code)) {
    code = code.replace(charRegex, (m, p1) => {
      try {
        const bytes = p1.split(',').map(n => parseInt(n.trim(), 10));
        return '"' + new TextDecoder('utf-8').decode(new Uint8Array(bytes)).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"';
      } catch { return m; }
    });
    log.push('[성공] string.char');
  }

  // ===== [7] string.reverse =====
  const revRegex = /string\.reverse\s*\(\s*(["'])([\s\S]*?)\1\s*\)/g;
  if (revRegex.test(code)) {
    code = code.replace(revRegex, (m, q, s) => '"' + s.split('').reverse().join('').replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"');
    log.push('[성공] string.reverse');
  }

  // ===== [8] string.rep =====
  const repRegex = /string\.rep\s*\(\s*(["'])([\s\S]*?)\1\s*,\s*(\d+)\s*\)/g;
  if (repRegex.test(code)) {
    code = code.replace(repRegex, (m, q, s, n) => '"' + s.repeat(parseInt(n, 10)).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"');
    log.push('[성공] string.rep');
  }

  // ===== [9] table.concat =====
  const tcRegex = /table\.concat\s*\(\s*\{([^}]+)\}\s*(?:,\s*["'][^"']*["'])?\s*\)/g;
  if (tcRegex.test(code)) {
    code = code.replace(tcRegex, (m, inner) => {
      const strs = [...inner.matchAll(/"([^"]*)"/g)].map(mm => mm[1]);
      return strs.length > 0 ? '"' + strs.join('').replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"' : m;
    });
    log.push('[성공] table.concat');
  }

  // 결과 조합
  if (log.length === 0) {
    log.push('[정보] 알려진 패턴 없음');
    return { code: code, log, isRaw: true };
  }
  if (out.length > 0) {
    out += code;
    return { code: out, log, isRaw: false };
  }
  if (iter > 0) {
    return { code: code, log, isRaw: false };
  }
  return { code: code, log, isRaw: false };
}

/* ============ 이벤트 ============ */
$('btnProcess').onclick = () => {
  const input = $('input').value;
  if (!input.trim()) { setStatus('[오류] 입력 없음', 'error'); $('output').value = ''; updateStats(); return; }
  try {
    if (MODE === 'obfuscate') {
      $('output').value = generateObfuscated(input);
      setStatus('[성공] v14 VM 난독화 완료 · 다중 레이어 + 랜덤 opcode 테이블 적용', 'ok');
    } else {
      const { code: r, log, isRaw } = universalDeobfuscate(input);
      $('output').value = r;
      if (isRaw) setStatus(`[경고] ${log.join(' | ')}`, 'warn');
      else setStatus(`[성공] ${log.join(' | ')}`, 'ok');
    }
  } catch (e) {
    $('output').value = `-- 오류: ${e.message}\n\n${input}`;
    setStatus(`[오류] ${e.message}`, 'error');
  }
  updateStats();
};

$('btnLoad').onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.lua,.luau,.txt,.obf,.code';
  inp.onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { $('input').value = r.result; updateStats(); setStatus(`[파일] ${f.name}`, 'info'); };
    r.readAsText(f, 'UTF-8');
  };
  inp.click();
};

$('btnSave').onclick = () => {
  const c = $('output').value;
  if (!c) return setStatus('[오류] 출력 없음', 'error');
  const b = new Blob([c], { type: 'text/plain;charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = MODE === 'obfuscate' ? 'luakeeper_protected.lua' : 'luakeeper_deobfuscated.lua';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(u);
  setStatus(`[저장] ${a.download}`, 'ok');
};

$('btnCopy').onclick = () => {
  const c = $('output').value; if (!c) return;
  navigator.clipboard.writeText(c).then(
    () => setStatus('[복사] 완료', 'info'),
    () => setStatus('[오류] 복사 실패', 'error')
  );
};

$('btnClear').onclick = () => { $('input').value = ''; $('output').value = ''; updateStats(); setStatus('[초기화]', 'idle'); };

updateStats();
setMode('deobfuscate');
</script>
