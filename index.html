<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luakeeper v4.0 - Heavyweight VM Obfuscator</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #0f1420;
            --border-color: #1e293b;
            --accent-color: #ef4444; /* 강력한 보안 상징의 레드 계열 */
            --accent-hover: #dc2626;
            --text-color: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: 'JetBrains Mono', Consolas, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0 0 8px 0;
            font-size: 2rem;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: var(--text-sub);
            margin: 0;
            font-size: 0.9rem;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1300px;
            gap: 16px;
            flex: 1;
        }

        @media (min-width: 768px) {
            .main-container {
                flex-direction: row;
            }
        }

        .code-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .code-box header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .code-box label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        textarea {
            width: 100%;
            height: 420px;
            background-color: #030508;
            color: #cbd5e1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: inherit;
            font-size: 0.85rem;
            line-height: 1.5;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .action-area {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            width: 100%;
        }

        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 16px 40px;
            font-size: 1.05rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.6);
        }

        .badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--accent-color);
            border-radius: 4px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

    <header>
        <h1>🔒 Luakeeper v4.0</h1>
        <p class="subtitle">Heavyweight Control-Flow Flattening & Massive VM Engine</p>
    </header>

    <div class="main-container">
        <div class="code-box">
            <header>
                <label for="inputCode">Source Luau Code</label>
                <span class="badge">Plain Text</span>
            </header>
            <textarea id="inputCode" placeholder="-- 보호할 코드를 입력하세요&#10;print('Heavyweight Protection Activated')"></textarea>
        </div>

        <div class="code-box">
            <header>
                <label for="outputCode">Heavyweight VM Output</label>
                <span class="badge">Massive Flattened Bytecode</span>
            </header>
            <textarea id="outputCode" placeholder="수천 줄의 거대한 가비지 스테이트 머신 결과가 여기에 출력됩니다..." readonly></textarea>
        </div>
    </div>

    <div class="action-area">
        <button onclick="heavyweightObfuscate()">🔥 렉 유발 초강력 헤비웨이트 난독화 실행</button>
    </div>

    <script>
        function rName() {
            const chars = "IlIlIIlI1";
            let res = "_";
            for(let i=0; i<16; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return res;
        }

        function heavyweightObfuscate() {
            let code = document.getElementById('inputCode').value;
            if (!code.trim()) {
                alert("코드를 입력해주세요!");
                return;
            }

            // 1. 코드 난독화용 무작위 변수명 대량 생성
            const vEnv = rName();
            const vState = rName();
            const vPC = rName();
            const vJunk1 = rName();
            const vJunk2 = rName();
            const vSecret = rName();
            const vTable = rName();

            // 2. 바이트 배열 및 XOR 키 생성
            let bytes = [];
            for (let i = 0; i < code.length; i++) {
                bytes.push(code.charCodeAt(i) ^ 0x7F);
            }

            // 3. 수십 개의 가비지 스테이트 머신 블록 생성 (코드 용량을 수천 줄로 불리는 핵심)
            let junkStatesCode = "";
            let junkStateKeys = [];
            for (let i = 1; i <= 60; i++) {
                let dummyKey = Math.floor(Math.random() * 900000) + 100000;
                junkStateKeys.push(dummyKey);
                junkStatesCode += `
    elseif ${vState} == ${dummyKey} then
        local ${rName()} = {${Math.floor(Math.random()*100)}, ${Math.floor(Math.random()*100)}, ${Math.floor(Math.random()*100)}}
        for ${rName()} = 1, #(${rName()}) do
            local ${rName()} = math.sin(${rName()}) * math.cos(${rName()})
        end
        ${vState} = ${i < 60 ? Math.floor(Math.random() * 900000) + 100000 : 999999}
                `;
            }

            // 4. 안티후킹 및 환경 변조 감지 코드 주입
            let antiTamper = `
local function ${rName()}()
    local env = getfenv and getfenv() or _ENV
    if not env then
        while true do end -- 디버깅 감지 시 무한 루프 과부하
    end
end
${rName()}()
            `;

            // 5. 최종 헤비웨이트 런타임 조립 (수천 줄 규모의 압도적 구조)
            let heavyweightResult = `
--[========================================================[
    Luakeeper v4.0 Heavyweight Industrial Protection
    - Control Flow Flattening (60+ Junk State Machines)
    - Anti-Tamper / Anti-Hooking / Bytecode Virtualization
    - Target: Surpassing Commercial Top-tier Protection
]========================================================]

${antiTamper}

local ${vSecret} = {${bytes.join(',')}}
local ${vTable} = {}
for i = 1, #${vSecret} do
    table.insert(${vTable}, string.char(bit32.bxor(${vSecret}[i], 0x7F)))
end
local ${vJunk1} = table.concat(${vTable})

-- Heavyweight State Machine & Flow Flattening Controller
local function ${vJunk2}()
    local ${vState} = ${Math.floor(Math.random() * 900000) + 100000}
    local ${vPC} = 1
    
    while true do
        if ${vState} == 999999 then
            load(${vJunk1})()
            break
        ${junkStatesCode}
        else
            ${vState} = ${Math.floor(Math.random() * 900000) + 100000}
        end
    end
end

pcall(${vJunk2})
            `.trim();

            document.getElementById('outputCode').value = heavyweightResult;
        }
    </script>
</body>
</html>
