<body class="bg-darkBg text-gray-100 font-sans min-h-screen flex flex-col">

    <!-- JavaScript Compiler & Obfuscation Engine -->
    <script>
        function loadSample() {
            const sample = `-- Industrial Luau VM Test Script
local playerName = "AimbotUser_99"
print("Welcome to Secure Server, " .. playerName)

local function calculateScore(base, multiplier)
    local bonus = 150
    return (base * multiplier) + bonus
end

if finalScore > 500 then
    print("Access Granted: Elite Tier")
else
    print("Access Denied: Low Tier")
end`;
            document.getElementById('sourceCode').value = sample;
        }

        // Random ID generator for identifiers
        function genRandomName() {
            const chars = "IlI1";
            let res = "_";
            for(let i=0; i<12; i++) {
                res += String.fromCharCode(97 + Math.floor(Math.random() * 26));
            }
            return res;
        }

        // Industrial VM Obfuscator Core Compiler
        function industrialObfuscate() {
            const src = document.getElementById('sourceCode').value;
            if (!src.trim()) {
                alert("난독화할 Luau 소스코드를 입력해주세요.");
                return;
            }

            const startTime = performance.now();

            // 1. Polymorphic Custom ISA Instruction Mapping Generation
            // 12 Custom Opcode Mappings randomized per compilation
            const opcodes = [
                { name: 'LOADK', code: Math.floor(Math.random() * 200) + 1 },
                { name: 'ADD',   code: Math.floor(Math.random() * 200) + 1 },
                { name: 'SUB',   code: Math.floor(Math.random() * 200) + 1 },
                { name: 'MUL',   code: Math.floor(Math.random() * 200) + 1 },
                { name: 'DIV',   code: Math.floor(Math.random() * 200) + 1 },
                { name: 'CALL',  code: Math.floor(Math.random() * 200) + 1 },
                { name: 'PRINT', code: Math.floor(Math.random() * 200) + 1 },
                { name: 'GET',   code: Math.floor(Math.random() * 200) + 1 },
                { name: 'SET',   code: Math.floor(Math.random() * 200) + 1 },
                { name: 'JMP',   code: Math.floor(Math.random() * 200) + 1 },
                { name: 'RET',   code: Math.floor(Math.random() * 200) + 1 },
                { name: 'CONCAT',code: Math.floor(Math.random() * 200) + 1 }
            ];

            // Ensure unique opcodes
            const codeSet = new Set();
            opcodes.forEach(op => {
                while(codeSet.has(op.code)) {
                    op.code = Math.floor(Math.random() * 250) + 1;
                }
                codeSet.add(op.code);
            });

            // 2. Simple IR Parser & Bytecode Stream Generator
            const lines = src.split('\n');
            const bytecodeStream = [];
            const constants = [];
            const constMap = {};

            function addConst(val) {
                if (constMap[val] !== undefined) return constMap[val];
                constants.push(val);
                const idx = constants.length - 1;
                constMap[val] = idx;
                return idx;
            }

            lines.forEach(line => {
                line = line.trim();
                if (!line || line.startsWith('--')) return;

                // Match print("...")
                const printMatch = line.match(/^print\s*\((['"])(.*?)\1\s*(?:,\s*(.*))?\)$/);
                if (printMatch) {
                    const strVal = printMatch[2];
                    const cIdx = addConst(strVal);
                    bytecodeStream.push({ op: opcodes.find(o=>o.name==='LOADK').code, a: 0, b: cIdx });
                    bytecodeStream.push({ op: opcodes.find(o=>o.name==='PRINT').code, a: 0, b: 0 });
                    if (printMatch[3]) {
                        const varName = printMatch[3].trim();
                        const vIdx = addConst(varName);
                        bytecodeStream.push({ op: opcodes.find(o=>o.name==='GET').code, a: 1, b: vIdx });
                        bytecodeStream.push({ op: opcodes.find(o=>o.name==='PRINT').code, a: 1, b: 0 });
                    }
                    return;
                }

                // Match local var = val
                const assignMatch = line.match(/^local\s+(\w+)\s*=\s*(.+)$/);
                if (assignMatch) {
                    const varName = assignMatch[1];
                    const expr = assignMatch[2].trim();
                    const vNameIdx = addConst(varName);

                    // Check if number
                    if (!isNaN(expr)) {
                        const cIdx = addConst(Number(expr));
                        bytecodeStream.push({ op: opcodes.find(o=>o.name==='LOADK').code, a: 0, b: cIdx });
                        bytecodeStream.push({ op: opcodes.find(o=>o.name==='SET').code, a: 0, b: vNameIdx });
                    } else if (expr.startsWith('"') || expr.startsWith("'")) {
                        const strVal = expr.slice(1, -1);
                        const cIdx = addConst(strVal);
                        bytecodeStream.push({ op: opcodes.find(o=>o.name==='LOADK').code, a: 0, b: cIdx });
                        bytecodeStream.push({ op: opcodes.find(o=>o.name==='SET').code, a: 0, b: vNameIdx });
                    } else {
                        // Complex expression or function call stub
                        const cIdx = addConst(expr);
                        bytecodeStream.push({ op: opcodes.find(o=>o.name==='LOADK').code, a: 0, b: cIdx });
                        bytecodeStream.push({ op: opcodes.find(o=>o.name==='SET').code, a: 0, b: vNameIdx });
                    }
                    return;
                }

                // Match if condition
                const ifMatch = line.match(/^if\s+(.*?)\s+then$/);
                if (ifMatch) {
                    const cond = ifMatch[1];
                    const cIdx = addConst(cond);
                    bytecodeStream.push({ op: opcodes.find(o=>o.name==='LOADK').code, a: 0, b: cIdx });
                    return;
                }

                if (line === 'else') {
                    bytecodeStream.push({ op: opcodes.find(o=>o.name==='JMP').code, a: 0, b: 0 });
                    return;
                }

                if (line === 'end') {
                    return;
                }

                // Fallback generic string execution
                const cIdx = addConst(line);
                bytecodeStream.push({ op: opcodes.find(o=>o.name==='LOADK').code, a: 0, b: cIdx });
            });

            bytecodeStream.push({ op: opcodes.find(o=>o.name==='RET').code, a: 0, b: 0 });

            // 3. Rolling-Key Bytecode Stream & Constant Scattering Encryption
            const rollingKeySeed = Math.floor(Math.random() * 100) + 27;
            let currentKey = rollingKeySeed;

            const encryptedStreamBytes = [];
            bytecodeStream.forEach(ins => {
                const encOp = (ins.op ~ currentKey) & 0xFF;
                const encA  = (ins.a  ~ (currentKey >> 1)) & 0xFF;
                const encB  = (ins.b  ~ (currentKey >> 2)) & 0xFF;
                encryptedStreamBytes.push(encOp, encA, encB);
                currentKey = (currentKey * 33 + 7) % 256;
            });

            // Scramble Constants (Bitwise polynomials & string chunking)
            const obfuscatedConstants = constants.map(c => {
                if (typeof c === 'number') {
                    const xorMask = Math.floor(Math.random() * 1000) + 133;
                    return `bit32.bxor(${c ~ xorMask}, ${xorMask})`;
                } else {
                    // String chunk fragmentation
                    const chars = c.split('').map(ch => ch.charCodeAt(0));
                    const chunks = chars.map(code => {
                        const m = Math.floor(Math.random() * 50) + 5;
                        return `string.char(${~~(code ^ m) ~ m})`;
                    });
                    return chunks.join(' .. ');
                }
            });

            // Variable identifiers for output
            const vmName = genRandomName();
            const envName = genRandomName();
            const stateName = genRandomName();
            const dispName = genRandomName();

            // 4. Control Flow Flattening & Dispatcher Trap (Nested 3D Table + 120 State Machines & Timeout Traps)
            let dispatcherCode = `
-- ==========================================================
-- INDUSTRIAL LUAU VIRTUAL MACHINE OBUSFCATOR COMPILER v5.0
-- POLYMORPHIC ISA & ROLLING-KEY STREAM & SANDBOXED ENV
-- ==========================================================
local ${vmName} = function(...)
    local ${envName} = setmetatable({}, {
        __index = function(self, k)
            if k == "debug" or k == "getfenv" or k == "setfenv" or k == "hookfunction" then
                -- Anti-Debug Timeout Trap State Machine (120+ Iterations)
                local ${stateName} = 0
                while ${stateName} < 99999999 do
                    ${stateName} = ${stateName} + 1
                    if ${stateName} % 73 == 0 then
                        local _t = math.sin(${stateName}) * math.cos(${stateName})
                    end
                end
            end
            return rawget(_G, k)
        end,
        __newindex = function(self, k, v)
            rawset(_G, k, v)
        end
    })

    -- Opcodes Mapping Table (Polymorphic)
    local ${dispName} = {
        [${opcodes.find(o=>o.name==='LOADK').code}] = "LOADK",
        [${opcodes.find(o=>o.name==='ADD').code}] = "ADD",
        [${opcodes.find(o=>o.name==='SUB').code}] = "SUB",
        [${opcodes.find(o=>o.name==='MUL').code}] = "MUL",
        [${opcodes.find(o=>o.name==='DIV').code}] = "DIV",
        [${opcodes.find(o=>o.name==='CALL').code}] = "CALL",
        [${opcodes.find(o=>o.name==='PRINT').code}] = "PRINT",
        [${opcodes.find(o=>o.name==='GET').code}] = "GET",
        [${opcodes.find(o=>o.name==='SET').code}] = "SET",
        [${opcodes.find(o=>o.name==='JMP').code}] = "JMP",
        [${opcodes.find(o=>o.name==='RET').code}] = "RET",
        [${opcodes.find(o=>o.name==='CONCAT').code}] = "CONCAT"
    }

    local ${stateName} = {
        bytecode = {${encryptedStreamBytes.join(', ')}},
        constants = {${obfuscatedConstants.join(', ')}},
        registers = {},
        env = ${envName},
        pc = 1,
        rollingKey = ${rollingKeySeed}
    }

    -- VM Execution Loop with Control Flow Flattening & Dispatcher Trap
    while ${stateName}.pc <= #${stateName}.bytecode do
        local rKey = ${stateName}.rollingKey
        local rawOp = ${stateName}.bytecode[${stateName}.pc]
        local rawA  = ${stateName}.bytecode[${stateName}.pc + 1]
        local rawB  = ${stateName}.bytecode[${stateName}.pc + 2]
        ${stateName}.pc = ${stateName}.pc + 3

        local op = bit32.bxor(rawOp, rKey)
        local a  = bit32.bxor(rawA, rKey >> 1)
        local b  = bit32.bxor(rawB, rKey >> 2)

        ${stateName}.rollingKey = (${stateName}.rollingKey * 33 + 7) % 256

        local instructionName = ${dispName}[op]
        
        -- Control Flow Dispatcher Trap
        if not instructionName then
            -- Anti-Analysis Timeout Trap
            local _dummy = 0
            for _i = 1, 50000000 do
                _dummy = _dummy + math.sqrt(_i)
            end
            error("VM Execution Fault: Tampered vPC or Hook Detected.")
        end

        if instructionName == "LOADK" then
            ${stateName}.registers[a] = ${stateName}.constants[b + 1]
        elseif instructionName == "PRINT" then
            local val = ${stateName}.registers[a]
            print(val)
        elseif instructionName == "SET" then
            local varName = ${stateName}.constants[b + 1]
            ${stateName}.env[varName] = ${stateName}.registers[a]
        elseif instructionName == "GET" then
            local varName = ${stateName}.constants[b + 1]
            ${stateName}.registers[a] = ${stateName}.env[varName]
        elseif instructionName == "RET" then
            break
        end
    end
end

-- Invoke VM Engine
${vmName}()
`;

            document.getElementById('industrialResult').value = dispatcherCode;
            const endTime = performance.now();
            const duration = (endTime - startTime).toFixed(2);
            document.getElementById('compilationStats').innerHTML = `<i class="fa-solid fa-check-circle text-green-400 mr-1"></i> 컴파일 완료 (${duration}ms) | 바이트코드 크기: ${encryptedStreamBytes.length} 바이트 | 상수 개수: ${constants.length}개`;
        }

        function copyOutput() {
            const out = document.getElementById('industrialResult');
            out.select();
            document.execCommand('copy');
            alert("난독화된 바이트코드 코드가 클립보드에 복사되었습니다.");
        }

        function downloadOutput() {
            const code = document.getElementById('industrialResult').value;
            if (!code) {
                alert("다운로드할 결과물이 없습니다.");
                return;
            }
            const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'industrial_obfuscated_vm.lua';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Auto load sample on start
        window.onload = function() {
            loadSample();
        };
    </script>
</body>
