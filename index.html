<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuaKeeper | True AST VM</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --bg:#0a0d14; --border:#1e2633; --cyan:#00f0ff; }
  html,body{background-color:var(--bg);color:#c9d1d9;font-family:'Inter',system-ui,sans-serif;}
  .neon-text{color:var(--cyan);text-shadow:0 0 8px rgba(0,240,255,0.6),0 0 20px rgba(0,240,255,0.3);}
  .neon-glow{box-shadow:0 0 8px rgba(0,240,255,0.55),0 0 24px rgba(0,240,255,0.25);}
  .editor{font-family:'Consolas',monospace;background-color:#060910!important;color:#a9e6f5!important;border:1px solid var(--border);border-radius:6px;resize:none;tab-size:2;line-height:1.5;}
  .editor::placeholder{color:#3b4757;}
  .editor:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 12px rgba(0,240,255,0.15);}
  .btn-primary{background:linear-gradient(135deg,#00f0ff,#0090ff);color:#001018;font-weight:700;}
  .btn-primary:hover{filter:brightness(1.15);box-shadow:0 0 12px rgba(0,240,255,0.5);}
  .btn-ghost{background:#0d1117;border:1px solid var(--border);color:#8b949e;}
  .btn-ghost:hover{border-color:var(--cyan);color:var(--cyan);}

<body class="min-h-screen">

<header class="border-b border-[#1e2633] bg-[#0a0d14]/90 backdrop-blur sticky top-0 z-10">
  <div class="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">

    </div>

  <div id="status" class="mt-3 px-3 py-2 rounded-md border border-[#1e2633] bg-[#0d1117] text-sm text-gray-400 min-h-[42px] flex items-center">

  </div>

<script>
/* ============================================================
   LUAKEEPER v17 - 진짜 AST → Custom Bytecode → VM
   ============================================================ */
const $ = (id) => document.getElementById(id);
let MODE = 'obfuscate';

function setMode(m) {
  MODE = m;
  const ob = $('tabObf'), de = $('tabDeobf');
  if (m === 'obfuscate') {
    ob.className = 'tab-active px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold transition-all';
    de.className = 'px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white';
    $('input').placeholder = '-- Luau 소스를 여기에 붙여넣으세요...';
    setStatus('Obfuscate · AST 파싱 → 커스텀 바이트코드 → VM', 'idle');
  } else {
    de.className = 'tab-active px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold transition-all';
    ob.className = 'px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white';
    $('input').placeholder = '-- 디컴파일할 난독화 코드를 붙여넣으세요...';
    setStatus('Deobfuscate · VM 바이트코드 트레이스 역컴파일', 'idle');
  }
}
$('tabObf').onclick = () => setMode('obfuscate');
$('tabDeobf').onclick = () => setMode('deobfuscate');

function setStatus(msg, type = 'idle') {
  const el = $('status');
  const colors = {
    idle: 'text-gray-400 border-[#1e2633]',
    ok: 'text-green-400 border-green-800/50',
    error: 'text-red-400 border-red-800/50',
    info: 'text-cyan-300 border-cyan-800/50',
    warn: 'text-yellow-400 border-yellow-800/50'
  };
  el.className = 'mt-3 px-3 py-2 rounded-md border bg-[#0d1117] text-sm min-h-[42px] flex items-center ' + (colors[type] || colors.idle);
  el.textContent = msg;
}

function updateStats() {
  const inp = $('input').value, out = $('output').value;
  const inB = new TextEncoder().encode(inp).length;
  const outB = new TextEncoder().encode(out).length;
  $('inStats').textContent  = `${inp.split('\n').length} lines · ${inB.toLocaleString()} B`;
  $('outStats').textContent = `${out.split('\n').length} lines · ${outB.toLocaleString()} B`;
  $('stats').textContent = `IN ${inB.toLocaleString()} B → OUT ${outB.toLocaleString()} B`;
}
$('input').addEventListener('input', updateStats);

/* ============================================================
   1) LEXER
   ============================================================ */
const TK = { IDENT: 1, NUMBER: 2, STRING: 3, OP: 4, EOF: 5 };
const KEYWORDS = new Set(['local','if','then','else','elseif','end','while','do','for','in','return','function','and','or','not','true','false','nil','break','continue','until','repeat']);

function tokenize(src) {
  const tokens = [];
  let i = 0, n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === ' ' || c === '\t' || c === '\n' || c === '\r') { i++; continue; }
    // 주석
    if (c === '-' && src[i+1] === '-') {
      if (src[i+2] === '[' && src[i+3] === '[') {
        const end = src.indexOf(']]', i + 4);
        i = end === -1 ? n : end + 2;
      } else {
        while (i < n && src[i] !== '\n') i++;
      }
      continue;
    }
    // 문자열
    if (c === '"' || c === "'") {
      const q = c;
      let j = i + 1, val = '';
      while (j < n && src[j] !== q) {
        if (src[j] === '\\') {
          const e = src[j+1];
          if (e === 'n') val += '\n';
          else if (e === 't') val += '\t';
          else if (e === 'r') val += '\r';
          else if (e === '\\') val += '\\';
          else if (e === '"' || e === "'") val += e;
          else val += e || '';
          j += 2;
        } else { val += src[j]; j++; }
      }
      tokens.push({ type: TK.STRING, value: val });
      i = j + 1;
      continue;
    }
    // 숫자
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i+1] || ''))) {
      let j = i;
      if (c === '0' && (src[i+1] === 'x' || src[i+1] === 'X')) {
        j = i + 2;
        while (j < n && /[0-9a-fA-F]/.test(src[j])) j++;
        tokens.push({ type: TK.NUMBER, value: parseInt(src.slice(i+2, j), 16) });
      } else {
        while (j < n && /[0-9.eE]/.test(src[j])) {
          if ((src[j] === '+' || src[j] === '-') && src[j-1] !== 'e' && src[j-1] !== 'E') break;
          j++;
        }
        tokens.push({ type: TK.NUMBER, value: parseFloat(src.slice(i, j)) });
      }
      i = j;
      continue;
    }
    // 식별자/키워드
    if (/[a-zA-Z_]/.test(c)) {
      let j = i;
      while (j < n && /[a-zA-Z0-9_]/.test(src[j])) j++;
      const w = src.slice(i, j);
      tokens.push({ type: KEYWORDS.has(w) ? TK.OP : TK.IDENT, value: w });
      i = j;
      continue;
    }
    // 연산자
    const ops = ['...','..','==','~=','<=','>=','//','<<','>>',
                 '+','-','*','/','%','^','#','<','>','=','(',')','{','}','[',']',',',';',':','.'];
    let matched = false;
    for (const op of ops) {
      if (src.startsWith(op, i)) {
        tokens.push({ type: TK.OP, value: op });
        i += op.length;
        matched = true;
        break;
      }
    }
    if (!matched) throw new Error('Unknown char: ' + c);
  }
  tokens.push({ type: TK.EOF, value: null });
  return tokens;
}

/* ============================================================
   2) PARSER (재귀 하강)
   ============================================================ */
class Parser {
  constructor(tokens) { this.tokens = tokens; this.pos = 0; }
  peek(o = 0) { return this.tokens[this.pos + o]; }
  next() { return this.tokens[this.pos++]; }
  is(v) { const t = this.peek(); return t.type === TK.OP && t.value === v; }
  expect(v) {
    const t = this.next();
    if (t.type !== TK.OP || t.value !== v) throw new Error(`Expected '${v}', got '${t.value}'`);
  }
  parseChunk() {
    const stmts = this.parseStatements();
    if (this.peek().type !== TK.EOF) throw new Error('Trailing tokens');
    return stmts;
  }
  parseStatements() {
    const stmts = [];
    while (this.peek().type !== TK.EOF) {
      const t = this.peek();
      if (t.type === TK.OP && ['end','else','elseif','until'].includes(t.value)) break;
      stmts.push(this.parseStatement());
    }
    return stmts;
  }
  parseStatement() {
    const t = this.peek();
    if (t.type === TK.OP && t.value === 'local') {
      this.next();
      if (this.is('function')) throw new Error('local function 미지원');
      const name = this.next();
      if (name.type !== TK.IDENT) throw new Error('Expected ident');
      this.expect('=');
      return { type: 'Local', name: name.value, expr: this.parseExpr() };
    }
    if (t.type === TK.OP && t.value === 'if') {
      this.next();
      const cond = this.parseExpr();
      this.expect('then');
      const thenBody = this.parseStatements();
      const elifs = [];
      while (this.is('elseif')) {
        this.next();
        const c = this.parseExpr();
        this.expect('then');
        elifs.push({ cond: c, body: this.parseStatements() });
      }
      let elseBody = null;
      if (this.is('else')) { this.next(); elseBody = this.parseStatements(); }
      this.expect('end');
      return { type: 'If', cond, thenBody, elifs, elseBody };
    }
    if (t.type === TK.OP && t.value === 'while') {
      this.next();
      const cond = this.parseExpr();
      this.expect('do');
      const body = this.parseStatements();
      this.expect('end');
      return { type: 'While', cond, body };
    }
    if (t.type === TK.OP && t.value === 'return') {
      this.next();
      const nx = this.peek();
      let expr = null;
      if (!(nx.type === TK.EOF || (nx.type === TK.OP && ['end','else','elseif','until'].includes(nx.value)))) {
        expr = this.parseExpr();
      }
      return { type: 'Return', expr };
    }
    if (t.type === TK.OP && (t.value === 'function' || t.value === 'for' || t.value === 'repeat')) {
      throw new Error(`${t.value} 미지원 → RawScript fallback`);
    }
    // 표현식 대입
    const expr = this.parseExpr();
    if (this.is('=')) {
      this.next();
      return { type: 'Assign', lhs: expr, rhs: this.parseExpr() };
    }
    return { type: 'ExprStmt', expr };
  }
  parseExpr() { return this.parseOr(); }
  parseOr() { let l = this.parseAnd(); while (this.is('or')) { this.next(); l = { type:'Bin', op:'or', left:l, right:this.parseAnd() }; } return l; }
  parseAnd() { let l = this.parseCmp(); while (this.is('and')) { this.next(); l = { type:'Bin', op:'and', left:l, right:this.parseCmp() }; } return l; }
  parseCmp() {
    let l = this.parseConcat();
    while (this.is('==')||this.is('~=')||this.is('<')||this.is('>')||this.is('<=')||this.is('>=')) {
      const op = this.next().value;
      l = { type:'Bin', op, left:l, right:this.parseConcat() };
    }
    return l;
  }
  parseConcat() {
    let l = this.parseAdd();
    while (this.is('..')) { this.next(); l = { type:'Bin', op:'..', left:l, right:this.parseAdd() }; }
    return l;
  }
  parseAdd() {
    let l = this.parseMul();
    while (this.is('+')||this.is('-')) {
      const op = this.next().value;
      l = { type:'Bin', op, left:l, right:this.parseMul() };
    }
    return l;
  }
  parseMul() {
    let l = this.parseUnary();
    while (this.is('*')||this.is('/')||this.is('%')) {
      const op = this.next().value;
      l = { type:'Bin', op, left:l, right:this.parseUnary() };
    }
    return l;
  }
  parseUnary() {
    if (this.is('-')||this.is('not')||this.is('#')) {
      const op = this.next().value;
      return { type:'Un', op, operand: this.parseUnary() };
    }
    return this.parsePostfix();
  }
  parsePostfix() {
    let e = this.parsePrimary();
    while (this.is('(')) {
      this.next();
      const args = [];
      if (!this.is(')')) {
        args.push(this.parseExpr());
        while (this.is(',')) { this.next(); args.push(this.parseExpr()); }
      }
      this.expect(')');
      e = { type:'Call', fn:e, args };
    }
    return e;
  }
  parsePrimary() {
    const t = this.next();
    if (t.type === TK.NUMBER) return { type:'Num', value:t.value };
    if (t.type === TK.STRING) return { type:'Str', value:t.value };
    if (t.type === TK.IDENT) return { type:'Var', name:t.value };
    if (t.type === TK.OP) {
      if (t.value === 'nil') return { type:'Nil' };
      if (t.value === 'true') return { type:'Bool', value:true };
      if (t.value === 'false') return { type:'Bool', value:false };
      if (t.value === '(') { const e = this.parseExpr(); this.expect(')'); return e; }
    }
    throw new Error('Unexpected: ' + t.value);
  }
}

/* ============================================================
   3) VM COMPILER (AST → Bytecode)
   ============================================================ */
class VMCompiler {
  constructor() {
    this.bc = [];
    this.consts = [];
    this.regCount = 0;
    this.localScope = {};
  }
  addConst(v) {
    for (let i = 0; i < this.consts.length; i++) if (this.consts[i] === v) return i;
    this.consts.push(v);
    return this.consts.length - 1;
  }
  allocReg() { return this.regCount++; }
  emit(op, ...args) { this.bc.push([op, ...args]); return this.bc.length - 1; }
  patch(idx, target) { this.bc[idx][1] = target; }
  compile(stmts) {
    for (const s of stmts) this.compileStmt(s);
    this.emit('HALT');
    return { bc: this.bc, consts: this.consts, regs: this.regCount };
  }
  compileStmt(s) {
    if (s.type === 'Local') {
      const r = this.compileExpr(s.expr);
      this.localScope[s.name] = r;
    } else if (s.type === 'Assign') {
      if (s.lhs.type !== 'Var') throw new Error('복잡한 대입 미지원');
      const r = this.compileExpr(s.rhs);
      this.localScope[s.lhs.name] = r;
      this.emit('SETG', this.addConst(s.lhs.name), r);
    } else if (s.type === 'ExprStmt') {
      this.compileExpr(s.expr);
    } else if (s.type === 'Return') {
      const r = s.expr ? this.compileExpr(s.expr) : -1;
      this.emit('RET', r);
    } else if (s.type === 'If') {
      const c = this.compileExpr(s.cond);
      const jif = this.emit('JIFNOT', 0, c);
      for (const st of s.thenBody) this.compileStmt(st);
      const jumps = [];
      if (s.elifs.length || s.elseBody) {
        jumps.push(this.emit('JMP', 0));
        this.patch(jif, this.bc.length);
        for (const e of s.elifs) {
          const c2 = this.compileExpr(e.cond);
          const j2 = this.emit('JIFNOT', 0, c2);
          for (const st of e.body) this.compileStmt(st);
          jumps.push(this.emit('JMP', 0));
          this.patch(j2, this.bc.length);
        }
        if (s.elseBody) for (const st of s.elseBody) this.compileStmt(st);
        for (const j of jumps) this.patch(j, this.bc.length);
      } else {
        this.patch(jif, this.bc.length);
      }
    } else if (s.type === 'While') {
      const start = this.bc.length;
      const c = this.compileExpr(s.cond);
      const jout = this.emit('JIFNOT', 0, c);
      for (const st of s.body) this.compileStmt(st);
      this.emit('JMP', start);
      this.patch(jout, this.bc.length);
    }
  }
  compileExpr(e) {
    if (e.type === 'Num') { const i = this.addConst(e.value); const r = this.allocReg(); this.emit('LOADK', r, i); return r; }
    if (e.type === 'Str') { const i = this.addConst(e.value); const r = this.allocReg(); this.emit('LOADK', r, i); return r; }
    if (e.type === 'Nil') { const r = this.allocReg(); this.emit('LOADNIL', r); return r; }
    if (e.type === 'Bool') { const r = this.allocReg(); this.emit('LOADBOOL', r, e.value ? 1 : 0); return r; }
    if (e.type === 'Var') {
      if (this.localScope[e.name] !== undefined) {
        const r = this.allocReg();
        this.emit('MOVE', r, this.localScope[e.name]);
        return r;
      }
      const r = this.allocReg();
      this.emit('GETG', r, this.addConst(e.name));
      return r;
    }
    if (e.type === 'Bin') {
      const l = this.compileExpr(e.left);
      const r = this.compileExpr(e.right);
      const o = this.allocReg();
      const map = {'+':'ADD','-':'SUB','*':'MUL','/':'DIV','%':'MOD','^':'POW','..':'CAT','==':'EQ','~=':'NE','<':'LT','<=':'LE','>':'GT','>=':'GE','and':'AND','or':'OR'};
      this.emit(map[e.op], o, l, r);
      return o;
    }
    if (e.type === 'Un') {
      const v = this.compileExpr(e.operand);
      const o = this.allocReg();
      const map = {'-':'NEG','not':'NOT','#':'LEN'};
      this.emit(map[e.op], o, v);
      return o;
    }
    if (e.type === 'Call') {
      const fn = this.compileExpr(e.fn);
      const args = e.args.map(a => this.compileExpr(a));
      const out = this.allocReg();
      this.emit('CALL', out, fn, args.length, ...args);
      return out;
    }
    throw new Error('Unsupported expr: ' + e.type);
  }
}

/* ============================================================
   4) CODE GENERATOR (Bytecode → Luau VM 실행 코드)
   ============================================================ */
function randSuffix() { return Math.random().toString(36).substring(2, 6); }
const ISA_KEYS = ['LOADK','LOADNIL','LOADBOOL','GETG','SETG','MOVE','ADD','SUB','MUL','DIV','MOD','POW','CAT','EQ','NE','LT','LE','GT','GE','AND','OR','NOT','NEG','LEN','CALL','JMP','JIF','JIFNOT','RET','HALT','NOP'];

function generateVMCode(compiled) {
  const shuffled = [...ISA_KEYS].sort(() => Math.random() - 0.5);
  const opMap = {};
  shuffled.forEach((k, i) => opMap[k] = i);

  const vR = '_R' + randSuffix(), vP = '_P' + randSuffix(), vC = '_C' + randSuffix(),
        vB = '_B' + randSuffix(), vO = '_O' + randSuffix(), vI = '_I' + randSuffix();

  const bcNums = compiled.bc.map(ins => {
    const op = ins[0];
    if (!(op in opMap)) throw new Error('Unknown op: ' + op);
    return [opMap[op], ...ins.slice(1)];
  });

  const constLines = compiled.consts.map(c => {
    if (typeof c === 'string') return JSON.stringify(c);
    if (typeof c === 'number') return String(c);
    if (typeof c === 'boolean') return c ? 'true' : 'false';
    return 'nil';
  }).join(',');

  const bcStr = bcNums.map(ins => '{' + ins.join(',') + '}').join(',');
  const opTable = Object.entries(opMap).map(([k, v]) => `["${k}"]=${v}`).join(',');

  return `-- Obfuscated by LuaKeeper

local ${vC}={${constLines}}
local ${vB}={${bcStr}}
local ${vR}={}
local ${vP}=1
local _G=getfenv and getfenv() or _G
while true do

if not ${vI} then break end

elseif _o==${vO}.LOADNIL then ${vR}[${vI}[2]]=nil

elseif _o==${vO}.GETG then ${vR}[${vI}[2]]=_G[${vC}[${vI}[3]+1]]

elseif _o==${vO}.ADD then ${vR}[${vI}[2]]=${vR}[${vI}[3]]+${vR}[${vI}[4]]

elseif _o==${vO}.MUL then ${vR}[${vI}[2]]=${vR}[${vI}[3]]*${vR}[${vI}[4]]
elseif _o==${vO}.DIV then ${vR}[${vI}[2]]=${vR}[${vI}[3]]/${vR}[${vI}[4]]
elseif _o==${vO}.MOD then ${vR}[${vI}[2]]=${vR}[${vI}[3]]%${vR}[${vI}[4]]
elseif _o==${vO}.POW then ${vR}[${vI}[2]]=${vR}[${vI}[3]]^${vR}[${vI}[4]]
elseif _o==${vO}.CAT then ${vR}[${vI}[2]]=tostring(${vR}[${vI}[3]])..tostring(${vR}[${vI}[4]])
elseif _o==${vO}.EQ then ${vR}[${vI}[2]]=${vR}[${vI}[3]]==${vR}[${vI}[4]]
elseif _o==${vO}.NE then ${vR}[${vI}[2]]=${vR}[${vI}[3]]~=${vR}[${vI}[4]]
elseif _o==${vO}.LT then ${vR}[${vI}[2]]=${vR}[${vI}[3]]<${vR}[${vI}[4]]
elseif _o==${vO}.LE then ${vR}[${vI}[2]]=${vR}[${vI}[3]]<=${vR}[${vI}[4]]
elseif _o==${vO}.GT then ${vR}[${vI}[2]]=${vR}[${vI}[3]]>${vR}[${vI}[4]]
elseif _o==${vO}.GE then ${vR}[${vI}[2]]=${vR}[${vI}[3]]>=${vR}[${vI}[4]]
elseif _o==${vO}.AND then ${vR}[${vI}[2]]=${vR}[${vI}[3]] and ${vR}[${vI}[4]]
elseif _o==${vO}.OR then ${vR}[${vI}[2]]=${vR}[${vI}[3]] or ${vR}[${vI}[4]]
elseif _o==${vO}.NOT then ${vR}[${vI}[2]]=not ${vR}[${vI}[3]]
elseif _o==${vO}.NEG then ${vR}[${vI}[2]]=-${vR}[${vI}[3]]
elseif _o==${vO}.LEN then ${vR}[${vI}[2]]=#${vR}[${vI}[3]]
elseif _o==${vO}.CALL then
local _fn=${vR}[${vI}[3]]
local _args={}
for _k=1,${vI}[4] do _args[_k]=${vR}[${vI}[4+_k]] end
${vR}[${vI}[2]]=_fn(table.unpack(_args))
elseif _o==${vO}.JMP then ${vP}=${vI}[2]-1
elseif _o==${vO}.JIF then if ${vR}[${vI}[3]] then ${vP}=${vI}[2]-1 end
elseif _o==${vO}.JIFNOT then if not ${vR}[${vI}[3]] then ${vP}=${vI}[2]-1 end
elseif _o==${vO}.RET then if ${vI}[2]>=0 then return ${vR}[${vI}[2]] end return

}

/* ============================================================
   5) FALLBACK (RawScript + Dual XOR)
   ============================================================ */
function encodeSource(src, seed1, seed2) {
  const bytes = new TextEncoder().encode(src);
  const enc = new Uint8Array(bytes.length);
  let k1 = seed1 & 0xFF, k2 = seed2 & 0xFF;
  for (let i = 0; i < bytes.length; i++) {
    let v = bytes[i] ^ k1; k1 = (k1 * 31 + i + 13) & 0xFF;
    let v2 = v ^ k2; k2 = (k2 * 17 + i + 7) & 0xFF;
    enc[i] = v2;
  }
  let hex = '';
  for (let i = 0; i < enc.length; i++) hex += enc[i].toString(16).padStart(2, '0');
  return hex;
}
function decodeDualXOR(hex, seed1, seed2) {
  if (hex.length % 2 !== 0) throw new Error('Hex 홀수');
  const byteLen = hex.length / 2;
  const out = new Uint8Array(byteLen);
  let k1 = seed1 & 0xFF, k2 = seed2 & 0xFF;
  for (let i = 0; i < byteLen; i++) {
    const b = parseInt(hex.substr(i * 2, 2), 16);
    if (isNaN(b)) throw new Error('bad hex');
    let v = b ^ k2; k2 = (k2 * 17 + i + 7) & 0xFF;
    let v2 = v ^ k1; k1 = (k1 * 31 + i + 13) & 0xFF;
    out[i] = v2;
  }
  return new TextDecoder('utf-8', { fatal: false }).decode(out);
}

function generateFallback(source) {
  const seed1 = Math.floor(Math.random() * 255) + 1;
  const seed2 = Math.floor(Math.random() * 255) + 1;
  const fakeA1 = Math.floor(Math.random() * 200) + 10, fakeB1 = seed1 ^ fakeA1;
  const fakeA2 = Math.floor(Math.random() * 200) + 10, fakeB2 = seed2 ^ fakeA2;
  const hex = encodeSource(source, seed1, seed2);
  const CHUNK = 8192;
  const chunks = [];
  for (let i = 0; i < hex.length; i += CHUNK) chunks.push(hex.slice(i, i + CHUNK));
  if (chunks.length === 0) chunks.push('');
  const markerD = 'A' + Math.random().toString(36).substring(2, 4).toUpperCase();
  const dataLines = chunks.map(c => `"${markerD}${c}"`);
  return `-- Obfuscated by LuaKeeper
local _L=nil
pcall(function()_L=rawget(getfenv(),"loadstring")or rawget(getfenv(),"load")end)
if type(_L)~="function"then return end
local _K1=bit32.bxor(${fakeA1},${fakeB1})
local _K2=bit32.bxor(${fakeA2},${fakeB2})
local _D={${dataLines.join(',')}}
local _H={}
for i=1,#_D do if string.sub(_D[i],1,${markerD.length})=="${markerD}"then _H[#_H+1]=string.sub(_D[i],${markerD.length + 1})end end
local _X=table.concat(_H)
local _A=_K1 local _B=_K2 local _O={}
for i=1,#_X,2 do
local _j=math.floor((i-1)/2)
local _v=tonumber(string.sub(_X,i,i+1),16)or 0
_O[#_O+1]=string.char(bit32.bxor(bit32.bxor(_v,_B),_A))
_B=(_B*17+_j+7)%256
_A=(_A*31+_j+13)%256
end
local _f=_L(table.concat(_O))
if _f then pcall(function()task.spawn(_f)end)end
`;
}

/* ============================================================
   6) MAIN OBFUSCATE
   ============================================================ */
function generateObfuscated(source) {
  try {
    const tokens = tokenize(source);
    const ast = new Parser(tokens).parseChunk();
    const compiler = new VMCompiler();
    const compiled = compiler.compile(ast);
    return { code: generateVMCode(compiled), mode: 'AST-VM', bc: compiled.bc.length, regs: compiled.regs };
  } catch (e) {
    console.warn('[fallback] ' + e.message);
    return { code: generateFallback(source), mode: 'RawScript', reason: e.message };
  }
}

/* ============================================================
   7) MAIN DEOBFUSCATE
   ============================================================ */
function tryDecompileVM(code) {
  const log = [];
  try {
    const opMatch = code.match(/local\s+(_O\w*)\s*=\s*\{([^}]+)\}/);
    if (!opMatch) { log.push('OP 매핑 없음'); return { success: false, log }; }
    const opMap = {};
    [...opMatch[2].matchAll(/\["([^"]+)"\]\s*=\s*(\d+)/g)].forEach(m => opMap[m[1]] = +m[2]);
    const revOp = {};
    for (const k in opMap) revOp[opMap[k]] = k;
    log.push(`OP 매핑: ${Object.keys(opMap).length}개`);

    const constMatch = code.match(/local\s+(_C\w*)\s*=\s*\{([\s\S]*?)\}\s*\nlocal\s+_B/);
    if (!constMatch) { log.push('CONST 없음'); return { success: false, log }; }
    const constStrs = [];
    const cBody = constMatch[2];
    const re = /"((?:[^"\\]|\\.)*)"|(-?\d+(?:\.\d+)?)|(true|false|nil)/g;
    let mm;
    while ((mm = re.exec(cBody)) !== null) {
      if (mm[1] !== undefined) constStrs.push(mm[1].replace(/\\"/g,'"').replace(/\\n/g,'\n').replace(/\\t/g,'\t').replace(/\\\\/g,'\\'));
      else if (mm[2] !== undefined) constStrs.push(parseFloat(mm[2]));
      else if (mm[3] === 'true') constStrs.push(true);
      else if (mm[3] === 'false') constStrs.push(false);
      else constStrs.push(null);
    }
    log.push(`CONST: ${constStrs.length}개`);

    const bcMatch = code.match(/local\s+(_B\w*)\s*=\s*\{([\s\S]*?)\}\s*\nlocal/);
    if (!bcMatch) { log.push('BC 없음'); return { success: false, log }; }
    const bcArr = [...bcMatch[2].matchAll(/\{([^{}]*)\}/g)].map(x => x[1].split(',').map(v => parseInt(v.trim(), 10)).filter(v => !isNaN(v)));
    log.push(`BC: ${bcArr.length}개 명령어`);

    // 역컴파일: 레지스터 트레이스
    const lines = [];
    for (const ins of bcArr) {
      const op = revOp[ins[0]];
      if (!op) { lines.push(`-- ??? ${ins.join(',')}`); continue; }
      const a = ins[1], b = ins[2], c = ins[3];
      if (op === 'LOADK') lines.push(`R[${a}] = ${JSON.stringify(constStrs[b])}`);
      else if (op === 'LOADNIL') lines.push(`R[${a}] = nil`);
      else if (op === 'LOADBOOL') lines.push(`R[${a}] = ${b === 1}`);
      else if (op === 'GETG') lines.push(`R[${a}] = _G[${JSON.stringify(constStrs[b])}]`);
      else if (op === 'SETG') lines.push(`_G[${JSON.stringify(constStrs[a])}] = R[${b}]`);
      else if (op === 'MOVE') lines.push(`R[${a}] = R[${b}]`);
      else if (op === 'ADD') lines.push(`R[${a}] = R[${b}] + R[${c}]`);
      else if (op === 'SUB') lines.push(`R[${a}] = R[${b}] - R[${c}]`);
      else if (op === 'MUL') lines.push(`R[${a}] = R[${b}] * R[${c}]`);
      else if (op === 'DIV') lines.push(`R[${a}] = R[${b}] / R[${c}]`);
      else if (op === 'MOD') lines.push(`R[${a}] = R[${b}] % R[${c}]`);
      else if (op === 'POW') lines.push(`R[${a}] = R[${b}] ^ R[${c}]`);
      else if (op === 'CAT') lines.push(`R[${a}] = R[${b}] .. R[${c}]`);
      else if (op === 'EQ') lines.push(`R[${a}] = R[${b}] == R[${c}]`);
      else if (op === 'NE') lines.push(`R[${a}] = R[${b}] ~= R[${c}]`);
      else if (op === 'LT') lines.push(`R[${a}] = R[${b}] < R[${c}]`);
      else if (op === 'LE') lines.push(`R[${a}] = R[${b}] <= R[${c}]`);
      else if (op === 'GT') lines.push(`R[${a}] = R[${b}] > R[${c}]`);
      else if (op === 'GE') lines.push(`R[${a}] = R[${b}] >= R[${c}]`);
      else if (op === 'AND') lines.push(`R[${a}] = R[${b}] and R[${c}]`);
      else if (op === 'OR') lines.push(`R[${a}] = R[${b}] or R[${c}]`);
      else if (op === 'NOT') lines.push(`R[${a}] = not R[${b}]`);
      else if (op === 'NEG') lines.push(`R[${a}] = -R[${b}]`);
      else if (op === 'LEN') lines.push(`R[${a}] = #R[${b}]`);
      else if (op === 'CALL') {
        const argCnt = ins[3];
        const args = [];
        for (let i = 0; i < argCnt; i++) args.push(`R[${ins[4+i]}]`);
        lines.push(`R[${ins[1]}] = R[${ins[2]}](${args.join(', ')})`);
      }
      else if (op === 'JMP') lines.push(`-- JMP → PC ${ins[1]}`);
      else if (op === 'JIF') lines.push(`if R[${ins[2]}] then -- JMP ${ins[1]}`);
      else if (op === 'JIFNOT') lines.push(`if not R[${ins[2]}] then -- JMP ${ins[1]}`);
      else if (op === 'RET') lines.push(ins[1] >= 0 ? `return R[${ins[1]}]` : `return`);
      else if (op === 'HALT') lines.push(`-- HALT`);
      else if (op === 'NOP') lines.push(`-- NOP`);
    }

    return {
      success: true,
      code: `-- [LuaKeeper VM 디컴파일 · 레지스터 트레이스]\n-- VM 바이트코드를 레지스터 연산 순서로 복원\n-- 원본 구조(if/while)는 완전 복원 불가, 로직은 그대로\n\n${lines.join('\n')}`,
      log,
    };
  } catch (e) {
    log.push('예외: ' + e.message);
    return { success: false, log };
  }
}

function tryDecompileFallback(code) {
  const log = [];
  try {
    const sm = code.match(/_K1=bit32\.bxor\((\d+),(\d+)\)/);
    const sm2 = code.match(/_K2=bit32\.bxor\((\d+),(\d+)\)/);
    if (!sm || !sm2) { log.push('시드 없음'); return { success: false, log }; }
    const seed1 = parseInt(sm[1], 10) ^ parseInt(sm[2], 10);
    const seed2 = parseInt(sm2[1], 10) ^ parseInt(sm2[2], 10);
    const markerMatch = code.match(/string\.sub\(_D\[i\],1,(\d+)\)=="([A-Z0-9]+)"/);
    if (!markerMatch) { log.push('마커 없음'); return { success: false, log }; }
    const markerLen = parseInt(markerMatch[1], 10), marker = markerMatch[2];
    log.push(`시드: (${seed1},${seed2}) 마커: ${marker}`);
    const strArr = [...code.matchAll(/"([^"]*)"/g)].map(m => m[1]);
    const chunks = strArr.filter(s => s.startsWith(marker)).map(s => s.substring(markerLen));
    const valid = chunks.filter(s => /^[a-fA-F0-9]+$/.test(s));
    if (valid.length === 0) { log.push('진짜 청크 없음'); return { success: false, log }; }
    const decoded = decodeDualXOR(valid.join(''), seed1, seed2);
    log.push(`복원 성공: ${decoded.length} chars`);
    return { success: true, code: decoded, log };
  } catch (e) {
    log.push('예외: ' + e.message);
    return { success: false, log };
  }
}

function universalDeobfuscate(code) {
  if (code.includes('local _O={["')) {
    const r = tryDecompileVM(code);
    if (r.success) return { code: r.code, log: r.log, isRaw: false };
    return { code: code, log: [...r.log, '[실패] VM 구조 미완성'], isRaw: true };
  }
  if (code.includes('_K1=bit32.bxor')) {
    const r = tryDecompileFallback(code);
    if (r.success) return { code: r.code, log: r.log, isRaw: false };
    return { code: code, log: [...r.log, '[실패] Fallback 복원 실패'], isRaw: true };
  }
  return { code: code, log: ['[정보] 알려진 패턴 없음'], isRaw: true };
}

/* ============================================================
   8) 이벤트
   ============================================================ */
$('btnProcess').onclick = () => {
  const input = $('input').value;
  if (!input.trim()) { setStatus('[오류] 입력 없음', 'error'); $('output').value = ''; updateStats(); return; }
  try {
    if (MODE === 'obfuscate') {
      const r = generateObfuscated(input);
      $('output').value = r.code;
      if (r.mode === 'AST-VM') {
        setStatus(`[성공] True VM 난독화 · ${r.bc}개 명령어 · ${r.regs}개 레지스터`, 'ok');
      } else {
        setStatus(`[Fallback] 파싱 실패 (${r.reason}) → RawScript 모드 적용`, 'warn');
      }
    } else {
      const { code: r, log, isRaw } = universalDeobfuscate(input);
      $('output').value = r;
      if (isRaw) setStatus(`[경고] ${log.join(' | ')}`, 'warn');
      else setStatus(`[성공] ${log.join(' | ')}`, 'ok');
    }
  } catch (e) {
    $('output').value = `-- 오류: ${e.message}\n\n${input}`;
    setStatus(`[오류] ${e.message}`, 'error');
  }
  updateStats();
};

$('btnLoad').onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.lua,.luau,.txt';
  inp.onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { $('input').value = r.result; updateStats(); setStatus(`[파일] ${f.name}`, 'info'); };
    r.readAsText(f, 'UTF-8');
  };
  inp.click();
};

$('btnSave').onclick = () => {
  const c = $('output').value;
  if (!c) return setStatus('[오류] 출력 없음', 'error');
  const b = new Blob([c], { type: 'text/plain;charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = MODE === 'obfuscate' ? 'luakeeper_vm.lua' : 'luakeeper_deobf.lua';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(u);
  setStatus(`[저장] ${a.download}`, 'ok');
};

$('btnCopy').onclick = () => {
  const c = $('output').value; if (!c) return;
  navigator.clipboard.writeText(c).then(
    () => setStatus('[복사] 완료', 'info'),
    () => setStatus('[오류] 복사 실패', 'error')
  );
};

$('btnClear').onclick = () => { $('input').value = ''; $('output').value = ''; updateStats(); setStatus('[초기화]', 'idle'); };

updateStats();
setMode('obfuscate');
