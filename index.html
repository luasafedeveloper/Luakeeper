<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Luakeeper - Luau Obfuscator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            gap: 20px;
        }
        .box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #cbd5e1;
        }
        textarea {
            width: 100%;
            height: 350px;
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .controls {
            margin: 20px 0;
            text-align: center;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <h1>🔒 Luakeeper</h1>
    <p class="subtitle">Secure Your Luau Code Professionally</p>

    <div class="container">
        <!-- 원본 코드 입력창 -->
        <div class="box">
            <label for="inputCode">원본 루아 코드 (Input)</label>
            <textarea id="inputCode" placeholder="-- 여기에 코드를 입력하세요&#10;print('Hello Luakeeper!')"></textarea>
        </div>

        <!-- 난독화된 코드 출력창 -->
        <div class="box">
            <label for="outputCode">난독화된 코드 (Output)</label>
            <textarea id="outputCode" placeholder="난독화된 결과가 여기에 표시됩니다." readonly></textarea>
        </div>
    </div>

    <div class="controls">
        <button onclick="obfuscateCode()">난독화 실행 (Obfuscate)</button>
    </div>

    <script>
        function obfuscateCode() {
            let code = document.getElementById('inputCode').value;
            
            if (!code.trim()) {
                alert("난독화할 코드를 입력해주세요!");
                return;
            }

            // [기본 난독화 로직 예시]
            // 1. 주석 제거 (--로 시작하는 줄 제거)
            let processed = code.replace(/--.*$/gm, '');

            // 2. 불필요한 공백 및 줄바꿈 정리 후 문자열/변수 변형 시뮬레이션
            // (실제 상용 수준은 AST 파싱과 바이트코드 컴파일이 필요하며, 우선 뼈대 형태로 구현됩니다)
            let encodedChars = [];
            for (let i = 0; i < processed.length; i++) {
                encodedChars.push(processed.charCodeAt(i));
            }

            let obfuscatedResult = `-- Protected by Luakeeper\n` +
                                   `local _k = {${encodedChars.join(',')}}\n` +
                                   `local _s = ""\n` +
                                   `for _, _v in ipairs(_k) do _s = _s .. string.char(_v) end\n` +
                                   `load(_s)()`;

            document.getElementById('outputCode').value = obfuscatedResult;
        }
    </script>

</body>
</html>
