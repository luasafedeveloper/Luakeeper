<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuaKeeper | Universal Luau Deobfuscator</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #0a0d14; --panel: #0d1117; --border: #1e2633;
    --cyan: #00f0ff; --cyan-dim: #00f0ff44;
  }
  html, body { background-color: var(--bg); color: #c9d1d9; font-family: 'Inter', system-ui, sans-serif; }
  .neon-text { color: var(--cyan); text-shadow: 0 0 8px rgba(0,240,255,0.6), 0 0 20px rgba(0,240,255,0.3); }
  .neon-glow { box-shadow: 0 0 8px rgba(0,240,255,0.55), 0 0 24px rgba(0,240,255,0.25); }
  .editor {
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    background-color: #060910 !important; color: #a9e6f5 !important;
    border: 1px solid var(--border); border-radius: 6px;
    resize: none; tab-size: 2; line-height: 1.5;
  }
  .editor::placeholder { color: #3b4757; }
  .editor:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan-dim), 0 0 12px rgba(0,240,255,0.15); }
  .btn-primary { background: linear-gradient(135deg, #00f0ff, #0090ff); color: #001018; font-weight: 700; }
  .btn-primary:hover { filter: brightness(1.15); box-shadow: 0 0 12px rgba(0,240,255,0.5); }
  .btn-ghost { background: #0d1117; border: 1px solid var(--border); color: #8b949e; }
  .btn-ghost:hover { border-color: var(--cyan); color: var(--cyan); }
  .tab-active { background: rgba(0,240,255,0.08); border-color: var(--cyan) !important; color: var(--cyan) !important; box-shadow: 0 0 10px rgba(0,240,255,0.35); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #060910; }
  ::-webkit-scrollbar-thumb { background: #1e2633; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }
  .pulse-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body class="min-h-screen">

  <header class="border-b border-[#1e2633] bg-[#0a0d14]/90 backdrop-blur sticky top-0 z-10">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">

        </div>

      <div class="flex gap-2">
        <button id="tabObf" class="px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white">Obfuscate</button>

  <div class="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center gap-2">
    <button id="btnLoad" class="btn-ghost px-3 py-1.5 rounded text-sm">Load File</button>
    <button id="btnSave" class="btn-ghost px-3 py-1.5 rounded text-sm">Save File</button>
    <button id="btnProcess" class="btn-primary px-6 py-1.5 rounded text-sm neon-glow">Process</button>
    <button id="btnCopy" class="btn-ghost px-3 py-1.5 rounded text-sm">Copy Output</button>
    <button id="btnClear" class="btn-ghost px-3 py-1.5 rounded text-sm">Clear</button>
    <div class="ml-auto text-xs text-gray-500 font-mono" id="stats">Ready · VM Dispatcher</div>
  </div>

  <div class="max-w-[1600px] mx-auto px-4 pb-6">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="flex flex-col">
        <div class="flex items-center justify-between mb-1.5 px-1">
          <span class="text-xs font-bold text-[#00f0ff] tracking-wider">INPUT</span>
          <span class="text-[11px] text-gray-500 font-mono" id="inStats">0 lines · 0 B</span>
        </div>
        <textarea id="input" spellcheck="false" class="editor w-full h-[70vh] p-3 text-sm" placeholder="-- 분석할 난독화 코드를 붙여넣으세요..."></textarea>
      </div>
      <div class="flex flex-col">
        <div class="flex items-center justify-between mb-1.5 px-1">
          <span class="text-xs font-bold text-[#00f0ff] tracking-wider">OUTPUT</span>
          <span class="text-[11px] text-gray-500 font-mono" id="outStats">0 lines · 0 B</span>
        </div>
        <textarea id="output" spellcheck="false" readonly class="editor w-full h-[70vh] p-3 text-sm" placeholder="-- 결과가 표시됩니다..."></textarea>
      </div>
    </div>
    <div id="status" class="mt-3 px-3 py-2 rounded-md border border-[#1e2633] bg-[#0d1117] text-sm text-gray-400 min-h-[42px] flex items-center">
      대기 중...
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let MODE = 'deobfuscate';

function setMode(m) {
  MODE = m;
  const ob = $('tabObf'), de = $('tabDeobf');
  if (m === 'obfuscate') {
    ob.className = 'tab-active px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold transition-all';
    de.className = 'px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white';
    $('input').placeholder = '-- Luau 소스를 여기에 붙여넣으세요...';
    setStatus('Obfuscate 모드 · VM 난독화를 적용합니다.', 'idle');
  } else {
    de.className = 'tab-active px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold transition-all';
    ob.className = 'px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white';
    $('input').placeholder = '-- 디컴파일할 난독화 코드를 붙여넣으세요...';
    setStatus('Deobfuscate 모드 · VM 패턴을 분석합니다.', 'idle');
  }
}
$('tabObf').onclick = () => setMode('obfuscate');
$('tabDeobf').onclick = () => setMode('deobfuscate');

function setStatus(msg, type = 'idle') {
  const el = $('status');
  const colors = {
    idle: 'text-gray-400 border-[#1e2633]',
    ok: 'text-green-400 border-green-800/50',
    error: 'text-red-400 border-red-800/50',
    info: 'text-cyan-300 border-cyan-800/50',
    warn: 'text-yellow-400 border-yellow-800/50'
  };
  el.className = 'mt-3 px-3 py-2 rounded-md border bg-[#0d1117] text-sm min-h-[42px] flex items-center ' + (colors[type] || colors.idle);
  el.textContent = msg;
}

function updateStats() {
  const inp = $('input').value, out = $('output').value;
  const inB = new TextEncoder().encode(inp).length;
  const outB = new TextEncoder().encode(out).length;
  $('inStats').textContent  = `${inp.split('\n').length} lines · ${inB.toLocaleString()} B`;
  $('outStats').textContent = `${out.split('\n').length} lines · ${outB.toLocaleString()} B`;
  $('stats').textContent = `IN ${inB.toLocaleString()} B → OUT ${outB.toLocaleString()} B`;
}
$('input').addEventListener('input', updateStats);

/* ============ 인코딩 / 디코딩 (완벽 대칭) ============ */
function encodeSource(src, seed) {
  const bytes = new TextEncoder().encode(src);
  const enc = new Uint8Array(bytes.length);
  let key = seed & 0xFF;
  for (let i = 0; i < bytes.length; i++) {
    enc[i] = bytes[i] ^ key;
    key = (key * 31 + i + 13) & 0xFF;
  }
  let hex = '';
  for (let i = 0; i < enc.length; i++) hex += enc[i].toString(16).padStart(2, '0');
  return hex;
}

function decodeHex(hex, seed) {
  if (hex.length % 2 !== 0) throw new Error('Hex 길이 홀수');
  const byteLen = hex.length / 2;
  const out = new Uint8Array(byteLen);
  let key = seed & 0xFF;
  for (let i = 0; i < byteLen; i++) {
    const b = parseInt(hex.substr(i * 2, 2), 16);
    if (isNaN(b)) throw new Error(`Hex 오류 @${i*2}`);
    out[i] = b ^ key;
    key = (key * 31 + i + 13) & 0xFF;
  }
  return new TextDecoder('utf-8', { fatal: false }).decode(out);
}

/* ============ VM 스타일 난독화 엔진 ============ */
function generateObfuscated(source) {
  const rawSeed = Math.floor(Math.random() * 255) + 1;
  const fakeSeedA = Math.floor(Math.random() * 100) + 10;
  const fakeSeedB = rawSeed ^ fakeSeedA;

  const hex = encodeSource(source, rawSeed);

  // 청크 크기 2048글자 → 테이블 오버플로 방지
  const CHUNK_SIZE = 2048;
  const chunks = [];
  for (let i = 0; i < hex.length; i += CHUNK_SIZE) chunks.push(hex.slice(i, i + CHUNK_SIZE));
  if (chunks.length === 0) chunks.push('');

  // 진짜 데이터는 "D_"로 시작, 쓰레기 데이터는 "J_"로 시작 → 런타임 필터링 안전
  const dataLines = [];
  for (let i = 0; i < chunks.length; i++) {
    dataLines.push(`"${chunks[i]}"`);
    if (i % 8 === 0) dataLines.push(`"J_${i}_${Math.random().toString(36).substring(2, 6)}"`);
  }

  // VM 상수 (분리 저장, 동적 조합)
  const constTable = [];
  const fakeKeys = [Math.floor(Math.random()*1000)+1, Math.floor(Math.random()*1000)+1, Math.floor(Math.random()*1000)+1];
  const total = chunks.length;
  constTable.push(`[1] = ${fakeSeedA}`);
  constTable.push(`[2] = ${fakeSeedB}`);
  constTable.push(`[3] = ${fakeKeys[0]}`);
  constTable.push(`[4] = ${fakeKeys[1]}`);
  constTable.push(`[5] = ${fakeKeys[2]}`);
  constTable.push(`[6] = ${total}`);

  // 점진적 처리를 위한 배치 사이즈
  const CHUNK_BATCH = 60;      // 프레임당 처리할 데이터 청크 수
  const DECODE_BATCH = 800;    // 프레임당 디코딩할 바이트 수

  return `-- [Luakeeper VM v9 - Zero Freeze Edition]
-- ★ VM 디스패처 + 점진적 디코딩 + task.wait() 프레임 양보 ★

local _VM = {
    STATE = 0,
    STACK = {},
    CONST = {},
    DATA = {},
    PARTS = {},
    DECODED = {},
    KEY = 0,
    PC = 1,
    TOTAL = 0,
    HALT = false,
    LOADER = nil,
    DEBUG_ERR = nil,
}

-- 안전한 로더 탐색
pcall(function()
    _VM.LOADER = rawget(getfenv(), "loadstring") or rawget(getfenv(), "load")
end)

if type(_VM.LOADER) ~= "function" then
    return
end

-- 상수 테이블 (분리 보관)
_VM.CONST = {
${constTable.join(',\n')}
}

-- 암호화된 데이터 (진짜/가짜 혼합)
_VM.DATA = {
${dataLines.join(',\n')}
}

-- ============================================
-- VM 메인 디스패처 루프
-- ============================================
while not _VM.HALT do

    -- [STATE 0] 부트: 시드 복원
    if _VM.STATE == 0 then
        _VM.KEY = bit32.bxor(_VM.CONST[1], _VM.CONST[2])
        _VM.TOTAL = _VM.CONST[6]
        _VM.PC = 1
        _VM.STATE = 1
        task.wait()

    -- [STATE 1] 점진적 데이터 수집 (프레임 양보)
    elseif _VM.STATE == 1 then
        local _cnt = 0
        while _cnt < ${CHUNK_BATCH} and _VM.PC <= #_VM.DATA do
            local _v = _VM.DATA[_VM.PC]
            -- "J_"로 시작하지 않는 진짜 데이터만
            if string.sub(_v, 1, 2) ~= "J_" then
                _VM.PARTS[#_VM.PARTS + 1] = _v
            end
            _VM.PC = _VM.PC + 1
            _cnt = _cnt + 1
        end
        if _VM.PC > #_VM.DATA then
            _VM.STATE = 2
            _VM.PC = 1
        end
        task.wait()  -- ★ 프리징 방지

    -- [STATE 2] 점진적 Hex 디코딩 (프레임 양보)
    elseif _VM.STATE == 2 then
        local _h = _VM.STACK.HEX
        if not _h then
            _h = table.concat(_VM.PARTS)
            _VM.PARTS = nil
            _VM.STACK.HEX = _h
            _VM.STACK.HLEN = #_h
        end
        local _bytes_done = 0
        while _bytes_done < ${DECODE_BATCH} and _VM.PC < _VM.STACK.HLEN do
            local _b = tonumber(string.sub(_h, _VM.PC, _VM.PC + 1), 16)
            if _b then
                local _idx = math.floor((_VM.PC - 1) / 2)
                _VM.DECODED[#_VM.DECODED + 1] = string.char(bit32.bxor(_b, _VM.KEY))
                _VM.KEY = (_VM.KEY * 31 + _idx + 13) % 256
            end
            _VM.PC = _VM.PC + 2
            _bytes_done = _bytes_done + 1
        end
        if _VM.PC >= _VM.STACK.HLEN then
            _VM.STATE = 3
        end
        task.wait()  -- ★ 프리징 방지

    -- [STATE 3] 컴파일 & 실행
    elseif _VM.STATE == 3 then
        local _src = table.concat(_VM.DECODED)
        _VM.DECODED = nil
        _VM.DATA = nil
        _VM.STACK = nil

        local _ok, _f = pcall(_VM.LOADER, _src)
        _src = nil

        if _ok and _f then
            task.spawn(function()
                local _runOk, _err = pcall(_f)
                if not _runOk then
                    pcall(function() warn("[LuaKeeper] runtime: " .. tostring(_err)) end)
                end
            end)
        else
            pcall(function() warn("[LuaKeeper] load failed") end)
        end

        _VM.HALT = true
    end
end
`;
}

/* ============ 디컴파일러 ============ */
function extractLuaStrings(str) {
    const result = [];
    let i = 0;
    while (i < str.length) {
        if (str[i] === '"') {
            let j = i + 1, current = "";
            while (j < str.length && str[j] !== '"') {
                if (str[j] === '\\') {
                    if (str[j+1] === '"') { current += '"'; j += 2; }
                    else if (str[j+1] === '\\') { current += '\\'; j += 2; }
                    else { current += str[j+1]; j += 2; }
                } else { current += str[j]; j++; }
            }
            result.push(current);
            i = j + 1;
        } else i++;
    }
    return result;
}

function universalDeobfuscate(code) {
  let log = [], out = '';

  // [1] VM v9 복원
  if (code.includes('Luakeeper VM v9') || code.includes('_VM.STATE')) {
    try {
      // 시드 추출
      const seedMatch = code.match(/_VM\.CONST\s*=\s*\{[\s\S]*?\[1\]\s*=\s*(\d+)\s*,[\s\S]*?\[2\]\s*=\s*(\d+)/);
      if (!seedMatch) throw new Error('시드 없음');
      const seedA = parseInt(seedMatch[1], 10);
      const seedB = parseInt(seedMatch[2], 10);
      const realSeed = seedA ^ seedB;

      // 데이터 배열 블록 추출
      const dataMatch = code.match(/_VM\.DATA\s*=\s*\{([\s\S]*?)\n\s*\}\s*\n\s*--\s*====/);
      if (!dataMatch) throw new Error('데이터 없음');

      // 문자열 리터럴 추출
      const dataBody = dataMatch[1];
      const strMatches = [...dataBody.matchAll(/"([^"]*)"/g)].map(m => m[1]);

      // "J_"로 시작하지 않는 것만 진짜 데이터
      const realChunks = strMatches.filter(s => !s.startsWith('J_') && /^[a-fA-F0-9]+$/.test(s));

      if (realChunks.length === 0) throw new Error('진짜 데이터 없음');

      const decoded = decodeHex(realChunks.join(''), realSeed);
      return { code: decoded, log: ['[성공] Luakeeper VM v9 복원'], isRaw: false };
    } catch (e) {
      log.push('[실패] VM v9: ' + e.message);
    }
  }

  // [2] 구버전 Luakeeper v7/v8
  if (code.includes('_x == 5') && code.includes('_x == 1')) {
    const seedMatch = code.match(/_k\s*=\s*bit32\.bxor\((\d+),\s*(\d+)\)/);
    const hexMatches = code.match(/"[a-fA-F0-9]{10,}"/g);
    if (seedMatch && hexMatches) {
      const realSeed = parseInt(seedMatch[1], 10) ^ parseInt(seedMatch[2], 10);
      const chunks = hexMatches.map(h => h.replace(/"/g, ''));
      try {
        return { code: decodeHex(chunks.join(''), realSeed), log: ['[성공] Luakeeper v7/v8 복원'], isRaw: false };
      } catch (e) { log.push('[실패] v7/v8: ' + e.message); }
    }
  }

  // [3] Chanhyuk
  if (code.includes('chanhyuk lua') || (code.includes('local n=') && code.includes('local o=') && code.includes('local k='))) {
    try {
      const nMatch = code.match(/local\s+n\s*=\s*\{([\s\S]*?)\}\s*local\s+o/);
      const oMatch = code.match(/local\s+o\s*=\s*\{([\s\S]*?)\}\s*local\s+k/);
      const kMatch = code.match(/local\s+k\s*=\s*(\d+)/);
      const qMatch = code.match(/local\s+q\s*=\s*(\d+)/);
      const aMatch = code.match(/local\s+a\s*=\s*\{([\s\S]*?)\}\s*local\s+g/);
      if (nMatch && oMatch && kMatch && qMatch && aMatch) {
        const nStrings = extractLuaStrings(nMatch[1]);
        const oArr = [...oMatch[1].matchAll(/\d+/g)].map(m => parseInt(m[0], 10));
        const k = parseInt(kMatch[1], 10), q = parseInt(qMatch[1], 10);
        const aArr = [...aMatch[1].matchAll(/\d+/g)].map(m => parseInt(m[0], 10));
        function decCH(s, k, q, a) {
          let r = "", j = 1;
          for (let i = 0; i < s.length; i += 2) {
            const v = (s.charCodeAt(i) - 33) * 95 + (s.charCodeAt(i + 1) - 33);
            let idx = (v - k - (((j - 1) * q) % 251) - a[((j - 1) % a.length)] + 512) % 256;
            if (idx < 0) idx += 256;
            r += String.fromCharCode(idx);
            j++;
          }
          return r;
        }
        let decoded = "";
        for (let i = 0; i < oArr.length; i++) {
          const idx = oArr[i] - 1;
          if (nStrings[idx]) decoded += decCH(nStrings[idx], k, q, aArr);
        }
        return { code: decoded, log: ['[성공] Chanhyuk 복원'], isRaw: false };
      }
    } catch (e) { log.push('[실패] Chanhyuk'); }
  }

  // [4] 휴리스틱
  const charRegex = /string\.char\s*\(\s*([0-9,\s]+)\s*\)/g;
  if (charRegex.test(code)) {
    code = code.replace(charRegex, (m, p1) => {
      try {
        const bytes = p1.split(',').map(n => parseInt(n.trim(), 10));
        const text = new TextDecoder('utf-8').decode(new Uint8Array(bytes));
        return '"' + text.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"';
      } catch { return m; }
    });
    log.push('[성공] string.char');
  }

  const loadRegex = /(?:loadstring|load)\(\s*(["'])([\s\S]*?)\1\s*\)/;
  const loadMatch = code.match(loadRegex);
  if (loadMatch && loadMatch[2]) {
    let inner = loadMatch[2].replace(/\\(\d{1,3})/g, (m, p1) => String.fromCharCode(parseInt(p1, 10)));
    inner = inner.replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\'/g, "'");
    out += `-- ==========================================\n-- [loadstring 내부]\n-- ==========================================\n${inner}\n`;
    log.push('[성공] loadstring');
  }

  if (log.length === 0) {
    log.push('[정보] 알 수 없는 패턴');
    return { code: code, log, isRaw: true };
  }
  if (out.length > 0) {
    out += `-- ==========================================\n-- [원본]\n-- ==========================================\n${code}`;
    return { code: out, log, isRaw: false };
  }
  return { code: code, log, isRaw: false };
}

/* ============ 이벤트 ============ */
$('btnProcess').onclick = () => {
  const input = $('input').value;
  if (!input.trim()) { setStatus('[오류] 입력 없음', 'error'); $('output').value = ''; updateStats(); return; }
  try {
    if (MODE === 'obfuscate') {
      $('output').value = generateObfuscated(input);
      setStatus('[성공] VM v9 난독화 완료 · 프리징 방지 task.wait() 적용됨', 'ok');
    } else {
      const { code: r, log, isRaw } = universalDeobfuscate(input);
      $('output').value = r;
      if (isRaw) setStatus(`[경고] ${log.join(' | ')}`, 'warn');
      else setStatus(`[성공] ${log.join(' | ')}`, 'ok');
    }
  } catch (e) {
    $('output').value = `-- 오류: ${e.message}\n\n${input}`;
    setStatus(`[오류] ${e.message}`, 'error');
  }
  updateStats();
};

$('btnLoad').onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.lua,.luau,.txt,.obf,.code';
  inp.onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { $('input').value = r.result; updateStats(); setStatus(`[파일] ${f.name}`, 'info'); };
    r.readAsText(f, 'UTF-8');
  };
  inp.click();
};

$('btnSave').onclick = () => {
  const c = $('output').value;
  if (!c) return setStatus('[오류] 출력 없음', 'error');
  const b = new Blob([c], { type: 'text/plain;charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = MODE === 'obfuscate' ? 'luakeeper_protected.lua' : 'luakeeper_deobfuscated.lua';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(u);
  setStatus(`[저장] ${a.download}`, 'ok');
};

$('btnCopy').onclick = () => {
  const c = $('output').value; if (!c) return;
  navigator.clipboard.writeText(c).then(
    () => setStatus('[복사] 완료', 'info'),
    () => setStatus('[오류] 복사 실패', 'error')
  );
};

$('btnClear').onclick = () => { $('input').value = ''; $('output').value = ''; updateStats(); setStatus('[초기화]', 'idle'); };

updateStats();
setMode('deobfuscate');
</script>
</body>
</html>
