<!DOCTYPE html>
<html lang="ko">
<head>

<style>
  :root {
    --bg: #0a0d14;
    --panel: #0d1117;

    --cyan: #00f0ff;
    --cyan-dim: #00f0ff44;

  ::-webkit-scrollbar { width: 10px; height: 10px; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

<script>
/* ==================================================================
   LUAKEEPER - Core Engine
   ================================================================== */

let MODE = 'deobfuscate';
const $ = (id) => document.getElementById(id);

function setMode(m) {
  MODE = m;
  const ob = $('tabObf'), de = $('tabDeobf');
  if (m === 'obfuscate') {
    ob.className = 'tab-active px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold transition-all';
    de.className = 'px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white';
    $('input').placeholder = '-- Luau 소스를 여기에 붙여넣으세요...\n-- 예: print("안녕하세요")';
    setStatus('Obfuscate 모드 · 원본 Luau를 보호된 스크립트로 변환합니다.', 'idle');
  } else {
    de.className = 'tab-active px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold transition-all';
    ob.className = 'px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white';
    $('input').placeholder = '-- 디컴파일할 고급 난독화 코드를 붙여넣으세요...';
    setStatus('Deobfuscate 모드 · 모든 난독화 패턴을 분석합니다.', 'idle');
  }
}
$('tabObf').onclick = () => setMode('obfuscate');
$('tabDeobf').onclick = () => setMode('deobfuscate');

function setStatus(msg, type = 'idle') {
  const el = $('status');
  const colors = {
    idle: 'text-gray-400 border-[#1e2633]',
    ok: 'text-green-400 border-green-800/50',
    error: 'text-red-400 border-red-800/50',
    info: 'text-cyan-300 border-cyan-800/50',
    warn: 'text-yellow-400 border-yellow-800/50'
  };
  el.className = 'mt-3 px-3 py-2 rounded-md border bg-[#0d1117] text-sm min-h-[42px] flex items-center ' + (colors[type] || colors.idle);
  el.textContent = msg;
}

function updateStats() {
  const inp = $('input').value, out = $('output').value;
  const inB = new TextEncoder().encode(inp).length;
  const outB = new TextEncoder().encode(out).length;
  $('inStats').textContent  = `${inp.split('\n').length} lines · ${inB.toLocaleString()} B`;
  $('outStats').textContent = `${out.split('\n').length} lines · ${outB.toLocaleString()} B`;
  $('stats').textContent = `INPUT ${inB.toLocaleString()} B  ->  OUTPUT ${outB.toLocaleString()} B`;
}
$('input').addEventListener('input', updateStats);

/* ==================================================================
   인코더 / 디코더 로직
   ================================================================== */
function encodeSource(src, seed) {
  const bytes = new TextEncoder().encode(src);
  const enc = new Uint8Array(bytes.length);
  let key = seed & 0xFF;
  for (let i = 0; i < bytes.length; i++) {
    enc[i] = bytes[i] ^ key;
    key = (key * 31 + i + 13) & 0xFF;
  }
  let hex = '';
  for (let i = 0; i < enc.length; i++) hex += enc[i].toString(16).padStart(2, '0');
  return hex;
}

function decodeHex(hex, seed) {
  if (hex.length % 2 !== 0) throw new Error('Hex 길이가 홀수입니다.');
  const byteLen = hex.length / 2;
  const out = new Uint8Array(byteLen);
  let key = seed & 0xFF;
  for (let i = 0; i < byteLen; i++) {
    const b = parseInt(hex.substr(i * 2, 2), 16);
    if (isNaN(b)) throw new Error(`잘못된 Hex 문자 (offset ${i * 2})`);
    out[i] = b ^ key;
    key = (key * 31 + i + 13) & 0xFF;
  }
  return new TextDecoder('utf-8', { fatal: false }).decode(out);
}

/* ==================================================================
   난독화 엔진 (Obfuscator) - 수천 줄의 극악 난이도 생성
   ================================================================== */
const JUNK_POOL = ['zq9kf2', 'm3v8xj', 'p7r1lt', 'b4n6we', 'c2y5ha', 'u0s9dg', 't1i3mp', 'o8e4vr', 'f5h7qb', 'l6a2xk'];

function generateObfuscated(source) {
  const rawSeed = Math.floor(Math.random() * 256);
  // 시드 값을 숨기기 위한 가짜 연산
  const fakeSeedA = Math.floor(Math.random() * 100) + 10;
  const fakeSeedB = rawSeed ^ fakeSeedA; 
  
  const hex = encodeSource(source, rawSeed);
  
  // 데이터를 32자(16바이트) 단위로 아주 잘게 쪼갬 (수십 줄로 늘어남)
  const CHUNK_SIZE = 32; 
  const chunks = [];
  for (let i = 0; i < hex.length; i += CHUNK_SIZE) chunks.push(hex.slice(i, i + CHUNK_SIZE));
  if (chunks.length === 0) chunks.push('');

  // 1. 데이터 은닉 (Constant Scattering)
  const dLines = [];
  for (let i = 0; i < chunks.length; i++) {
    dLines.push(`"${chunks[i]}"`);
    // 쓰레기 데이터도 무작위 길이로 삽입
    const junkStr = JUNK_POOL[i % JUNK_POOL.length] + Math.random().toString(36).substring(2, 5);
    dLines.push(`"${junkStr}"`);
  }

  // 2. 쓰레기 함수 무작위 대량 생성
  const funcNames = [];
  const junkFuncs = [];
  for (let i = 0; i < 200; i++) {
    const name = `_j${i}_${Math.floor(Math.random() * 10000)}`;
    funcNames.push(name);
    const r1 = Math.floor(Math.random() * 1000);
    const r2 = Math.floor(Math.random() * 100);
    junkFuncs.push(`local function ${name}(a, b) if a and b then return (a * ${r1}) - ${r2} else return ${r1} end end`);
  }

  // 3. 복잡한 가짜 상태 머신
  const fakeStates = [];
  for (let i = 0; i < 100; i++) {
    const prev = i === 0 ? 1 : i;
    const next = i + 2;
    const target = funcNames[i % funcNames.length];
    fakeStates.push(`elseif _x == ${i + 10} then
    local _v = ${target}(${i}, ${i+1})
    if _v < 0 then _x = 0 else _x = ${next} end`);
  }

  // 4. 최종 코드 조립 (복잡한 필터링 수식 적용)
  return `-- [System Boot Sequence v4.0]
local _x = 1
local _d = {}
local _k = 0
local _c = ""
local _g = 0

${junkFuncs.join('\n')}

while _x ~= 0 do
    if _x == 1 then
        local ok = pcall(function()
            if type(debug) == "table" and type(debug.info) == "function" then
                if type(debug.info(1, "s")) ~= "string" then error("H") end
            end
        end)
        if not ok then return end
        _x = 2
    elseif _x == 2 then
        -- 숨겨진 시드 복원 수식
        _k = bit32.bxor(${fakeSeedB}, ${fakeSeedA})
        _x = 3
    elseif _x == 3 then
        _d = {
${dLines.join(',\n')}
        }
        _x = 4
    elseif _x == 4 then
        local _p = {}
        for i = 1, #_d do
            -- 매우 복잡하게 꼬인 인덱스 필터링 수식
            if (i * 13 + bit32.band(i, 7)) % 3 == 1 then
                _p[#_p + 1] = _d[i]
            end
        end
        local _h = table.concat(_p)
        local _o = {}
        local _kk = _k
        for i = 1, #_h, 2 do
            local b = tonumber(string.sub(_h, i, i + 1), 16)
            if b then
                local idx = math.floor((i - 1) / 2)
                _o[#_o + 1] = string.char(bit32.bxor(b, _kk))
                _kk = (_kk * 31 + idx + 13) % 256
            end
        end
        _c = table.concat(_o)
        _x = 5
    elseif _x == 5 then
        local f = loadstring(_c)
        if f then f() end
        _x = 0
    ${fakeStates.join('\n    ')}
    end
end
`;
}

/* ==================================================================
   범용 디컴파일러 (Universal Deobfuscator)
   ================================================================== */

function extractLuaStrings(str) {
    const result = [];
    let i = 0;
    while (i < str.length) {
        if (str[i] === '"') {
            let j = i + 1;
            let current = "";
            while (j < str.length && str[j] !== '"') {
                if (str[j] === '\\') {
                    if (str[j+1] === '"') { current += '"'; j += 2; }
                    else if (str[j+1] === '\\') { current += '\\'; j += 2; }
                    else { current += str[j+1]; j += 2; }
                } else {
                    current += str[j];
                    j++;
                }
            }
            result.push(current);
            i = j + 1;
        } else {
            i++;
        }
    }
    return result;
}

function universalDeobfuscate(code) {
  let analysisLog = [];
  let finalOutput = '';
  
  // --- [1단계] 자체 난독화 (LuaKeeper) 복원 ---
  if (code.includes('_x == 5') && code.includes('_x == 1')) {
    // 숨겨진 시드 추출
    const seedMatch = code.match(/_k\s*=\s*bit32\.bxor\((\d+),\s*(\d+)\)/);
    const hexMatches = code.match(/"[a-fA-F0-9]{10,}"/g); // 32자 단위로 잘렸으므로 10자 이상 매칭
    
    if (seedMatch && hexMatches) {
      const fakeSeedB = parseInt(seedMatch[1], 10);
      const fakeSeedA = parseInt(seedMatch[2], 10);
      const realSeed = fakeSeedB ^ fakeSeedA; // 시드 복원

      const chunks = hexMatches.map(h => h.replace(/"/g, ''));
      
      // 복잡한 인덱스 필터링 재현 (i는 Lua에서 1부터 시작)
      const realChunks = [];
      for (let i = 0; i < chunks.length; i++) {
        const luaIdx = i + 1;
        // (i * 13 + bit32.band(i, 7)) % 3 == 1
        if ((luaIdx * 13 + (luaIdx & 7)) % 3 === 1) {
          // 쓰레기 데이터 필터링 (Hex 문자열만 통과)
          if (/^[a-fA-F0-9]+$/.test(chunks[i])) {
            realChunks.push(chunks[i]);
          }
        }
      }

      try {
        const decoded = decodeHex(realChunks.join(''), realSeed);
        return { code: decoded, log: ['[성공] 자체 난독화(LuaKeeper v4.0) 복원 성공'], isRaw: false };
      } catch (e) {
        analysisLog.push('[경고] 자체 난독화 복원 실패: ' + e.message);
      }
    }
  }

  // --- [2단계] Chanhyuk lua 패턴 ---
  if (code.includes('chanhyuk lua') || (code.includes('local n=') && code.includes('local o=') && code.includes('local k='))) {
    try {
      const nMatch = code.match(/local\s+n\s*=\s*\{([\s\S]*?)\}\s*local\s+o/);
      const oMatch = code.match(/local\s+o\s*=\s*\{([\s\S]*?)\}\s*local\s+k/);
      const kMatch = code.match(/local\s+k\s*=\s*(\d+)/);
      const qMatch = code.match(/local\s+q\s*=\s*(\d+)/);
      const aMatch = code.match(/local\s+a\s*=\s*\{([\s\S]*?)\}\s*local\s+g/);

      if (nMatch && oMatch && kMatch && qMatch && aMatch) {
        const nStrings = extractLuaStrings(nMatch[1]);
        const oArr = [...oMatch[1].matchAll(/\d+/g)].map(m => parseInt(m[0], 10));
        const k = parseInt(kMatch[1], 10);
        const q = parseInt(qMatch[1], 10);
        const aArr = [...aMatch[1].matchAll(/\d+/g)].map(m => parseInt(m[0], 10));

        function decodeCH(s, k, q, a) {
          let r = "";
          let j = 1;
          for (let i = 0; i < s.length; i += 2) {
            const v = (s.charCodeAt(i) - 33) * 95 + (s.charCodeAt(i + 1) - 33);
            let val = v - k - (((j - 1) * q) % 251) - a[((j - 1) % a.length)] + 512;
            let idx = val % 256;
            if (idx < 0) idx += 256;
            r += String.fromCharCode(idx);
            j++;
          }
          return r;
        }

        let decoded = "";
        for (let i = 0; i < oArr.length; i++) {
          const idx = oArr[i] - 1;
          if (nStrings[idx]) decoded += decodeCH(nStrings[idx], k, q, aArr);
        }
        return { code: decoded, log: ['[성공] chanhyuk lua 난독화 복원 성공'], isRaw: false };
      }
    } catch (err) {
      analysisLog.push('[경고] chanhyuk lua 분석 실패');
    }
  }

  // --- [3단계] 범용 휴리스틱 분석 ---
  const charRegex = /string\.char\s*\(\s*([0-9,\s]+)\s*\)/g;
  if (charRegex.test(code)) {
    code = code.replace(charRegex, (m, p1) => {
      try {
        const bytes = p1.split(',').map(n => parseInt(n.trim(), 10));
        const text = new TextDecoder('utf-8').decode(new Uint8Array(bytes));
        return '"' + text.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"';
      } catch { return m; }
    });
    analysisLog.push('[성공] string.char 암호화 해제');
  }

  const numTableRegex = /local\s+([a-zA-Z_]\w*)\s*=\s*\{([\d,\s]{30,})\}/g;
  let tMatch;
  while ((tMatch = numTableRegex.exec(code)) !== null) {
    const values = tMatch[2].split(',').map(v => parseInt(v.trim(), 10)).filter(v => !isNaN(v));
    let text = '';
    for (let v of values) if (v >= 32 && v <= 126) text += String.fromCharCode(v);
    if (text.length > 10) finalOutput += `-- [추출된 문자열 (배열 ${tMatch[1]})]\n-- "${text}"\n\n`;
  }

  const flattenRegex = /if\s+([a-zA-Z_]\w*)\s*==\s*(\d+)\s+then([\s\S]*?)(?=elseif\s+\1\s*==|else|end)/g;
  let fMatch;
  let states = [];
  while ((fMatch = flattenRegex.exec(code)) !== null) {
    const body = fMatch[3].trim();
    if (body.length > 10) states.push({ state: parseInt(fMatch[2], 10), body: body });
  }
  if (states.length > 5) {
    states.sort((a, b) => a.state - b.state);
    finalOutput += `-- ==========================================\n`;
    finalOutput += `-- [평탄화 해제된 제어 흐름 (${states.length}개 State)]\n`;
    finalOutput += `-- ==========================================\n`;
    finalOutput += states.map(s => `-- [State ${s.state}]\n${s.body}`).join('\n\n') + '\n\n';
    analysisLog.push(`[성공] ${states.length}개의 제어 흐름 복원`);
  }

  const loadRegex = /(?:loadstring|load)\(\s*(["'])([\s\S]*?)\1\s*\)/;
  const loadMatch = code.match(loadRegex);
  if (loadMatch && loadMatch[2]) {
    let inner = loadMatch[2].replace(/\\(\d{1,3})/g, (m, p1) => String.fromCharCode(parseInt(p1, 10)));
    inner = inner.replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\'/g, "'");
    finalOutput += `-- ==========================================\n`;
    finalOutput += `-- [loadstring 내부 코드 복원]\n`;
    finalOutput += `-- ==========================================\n${inner}\n`;
    analysisLog.push('[성공] loadstring 래퍼 해제');
  }

  if (analysisLog.length === 0) {
    analysisLog.push('[정보] 알려진 패턴이 없습니다. (일반 코드이거나 최상위 난독화)');
    return { code: code, log: analysisLog, isRaw: true };
  }

  if (finalOutput.length > 0) {
    finalOutput += `-- ==========================================\n`;
    finalOutput += `-- [원본/남은 코드]\n`;
    finalOutput += `-- ==========================================\n${code}`;
    return { code: finalOutput, log: analysisLog, isRaw: false };
  }
  
  return { code: code, log: analysisLog, isRaw: false };
}

/* ==================================================================
   이벤트 리스너
   ================================================================== */
$('btnProcess').onclick = () => {
  const input = $('input').value;
  if (!input.trim()) {
    setStatus('[오류] 입력이 비어 있습니다.', 'error');
    $('output').value = '';
    updateStats();
    return;
  }

  try {
    if (MODE === 'obfuscate') {
      $('output').value = generateObfuscated(input);
      setStatus('[성공] 난독화 완료 · 보호 스크립트가 생성되었습니다.', 'ok');
    } else {
      const { code: result, log, isRaw } = universalDeobfuscate(input);
      $('output').value = result;
      
      if (isRaw) {
        setStatus(`[경고] ${log.join(' | ')} · 원본 코드를 출력합니다.`, 'warn');
      } else {
        setStatus(`[성공] 분석 완료 · ${log.join(' | ')}`, 'ok');
      }
    }
  } catch (err) {
    console.error(err);
    $('output').value = `-- 오류 발생: ${err.message}\n-- 원본 입력:\n\n${input}`;
    setStatus(`[오류] ${err.message}`, 'error');
  }
  updateStats();
};

$('btnLoad').onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.lua,.luau,.txt,.obf,.code';
  inp.onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      $('input').value = r.result;
      updateStats();
      setStatus(`[파일] 로드 완료: ${f.name} (${f.size.toLocaleString()} B)`, 'info');
    };
    r.readAsText(f, 'UTF-8');
  };
  inp.click();
};

$('btnSave').onclick = () => {
  const content = $('output').value;
  if (!content) return setStatus('[오류] 저장할 출력이 없습니다.', 'error');
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = MODE === 'obfuscate' ? 'luakeeper_protected.lua' : 'luakeeper_deobfuscated.lua';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setStatus(`[저장] 완료: ${a.download}`, 'ok');
};

$('btnCopy').onclick = () => {
  const content = $('output').value;
  if (!content) return;
  navigator.clipboard.writeText(content).then(
    () => setStatus('[복사] 클립보드에 복사되었습니다.', 'info'),
    () => setStatus('[오류] 클립보드 복사 실패', 'error')
  );
};

$('btnClear').onclick = () => {
  $('input').value = ''; $('output').value = '';
  updateStats(); setStatus('[초기화] 완료', 'idle');
};

updateStats();
setMode('deobfuscate');
</script>
</body>
</html>
