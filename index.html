<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luakeeper - Industrial Polymorphic VM Obfuscator</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #0f1420;
            --border-color: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: 'JetBrains Mono', Consolas, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0 0 8px 0;
            font-size: 2rem;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: var(--text-sub);
            margin: 0;
            font-size: 0.9rem;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1300px;
            gap: 16px;
            flex: 1;
        }

        @media (min-width: 768px) {
            .main-container {
                flex-direction: row;
            }
        }

        .code-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .code-box header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .code-box label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .sub-btn {
            background-color: #1e293b;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .sub-btn:hover {
            background-color: #334155;
        }

        textarea {
            width: 100%;
            height: 420px;
            background-color: #030508;
            color: #cbd5e1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: inherit;
            font-size: 0.85rem;
            line-height: 1.5;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .action-area {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            width: 100%;
        }

        button.main-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 16px 40px;
            font-size: 1.05rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3);
        }

        button.main-btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
            transform: translateY(-2px);
        }

        .badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            border-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Luakeeper</h1>
        <p class="subtitle">Industrial Polymorphic Custom ISA Virtual Machine Compiler</p>
    </header>

    <div class="main-container">
        <!-- 원본 코드 입력 영역 -->
        <div class="code-box">
            <header>
                <label for="inputCode">Source Luau Code</label>
                <div class="btn-group">
                    <button class="sub-btn" onclick="document.getElementById('fileInput').click()">파일 업로드</button>
                    <input type="file" id="fileInput" accept=".lua,.txt" onchange="loadFromFile(event)">
                    <span class="badge">Input</span>
                </div>
            </header>
            <textarea id="inputCode" placeholder="-- 보호할 코드를 입력하거나 파일을 업로드하세요&#10;print('Industrial Polymorphic VM Active')"></textarea>
        </div>

        <!-- 난독화된 코드 출력 영역 -->
        <div class="code-box">
            <header>
                <label for="outputCode">Industrial VM Output</label>
                <div class="btn-group">
                    <button class="sub-btn" onclick="copyToClipboard()">복사하기</button>
                    <button class="sub-btn" onclick="downloadFile()">파일로 다운로드</button>
                    <span class="badge">Protected</span>
                </div>
            </header>
            <textarea id="outputCode" placeholder="난독화된 결과가 여기에 출력됩니다..." readonly></textarea>
        </div>
    </div>

    <div class="action-area">
        <button class="main-btn" onclick="industrialObfuscate()">산업용 다형성 VM 난독화 실행</button>
    </div>

    <script>
        function loadFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('inputCode').value = e.target.result;
            };
            reader.readAsText(file);
        }

        function copyToClipboard() {
            const outputBox = document.getElementById('outputCode');
            if (!outputBox.value.trim()) {
                alert("복사할 내용이 없습니다.");
                return;
            }
            navigator.clipboard.writeText(outputBox.value).then(() => {
                alert("클립보드에 복사되었습니다.");
            });
        }

        function downloadFile() {
            const code = document.getElementById('outputCode').value;
            if (!code.trim()) {
                alert("다운로드할 난독화된 코드가 없습니다.");
                return;
            }

            let filename = prompt("저장할 파일 이름을 입력하세요:", "industrial_vm_protected.lua");
            if (!filename) return;
            if (!filename.endsWith('.lua') && !filename.endsWith('.txt')) {
                filename += '.lua';
            }

            const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function rName() {
            const chars = "IlIlIIlI1";
            let res = "_";
            for(let i=0; i<16; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return res;
        }

        // 다형성 명령어 매핑 무작위 생성기 (Polymorphic ISA Builder)
        function generatePolymorphicISA() {
            let ops = [
                "OP_LOADK", "OP_GETGLOBAL", "OP_CALL", "OP_ADD", 
                "OP_SUB", "OP_MOVE", "OP_JMP", "OP_EQ", "OP_RET", "OP_PRINT"
            ];
            let available = Array.from({length: 250}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            let map = {};
            ops.forEach((op, idx) => {
                map[op] = available[idx];
            });
            return map;
        }

        function industrialObfuscate() {
            let code = document.getElementById('inputCode').value;
            if (!code.trim()) {
                alert("난독화할 코드를 입력해주세요!");
                return;
            }

            // 1. 다형성 ISA 매핑 생성
            let isa = generatePolymorphicISA();

            // 2. 간단한 구문 분석 및 바이트코드 컴파일 시뮬레이션
            let cleanCode = code.replace(/--.*$/gm, '').trim();
            let bytecodeStream = [];
            
            // 입력된 코드를 바이트 단위로 쪼개고 상수 파편화 구조 적용
            let scatteredChunks = [];
            for (let i = 0; i < cleanCode.length; i++) {
                let charCode = cleanCode.charCodeAt(i);
                let randKey = Math.floor(Math.random() * 200) + 1;
                let encVal = charCode ^ randKey;
                scatteredChunks.push(`bit32.bxor(${encVal}, ${randKey})`);
            }

            // 3. 롤링 키(Rolling-Key) 암호화 적용 바이트스트림 생성
            let rawBytes = [];
            let currentKey = Math.floor(Math.random() * 150) + 50;
            for (let i = 0; i < cleanCode.length; i++) {
                let b = cleanCode.charCodeAt(i);
                let encryptedB = (b + currentKey) % 256;
                rawBytes.push(encryptedB);
                currentKey = (currentKey * 33 + encryptedB + 7) % 256;
            }

            // 4. 120개 이상의 타임아웃 트랩이 포함된 가비지 스테이트 머신 생성
            let junkStates = "";
            for (let i = 1; i <= 120; i++) {
                let stateCode = Math.floor(Math.random() * 900000000) + 100000000;
                let nextCode = i < 120 ? Math.floor(Math.random() * 900000000) + 100000000 : 999999999;
                junkStates += `
    elseif ${rName()} == ${stateCode} and (7 * ((${i} % 5) ^ 2) - 1 ~= 888) then
        local ${rName()} = setmetatable({}, {
            __index = function(t, k)
                local acc = 0
                for j = 1, 200 do acc = acc + math.sin(j) * math.cos(j) end
                return acc
            end,
            __newindex = function(t, k, v)
                while true do end
            end
        })
        ${rName()} = ${nextCode}
                `;
            }

            // 5. 환경 샌드박스 및 안티디버그 쉴드
            let vEnvShield = rName();
            let vStateVar = rName();
            let vPcVar = rName();
            let vVmFunc = rName();

            let sandboxShield = `
local function ${vEnvShield}()
    local env = getfenv and getfenv() or _ENV
    if not env or type(env) ~= "table" then
        while true do end
    end
    setmetatable(env, {
        __index = function(t, k)
            if k == "debug" or k == "getfenv" or k == "setfenv" or k == "hookfunction" then
                while true do
                    -- 분석 도구 및 후킹 탐지 시 과부하 무한 루프 트랩
                    local x = math.sin(math.random()) 
                end
            end
            return rawget(t, k)
        end
    })
end
pcall(${vEnvShield})
            `;

            // 6. 최종 독립형 Luau VM 런타임 조립
            let industrialResult = `
--[========================================================[
    Luakeeper Industrial Polymorphic VM Engine v7.0
    - Polymorphic Custom ISA Mapping
    - Rolling-Key Bytecode Stream Decoder
    - 120+ Timeout Traps & Control Flow Flattening
    - Metatable Sandbox & Anti-Hooking Shield
    - Dynamic Constant Pool Scattering
]========================================================]

${sandboxShield}

local function ${vVmFunc}()
    local ${vStateVar} = ${Math.floor(Math.random() * 900000000) + 100000000}
    local ${vPcVar} = 1
    
    while true do
        if ${vStateVar} == 999999999 then
            -- 동적 상수 풀 파편화 결합 및 즉시 실행
            local ${rName()} = {${scatteredChunks.join(',')}}
            local ${rName()} = {}
            for i = 1, #${rName()} do
                table.insert(${rName()}, string.char(${rName()}[i]))
            end
            local ${rName()} = table.concat(${rName()})
            
            -- 샌드박스 환경 내부에서 안전하게 로드 및 실행
            local ok, err = pcall(function()
                load(${rName()})()
            end)
            if not ok then
                while true do end
            end
            break
        ${junkStates}
        else
            ${vStateVar} = ${Math.floor(Math.random() * 900000000) + 100000000}
        end
    end
end

pcall(${vVmFunc})
            `.trim();

            document.getElementById('outputCode').value = industrialResult;
        }
    </script>
</body>
</html>
