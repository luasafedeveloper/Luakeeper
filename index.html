<script>
const $ = (id) => document.getElementById(id);
let MODE = 'deobfuscate';

function setMode(m) {
  MODE = m;
  const ob = $('tabObf'), de = $('tabDeobf');
  if (m === 'obfuscate') {
    ob.className = 'tab-active px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold transition-all';
    de.className = 'px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white';
    $('input').placeholder = '-- Luau 소스를 여기에 붙여넣으세요...';
    setStatus('Obfuscate 모드 · 진짜 VM 바이트코드로 컴파일합니다.', 'idle');
  } else {
    de.className = 'tab-active px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold transition-all';
    ob.className = 'px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white';
    $('input').placeholder = '-- 디컴파일할 난독화 코드를 붙여넣으세요...';
    setStatus('Deobfuscate 모드 · VM 바이트코드를 역어셈블합니다.', 'idle');
  }
}
$('tabObf').onclick = () => setMode('obfuscate');
$('tabDeobf').onclick = () => setMode('deobfuscate');

function setStatus(msg, type = 'idle') {
  const el = $('status');
  const colors = {
    idle: 'text-gray-400 border-[#1e2633]',
    ok: 'text-green-400 border-green-800/50',
    error: 'text-red-400 border-red-800/50',
    info: 'text-cyan-300 border-cyan-800/50',
    warn: 'text-yellow-400 border-yellow-800/50'
  };
  el.className = 'mt-3 px-3 py-2 rounded-md border bg-[#0d1117] text-sm min-h-[42px] flex items-center ' + (colors[type] || colors.idle);
  el.textContent = msg;
}

function updateStats() {
  const inp = $('input').value, out = $('output').value;
  const inB = new TextEncoder().encode(inp).length;
  const outB = new TextEncoder().encode(out).length;
  $('inStats').textContent  = `${inp.split('\n').length} lines · ${inB.toLocaleString()} B`;
  $('outStats').textContent = `${out.split('\n').length} lines · ${outB.toLocaleString()} B`;
  $('stats').textContent = `IN ${inB.toLocaleString()} B → OUT ${outB.toLocaleString()} B`;
}
$('input').addEventListener('input', updateStats);

/* ============ Dual XOR (인코딩/디코딩 완벽 대칭) ============ */
function encodeSource(src, seed1, seed2) {
  const bytes = new TextEncoder().encode(src);
  const enc = new Uint8Array(bytes.length);
  let k1 = seed1 & 0xFF, k2 = seed2 & 0xFF;
  for (let i = 0; i < bytes.length; i++) {
    let v = bytes[i] ^ k1; k1 = (k1 * 31 + i + 13) & 0xFF;
    let v2 = v ^ k2; k2 = (k2 * 17 + i + 7) & 0xFF;
    enc[i] = v2;
  }
  let hex = '';
  for (let i = 0; i < enc.length; i++) hex += enc[i].toString(16).padStart(2, '0');
  return hex;
}

function decodeDualXOR(hex, seed1, seed2) {
  if (hex.length % 2 !== 0) throw new Error('Hex 홀수');
  const byteLen = hex.length / 2;
  const out = new Uint8Array(byteLen);
  let k1 = seed1 & 0xFF, k2 = seed2 & 0xFF;
  for (let i = 0; i < byteLen; i++) {
    const b = parseInt(hex.substr(i * 2, 2), 16);
    if (isNaN(b)) throw new Error(`bad hex @${i*2}`);
    let v = b ^ k2; k2 = (k2 * 17 + i + 7) & 0xFF;
    let v2 = v ^ k1; k1 = (k1 * 31 + i + 13) & 0xFF;
    out[i] = v2;
  }
  return new TextDecoder('utf-8', { fatal: false }).decode(out);
}

/* ============ 랜덤 헬퍼 ============ */
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
const _usedVars = new Set();
function randVar() {
  while (true) {
    const v = "_" + Math.random().toString(36).substring(2, 7).replace(/[0-9]/g, m => 'abcdefghij'[+m]);
    if (!_usedVars.has(v) && /^_[a-z]+$/.test(v)) { _usedVars.add(v); return v; }
  }
}

/* ==================================================================
   ★ 진짜 VM 난독화 엔진 (v16)
   ================================================================== */
function generateObfuscated(source) {
  _usedVars.clear();
  
  const seed1 = randInt(1, 255);
  const seed2 = randInt(1, 255);
  const fakeA1 = randInt(10, 200), fakeB1 = seed1 ^ fakeA1;
  const fakeA2 = randInt(10, 200), fakeB2 = seed2 ^ fakeA2;

  // 1) Dual XOR 인코딩
  const hex = encodeSource(source, seed1, seed2);

  // 2) 청크 분할
  const CHUNK = 1024;
  const chunks = [];
  for (let i = 0; i < hex.length; i += CHUNK) chunks.push(hex.slice(i, i + CHUNK));
  if (chunks.length === 0) chunks.push('');

  // 3) CONST 풀 (chunks + 쓰레기)
  const constAll = [...chunks];
  for (let i = 0; i < 20; i++) {
    constAll.push("J" + i + "_" + Math.random().toString(36).substring(2, 8));
  }

  // 4) 진짜 바이트코드 생성
  const BC = [];
  // LOAD: R[i] = CONST[i]
  for (let i = 0; i < chunks.length; i++) {
    BC.push([0, i, i]);
  }
  // CONCAT: R[0] = R[0] .. R[i]
  for (let i = 1; i < chunks.length; i++) {
    BC.push([1, 0, 0, i]);
  }
  // DECODE: R[0] = decode(R[0])
  BC.push([2, 0, 0]);
  // LOADFN: R[1] = loadstring(R[0])
  BC.push([3, 1, 0]);
  // CALL: R[1]()
  BC.push([4, 1]);
  // HALT
  BC.push([5]);

  // 5) 쓰레기 NOP 삽입
  for (let i = 0; i < 15; i++) {
    BC.splice(randInt(0, BC.length), 0, [6]);
  }

  // 6) 직렬화 (★ 올바른 Lua 문법)
  const constStr = constAll.map(s => `"${s}"`).join(',');
  const bcStr = BC.map(ins => `{${ins.join(',')}}`).join(',');

  // 7) 랜덤 변수명
  const vL = randVar();    // loader
  const vH = randVar();    // halt flag
  const vC = randVar();    // const pool
  const vB = randVar();    // bytecode
  const vR = randVar();    // registers
  const vP = randVar();    // pc
  const vI = randVar();    // instruction
  const vO = randVar();    // opcode
  const vT = randVar();    // temp hex
  const vT2 = randVar();   // temp output
  const vK1 = randVar();   // seed1
  const vK2 = randVar();   // seed2
  const vA1 = randVar();   // local k1 in decode
  const vA2 = randVar();   // local k2 in decode
  const vF = randVar();    // function
  const vX = randVar();    // temp byte
  const vI2 = randVar();   // decode loop index
  const vID = randVar();   // decode loop byte index

  // 8) 최종 코드
  return `-- Obfuscated by LuaKeeper
local ${vL},${vH}=nil,false
pcall(function()${vL}=rawget(getfenv(),"loadstring")or rawget(getfenv(),"load")end)
if type(${vL})~="function"then return end
local ${vC}={${constStr}}
local ${vB}={${bcStr}}
local ${vR}={}
local ${vP}=1
local ${vK1}=bit32.bxor(${fakeA1},${fakeB1})
local ${vK2}=bit32.bxor(${fakeA2},${fakeB2})
while not ${vH} do
local ${vI}=${vB}[${vP}]
if not ${vI} then ${vH}=true
else
${vO}=${vI}[1]
if ${vO}==0 then
${vR}[${vI}[2]]=${vC}[${vI}[3]+1]
elseif ${vO}==1 then
${vR}[${vI}[2]]=${vR}[${vI}[3]]..${vR}[${vI}[4]]
elseif ${vO}==2 then
local ${vT}=${vR}[${vI}[3]]or ""
local ${vA1}=${vK1}
local ${vA2}=${vK2}
local ${vT2}={}
for ${vI2}=1,#${vT},2 do
local ${vX}=tonumber(string.sub(${vT},${vI2},${vI2}+1),16)or 0
local ${vID}=math.floor((${vI2}-1)/2)
${vT2}[#${vT2}+1]=string.char(bit32.bxor(bit32.bxor(${vX},${vA2}),${vA1}))
${vA2}=(${vA2}*17+${vID}+7)%256
${vA1}=(${vA1}*31+${vID}+13)%256
end
${vR}[${vI}[2]]=table.concat(${vT2})
elseif ${vO}==3 then
${vR}[${vI}[2]]=${vL}(${vR}[${vI}[3]])
elseif ${vO}==4 then
${vF}=${vR}[${vI}[2]]
if ${vF} then pcall(function()task.spawn(${vF})end)end
elseif ${vO}==5 then
${vH}=true
end
end
${vP}=${vP}+1
end
`;
}

/* ==================================================================
   ★ True VM 디컴파일러 (v16)
   ================================================================== */
function tryDevirtualize(code) {
  const log = [];
  try {
    // 1) CONST 풀 추출
    const constMatch = code.match(/local\s+([a-zA-Z_]\w*)\s*=\s*\{((?:"[^"\\]*(?:\\.[^"\\]*)*"\s*,?\s*)+)\}/);
    if (!constMatch) { log.push('CONST 풀 못 찾음'); return { success: false, log }; }
    const constStrs = [...constMatch[2].matchAll(/"([^"\\]*(?:\\.[^"\\]*)*)"/g)].map(m => m[1]);
    log.push(`CONST: ${constStrs.length}개`);

    // 2) BYTECODE 추출
    const bcMatch = code.match(/local\s+([a-zA-Z_]\w*)\s*=\s*\{(\s*\{[^{}]*\}\s*(?:,\s*\{[^{}]*\}\s*)*)\}/);
    if (!bcMatch) { log.push('BYTECODE 못 찾음'); return { success: false, log }; }
    const bcArr = [...bcMatch[2].matchAll(/\{([^{}]*)\}/g)].map(m => 
      m[1].split(',').map(v => parseInt(v.trim(), 10)).filter(v => !isNaN(v))
    );
    log.push(`BYTECODE: ${bcArr.length}개 명령어`);

    // 3) Seeds 추출 (bit32.bxor(숫자, 숫자) 패턴만)
    const seedMatches = [...code.matchAll(/bit32\.bxor\s*\(\s*(\d+)\s*,\s*(\d+)\s*\)/g)];
    if (seedMatches.length < 2) { log.push(`Seed 못 찾음 (${seedMatches.length}개)`); return { success: false, log }; }
    const seed1 = parseInt(seedMatches[0][1], 10) ^ parseInt(seedMatches[0][2], 10);
    const seed2 = parseInt(seedMatches[1][1], 10) ^ parseInt(seedMatches[1][2], 10);
    log.push(`Seeds: (${seed1}, ${seed2})`);

    // 4) LOAD 명령어(opcode 0)에서 진짜 chunk 추출
    const chunks = [];
    for (const ins of bcArr) {
      if (ins[0] === 0 && ins.length >= 3) {
        const chunk = constStrs[ins[2]];
        // Hex 문자열만 (빈 문자열도 허용하되, "J..." 쓰레기는 제외)
        if (chunk !== undefined && /^[a-fA-F0-9]*$/.test(chunk)) {
          chunks.push(chunk);
        }
      }
    }
    if (chunks.length === 0) { log.push('LOAD된 청크 없음'); return { success: false, log }; }
    log.push(`LOAD된 청크: ${chunks.length}개`);

    // 5) 디코딩
    const fullHex = chunks.join('');
    log.push(`Hex 총 길이: ${fullHex.length}`);
    if (fullHex.length === 0) {
      log.push('Hex 비어있음');
      return { success: true, code: '', log };
    }
    const decoded = decodeDualXOR(fullHex, seed1, seed2);
    log.push(`디코딩 완료: ${decoded.length} bytes`);
    return { success: true, code: decoded, log };
  } catch (e) {
    log.push('예외: ' + e.message);
    return { success: false, log };
  }
}

/* ============ 다중 패턴 디컴파일러 ============ */
function universalDeobfuscate(code) {
  const log = [];

  // [1] LuaKeeper True VM
  if (code.includes('Obfuscated by LuaKeeper') && code.includes('bit32.bxor')) {
    log.push('[VM v16] 시그니처 감지');
    const r = tryDevirtualize(code);
    log.push(...r.log);
    if (r.success) {
      return { code: r.code, log, isRaw: false };
    }
    // VM 감지했지만 디코딩 실패 → 사용자에게 알림
    log.push('[실패] VM 구조는 찾았으나 디코딩 실패');
    return { code: code, log, isRaw: true };
  }

  // [2] MoonVeil / Luraph / Moonsec 패턴 (시그니처 감지 + 구조 분석)
  if (code.includes('MoonVeil') || code.includes('Luraph') || code.includes('Moonsec') ||
      (code.includes('return({function') && code.includes('a.ia['))) {
    log.push('[MoonVeil/Luraph/Moonsec] 시그니처 감지');
    
    // VM 상수 풀 추출 시도
    const bigNumRegex = /\{((?:-?\d+\s*,\s*){50,}-?\d+)\}/g;
    let m, poolCount = 0;
    while ((m = bigNumRegex.exec(code)) !== null) {
      poolCount++;
    }
    if (poolCount > 0) log.push(`[VM] 숫자 상수 풀: ${poolCount}개 감지`);
    
    // 컨테이너 문자열 추출
    const containerRegex = /["']([A-Za-z0-9+\/=\\x]{500,})["']/g;
    let c, containerCount = 0;
    while ((c = containerRegex.exec(code)) !== null) {
      containerCount++;
      log.push(`[VM] 대용량 문자열: ${c[1].length} chars`);
    }
    
    log.push(`[결론] MoonVeil/Luraph VM은 전용 인터프리터 없이 100% 복원 불가`);
    log.push(`[안내] 상수 풀 및 컨테이너 추출만 가능 - 수동 분석 필요`);
    return { code: code, log, isRaw: true };
  }

  // [3] Chanhyuk lua
  if (code.includes('chanhyuk lua') || (code.includes('local n=') && code.includes('local o='))) {
    try {
      const nMatch = code.match(/local\s+n\s*=\s*\{([\s\S]*?)\}\s*local\s+o/);
      const oMatch = code.match(/local\s+o\s*=\s*\{([\s\S]*?)\}\s*local\s+k/);
      const kMatch = code.match(/local\s+k\s*=\s*(\d+)/);
      const qMatch = code.match(/local\s+q\s*=\s*(\d+)/);
      const aMatch = code.match(/local\s+a\s*=\s*\{([\s\S]*?)\}\s*local\s+g/);
      if (nMatch && oMatch && kMatch && qMatch && aMatch) {
        const nStrings = [...nMatch[1].matchAll(/"([^"\\]*(?:\\.[^"\\]*)*)"/g)].map(m => m[1]);
        const oArr = [...oMatch[1].matchAll(/\d+/g)].map(mm => parseInt(mm[0], 10));
        const k = parseInt(kMatch[1], 10), q = parseInt(qMatch[1], 10);
        const aArr = [...aMatch[1].matchAll(/\d+/g)].map(mm => parseInt(mm[0], 10));
        function decCH(s, k, q, a) {
          let r = "", j = 1;
          for (let i = 0; i < s.length; i += 2) {
            const v = (s.charCodeAt(i) - 33) * 95 + (s.charCodeAt(i + 1) - 33);
            let idx = (v - k - (((j - 1) * q) % 251) - a[((j - 1) % a.length)] + 512) % 256;
            if (idx < 0) idx += 256;
            r += String.fromCharCode(idx); j++;
          }
          return r;
        }
        let decoded = "";
        for (let i = 0; i < oArr.length; i++) {
          const idx = oArr[i] - 1;
          if (nStrings[idx]) decoded += decCH(nStrings[idx], k, q, aArr);
        }
        return { code: decoded, log: ['[성공] Chanhyuk lua 복원'], isRaw: false };
      }
    } catch (e) { log.push('[실패] Chanhyuk: ' + e.message); }
  }

  // [4] 다중 loadstring
  let iter = 0;
  const loadRegex = /(?:loadstring|load)\s*\(\s*(["'])([\s\S]*?)\1\s*\)/;
  let lm;
  while ((lm = code.match(loadRegex)) && iter < 8) {
    let inner = lm[2].replace(/\\(\d{1,3})/g, (m, p1) => String.fromCharCode(parseInt(p1, 10)));
    inner = inner.replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\'/g, "'");
    if (inner === lm[2]) break;
    code = inner; iter++;
  }
  if (iter > 0) {
    log.push(`[성공] loadstring x${iter}`);
    return { code: code, log, isRaw: false };
  }

  // [5] base64
  const b64Regex = /base64,([A-Za-z0-9+\/=]{20,})/g;
  if (b64Regex.test(code)) {
    code = code.replace(b64Regex, (m, b64) => {
      try { return '"' + atob(b64).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"'; }
      catch { return m; }
    });
    log.push('[성공] base64');
    return { code: code, log, isRaw: false };
  }

  // [6] string.char
  const charRegex = /string\.char\s*\(\s*([0-9,\s]+)\s*\)/g;
  if (charRegex.test(code)) {
    code = code.replace(charRegex, (m, p1) => {
      try {
        const bytes = p1.split(',').map(n => parseInt(n.trim(), 10));
        return '"' + new TextDecoder('utf-8').decode(new Uint8Array(bytes)).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"';
      } catch { return m; }
    });
    log.push('[성공] string.char');
    return { code: code, log, isRaw: false };
  }

  // 아무것도 매칭 안 됨
  log.push('[정보] 알려진 패턴 없음');
  return { code: code, log, isRaw: true };
}

/* ============ 이벤트 ============ */
$('btnProcess').onclick = () => {
  const input = $('input').value;
  if (!input.trim()) { setStatus('[오류] 입력 없음', 'error'); $('output').value = ''; updateStats(); return; }
  try {
    if (MODE === 'obfuscate') {
      $('output').value = generateObfuscated(input);
      setStatus('[성공] 진짜 VM v16 난독화 완료 · fetch-decode-execute + 가상 레지스터', 'ok');
    } else {
      const { code: r, log, isRaw } = universalDeobfuscate(input);
      $('output').value = r;
      if (isRaw) setStatus(`[경고] ${log.join(' | ')}`, 'warn');
      else setStatus(`[성공] ${log.join(' | ')}`, 'ok');
    }
  } catch (e) {
    $('output').value = `-- 오류: ${e.message}\n\n${input}`;
    setStatus(`[오류] ${e.message}`, 'error');
  }
  updateStats();
};

$('btnLoad').onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.lua,.luau,.txt,.obf,.code';
  inp.onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { $('input').value = r.result; updateStats(); setStatus(`[파일] ${f.name}`, 'info'); };
    r.readAsText(f, 'UTF-8');
  };
  inp.click();
};

$('btnSave').onclick = () => {
  const c = $('output').value;
  if (!c) return setStatus('[오류] 출력 없음', 'error');
  const b = new Blob([c], { type: 'text/plain;charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = MODE === 'obfuscate' ? 'luakeeper_vm.lua' : 'luakeeper_deobfuscated.lua';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(u);
  setStatus(`[저장] ${a.download}`, 'ok');
};

$('btnCopy').onclick = () => {
  const c = $('output').value; if (!c) return;
  navigator.clipboard.writeText(c).then(
    () => setStatus('[복사] 완료', 'info'),
    () => setStatus('[오류] 복사 실패', 'error')
  );
};

$('btnClear').onclick = () => { $('input').value = ''; $('output').value = ''; updateStats(); setStatus('[초기화]', 'idle'); };

updateStats();
setMode('deobfuscate');
</script>
