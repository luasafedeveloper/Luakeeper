<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Luakeeper - Professional Luau Obfuscator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            width: 100%;
            max-width: 1100px;
            gap: 20px;
        }
        .box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #cbd5e1;
        }
        textarea {
            width: 100%;
            height: 400px;
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .controls {
            margin: 20px 0;
            text-align: center;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <h1>🔒 Luakeeper</h1>
    <p class="subtitle">Advanced Virtual Machine & Bytecode Obfuscator</p>

    <div class="container">
        <!-- 원본 코드 입력창 -->
        <div class="box">
            <label for="inputCode">원본 루아 코드 (Input)</label>
            <textarea id="inputCode" placeholder="-- 보호할 코드를 입력하세요&#10;local score = 100&#10;print(score)"></textarea>
        </div>

        <!-- 난독화된 코드 출력창 -->
        <div class="box">
            <label for="outputCode">난독화된 가상 머신 코드 (Output)</label>
            <textarea id="outputCode" placeholder="상용 수준의 VM 구조로 변환된 결과가 여기에 표시됩니다." readonly></textarea>
        </div>
    </div>

    <div class="controls">
        <button onclick="advancedObfuscate()">상용급 VM 난독화 실행</button>
    </div>

    <script>
        function generateRandomName() {
            const chars = "IlIlIIlI";
            let res = "_";
            for(let i=0; i<12; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return res;
        }

        function advancedObfuscate() {
            let code = document.getElementById('inputCode').value;
            
            if (!code.trim()) {
                alert("난독화할 코드를 입력해주세요!");
                return;
            }

            // 1. 주석 제거
            let cleanCode = code.replace(/--.*$/gm, '');

            // 2. 가상 머신 런타임 모방 구조 생성 (상용 툴 기초 뼈대)
            let bytes = [];
            for (let i = 0; i < cleanCode.length; i++) {
                // 바이트 난수 XOR 연산 시뮬레이션
                let b = cleanCode.charCodeAt(i) ^ 0x5A;
                bytes.push(b);
            }

            const vmName1 = generateRandomName();
            const vmName2 = generateRandomName();
            const vmName3 = generateRandomName();
            const vmName4 = generateRandomName();

            let heavyRuntimes = `
-- [Luakeeper v2.0 Professional VM Protection]
-- Anti-Tamper & Virtualized Bytecode Stream
local ${vmName1} = {${bytes.join(',')}}
local function ${vmName2}(${vmName3})
    local ${vmName4} = {}
    for i = 1, #${vmName1} do
        table.insert(${vmName4}, string.char(bit32.bxor(${vmName1}[i], 0x5A)))
    end
    return table.concat(${vmName4})
end

local ${vMSig = generateRandomName()} = ${vmName2}(${vmName1})
load(${vMSig})()
            `.trim();

            document.getElementById('outputCode').value = heavyRuntimes;
        }
    </script>

</body>
</html>
