<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luakeeper - Industrial Polymorphic VM Obfuscator</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #0f1420;
            --border-color: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: 'JetBrains Mono', Consolas, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0 0 8px 0;
            font-size: 2rem;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: var(--text-sub);
            margin: 0;
            font-size: 0.9rem;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1300px;
            gap: 16px;
            flex: 1;
        }

        @media (min-width: 768px) {
            .main-container {
                flex-direction: row;
            }
        }

        .code-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .code-box header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .code-box label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .sub-btn {
            background-color: #1e293b;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .sub-btn:hover {
            background-color: #334155;
        }

        textarea {
            width: 100%;
            height: 420px;
            background-color: #030508;
            color: #cbd5e1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: inherit;
            font-size: 0.85rem;
            line-height: 1.5;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .action-area {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            width: 100%;
        }

        button.main-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 16px 40px;
            font-size: 1.05rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3);
        }

        button.main-btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
            transform: translateY(-2px);
        }

        .badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            border-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Luakeeper</h1>
        <p class="subtitle">Industrial Polymorphic Custom ISA Virtual Machine Compiler</p>
    </header>

    <div class="main-container">
        <!-- 원본 코드 입력 영역 -->
        <div class="code-box">
            <header>
                <label for="inputCode">Source Luau Code</label>
                <div class="btn-group">
                    <button class="sub-btn" onclick="document.getElementById('fileInput').click()">파일 업로드</button>
                    <input type="file" id="fileInput" accept=".lua,.txt" onchange="loadFromFile(event)">
                    <span class="badge">Input</span>
                </div>
            </header>
            <textarea id="inputCode" placeholder="-- 보호할 코드를 입력하거나 파일을 업로드하세요
print('Industrial Polymorphic VM Active')"></textarea>
        </div>

        <!-- 난독화된 코드 출력 영역 -->
        <div class="code-box">
            <header>
                <label for="outputCode">Industrial VM Output</label>
                <div class="btn-group">
                    <button class="sub-btn" onclick="copyToClipboard()">복사하기</button>
                    <button class="sub-btn" onclick="downloadFile()">파일로 다운로드</button>
                    <span class="badge">Protected</span>
                </div>
            </header>
            <textarea id="outputCode" placeholder="난독화된 결과가 여기에 출력됩니다..." readonly></textarea>
        </div>
    </div>

    <div class="action-area">
        <button class="main-btn" onclick="industrialObfuscate()">산업용 다형성 VM 난독화 실행</button>
    </div>

    <script>
        function loadFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('inputCode').value = e.target.result;
            };
            reader.readAsText(file);
        }

        function copyToClipboard() {
            const outputBox = document.getElementById('outputCode');
            if (!outputBox.value.trim()) {
                alert("복사할 내용이 없습니다.");
                return;
            }
            navigator.clipboard.writeText(outputBox.value).then(() => {
                alert("클립보드에 복사되었습니다.");
            });
        }

        function downloadFile() {
            const code = document.getElementById('outputCode').value;
            if (!code.trim()) {
                alert("다운로드할 난독화된 코드가 없습니다.");
                return;
            }

            let filename = prompt("저장할 파일 이름을 입력하세요:", "industrial_vm_protected.lua");
            if (!filename) return;
            if (!filename.endsWith('.lua') && !filename.endsWith('.txt')) {
                filename += '.lua';
            }

            const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function rName() {
            const chars = "IlIlIIlI1";
            let res = "_";
            for(let i=0; i<18; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return res;
        }

        function generatePolymorphicISA() {
            let ops = [
                "OP_LOADK", "OP_GETGLOBAL", "OP_CALL", "OP_RET", "OP_SETGLOBAL", "OP_MOVE"
            ];
            let available = Array.from({length: 255}, (_, i) => i).sort(() => Math.random() - 0.5);
            let map = {};
            ops.forEach((op, idx) => { map[op] = available[idx]; });
            return map;
        }

        function industrialObfuscate() {
            let src = document.getElementById('inputCode').value;
            if (!src.trim()) {
                alert("난독화할 코드를 입력해주세요!");
                return;
            }

            let isa = generatePolymorphicISA();
            let constantPool = [];
            let virtualBytecode = [];

            function addConstant(val) {
                let idx = constantPool.indexOf(val);
                if (idx === -1) {
                    constantPool.push(val);
                    idx = constantPool.length - 1;
                }
                return idx;
            }

            let cleanSrc = src.replace(/--.*$/gm, '');
            let tokens = cleanSrc.match(/"[^"\\]*(?:\\.[^"\\]*)*"|'[^'\\]*(?:\\.[^'\\]*)*'|[a-zA-Z_][a-zA-Z0-9_]*|\d+|==|!=|<=|>=|=|(|)|,|\./g) || [];

            let ptr = 0;
            while(ptr < tokens.length) {
                let token = tokens[ptr];

                if (ptr + 3 < tokens.length && tokens[ptr+1] === '(' && (tokens[ptr+2].startsWith('"') || tokens[ptr+2].startsWith("'")) && tokens[ptr+3] === ')') {
                    let globalNameIdx = addConstant(token);
                    let rawStr = tokens[ptr+2].slice(1, -1);
                    let strConstIdx = addConstant(rawStr);

                    virtualBytecode.push(isa["OP_GETGLOBAL"], 0, globalNameIdx); 
                    virtualBytecode.push(isa["OP_LOADK"], 1, strConstIdx);      
                    virtualBytecode.push(isa["OP_CALL"], 0, 1, 0);               
                    ptr += 4;
                    continue;
                }
                
                if (ptr + 2 < tokens.length && tokens[ptr+1] === '=' && (tokens[ptr+2].startsWith('"') || tokens[ptr+2].startsWith("'"))) {
                    let globalNameIdx = addConstant(token);
                    let rawStr = tokens[ptr+2].slice(1, -1);
                    let strConstIdx = addConstant(rawStr);
                    virtualBytecode.push(isa["OP_LOADK"], 0, strConstIdx);
                    virtualBytecode.push(isa["OP_SETGLOBAL"], 0, globalNameIdx);
                    ptr += 3;
                    continue;
                }
                let genericConstIdx = addConstant(token);
                virtualBytecode.push(isa["OP_LOADK"], 5, genericConstIdx);
                ptr++;
            }

            let rollingKey = Math.floor(Math.random() * 180) + 40;
            let startKey = rollingKey;
            let encryptedBytecode = [];
            for (let i = 0; i < virtualBytecode.length; i++) {
                let b = virtualBytecode[i];
                let enc = (b ^ rollingKey) % 256;
                encryptedBytecode.push(enc);
                rollingKey = (rollingKey + enc * 13) % 256;
            }

            let scatteredConsts = [];
            constantPool.forEach(c => {
                let bytes = [];
                let sStr = String(c);
                for(let i=0; i<sStr.length; i++) {
                    let k = Math.floor(Math.random() * 200) + 1;
                    let codeVal = sStr.charCodeAt(i);
                    let enc = codeVal ^ k;
                    bytes.push(`string.char(bit32.bxor(${enc}, ${k}))`);
                }
                scatteredConsts.push(bytes.join(' .. '));
            });

            let controlFlowTraps = "";
            for (let i = 1; i <= 130; i++) {
                let trapId = Math.floor(Math.random() * 8000000) + 2000000;
                let nextState = Math.random() > 0.5 ? 1 : Math.floor(Math.random() * 8000000) + 2000000;
                controlFlowTraps += `
    elseif _state == ${trapId} then
        local _trapArr = setmetatable({}, { __index = function(t, k) return rawget(t, k) or error() end, __newindex = function() while true do end end })
        _state = ${nextState}`;
            }

            let v_registers = rName();
            let v_pc = rName();
            let v_bc = rName();
            let v_consts = rName();
            let v_op = rName();
            let v_key = rName();

            let industrialResult = `
--[========================================================[
    Luakeeper v7.5 Industrial Grade Polymorphic VM Engine
    - Polymorphic Dynamic ISA Mapping
    - Rolling-Key Bytecode Stream Interlocking
    - 130+ Flattening Anti-Timeout & Hook Deflector
]========================================================]
local _ENV = getfenv and getfenv() or _ENV
local _rawget = rawget
local _setmetatable = setmetatable
local function _antiHook()
    if debug and (debug.getupvalue or debug.info) then
        _setmetatable(_ENV, {
            __index = function(t, k)
                if k == "debug" or k == "getfenv" or k == "setfenv" then
                    while true do local _ = math.cos(1) * math.sin(1) end
                end
                return _rawget(t, k)
            end
        })
    end
end
pcall(_antiHook)

local function _executeVM()
    local ${v_consts} = {
        ${scatteredConsts.map(x => `(${x})`).join(',\n        ')}
    }
    local ${v_bc} = { ${encryptedBytecode.join(', ')} }
    local ${v_registers} = {}
    local ${v_pc} = 1
    local ${v_key} = ${startKey}
    local _state = 1

    while true do
        if _state == 1 then
            if ${v_pc} > #${v_bc} then break end
            local _rawOp = ${v_bc}[${v_pc}]
            local ${v_op} = bit32.bxor(_rawOp, ${v_key}) % 256
            ${v_key} = (${v_key} + _rawOp * 13) % 256
            ${v_pc} = ${v_pc} + 1

            if ${v_op} == ${isa["OP_GETGLOBAL"]} then
                local r = ${v_bc}[${v_pc}] + 1; ${v_pc} = ${v_pc} + 1
                local cIdx = ${v_bc}[${v_pc}] + 1; ${v_pc} = ${v_pc} + 1
                ${v_registers}[r] = _ENV[${v_consts}[cIdx]]
            elseif ${v_op} == ${isa["OP_LOADK"]} then
                local r = ${v_bc}[${v_pc}] + 1; ${v_pc} = ${v_pc} + 1
                local cIdx = ${v_bc}[${v_pc}] + 1; ${v_pc} = ${v_pc} + 1
                ${v_registers}[r] = ${v_consts}[cIdx]
            elseif ${v_op} == ${isa["OP_CALL"]} then
                local r = ${v_bc}[${v_pc}] + 1; ${v_pc} = ${v_pc} + 1
                local numArgs = ${v_bc}[${v_pc}]; ${v_pc} = ${v_pc} + 1
                local numResults = ${v_bc}[${v_pc}]; ${v_pc} = ${v_pc} + 1
                local func = ${v_registers}[r]
                if numArgs == 1 then
                    func(${v_registers}[r+1])
                else
                    func()
                end
            elseif ${v_op} == ${isa["OP_SETGLOBAL"]} then
                local r = ${v_bc}[${v_pc}] + 1; ${v_pc} = ${v_pc} + 1
                local cIdx = ${v_bc}[${v_pc}] + 1; ${v_pc} = ${v_pc} + 1
                _ENV[${v_consts}[cIdx]] = ${v_registers}[r]
            elseif ${v_op} == ${isa["OP_RET"]} then
                return
            else
                while true do end
            end
            _state = ${Math.random() > 0.6 ? Math.floor(Math.random() * 8000000) + 2000000 : 1}
            ${controlFlowTraps}
        else
            _state = 1
        end
    end
end
pcall(_executeVM)
`.trim();

            document.getElementById('outputCode').value = industrialResult;
        }
    </script>
</body>
</html>
