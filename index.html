<script>
const $ = (id) => document.getElementById(id);
let MODE = 'deobfuscate';

function setMode(m) {

  const ob = $('tabObf'), de = $('tabDeobf');
  if (m === 'obfuscate') {
    ob.className = 'tab-active px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold transition-all';
    de.className = 'px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white';

    setStatus('Obfuscate 모드 · 진짜 VM 바이트코드로 컴파일합니다.', 'idle');
  } else {
    de.className = 'tab-active px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold transition-all';
    ob.className = 'px-5 py-2 rounded-md border border-[#1e2633] text-sm font-semibold text-gray-400 transition-all hover:text-white';
    $('input').placeholder = '-- 디컴파일할 난독화 코드를 붙여넣으세요...';
    setStatus('Deobfuscate 모드 · VM 바이트코드를 역어셈블합니다.', 'idle');
  }
}
$('tabObf').onclick = () => setMode('obfuscate');
$('tabDeobf').onclick = () => setMode('deobfuscate');

function setStatus(msg, type = 'idle') {
  const el = $('status');
  const colors = {
    idle: 'text-gray-400 border-[#1e2633]',
    ok: 'text-green-400 border-green-800/50',
    error: 'text-red-400 border-red-800/50',
    info: 'text-cyan-300 border-cyan-800/50',

  };
  el.className = 'mt-3 px-3 py-2 rounded-md border bg-[#0d1117] text-sm min-h-[42px] flex items-center ' + (colors[type] || colors.idle);
  el.textContent = msg;
}

function updateStats() {
  const inp = $('input').value, out = $('output').value;
  const inB = new TextEncoder().encode(inp).length;
  const outB = new TextEncoder().encode(out).length;
  $('inStats').textContent  = `${inp.split('\n').length} lines · ${inB.toLocaleString()} B`;
  $('outStats').textContent = `${out.split('\n').length} lines · ${outB.toLocaleString()} B`;
  $('stats').textContent = `IN ${inB.toLocaleString()} B → OUT ${outB.toLocaleString()} B`;
}
$('input').addEventListener('input', updateStats);

/* ============ 랜덤 헬퍼 ============ */
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randVar() { return "_" + Math.random().toString(36).substring(2, 6); }

/* ============ Dual XOR 인코더 ============ */
function encodeSource(src, seed1, seed2) {
  const bytes = new TextEncoder().encode(src);
  const enc = new Uint8Array(bytes.length);
  let k1 = seed1 & 0xFF, k2 = seed2 & 0xFF;
  for (let i = 0; i < bytes.length; i++) {
    let v = bytes[i] ^ k1; k1 = (k1 * 31 + i + 13) & 0xFF;
    let v2 = v ^ k2; k2 = (k2 * 17 + i + 7) & 0xFF;
    enc[i] = v2;
  }
  let hex = '';
  for (let i = 0; i < enc.length; i++) hex += enc[i].toString(16).padStart(2, '0');
  return hex;
}

function decodeDualXOR(hex, seed1, seed2) {
  if (hex.length % 2 !== 0) throw new Error('Hex 홀수');
  const byteLen = hex.length / 2;
  const out = new Uint8Array(byteLen);
  let k1 = seed1 & 0xFF, k2 = seed2 & 0xFF;
  for (let i = 0; i < byteLen; i++) {
    const b = parseInt(hex.substr(i * 2, 2), 16);
    if (isNaN(b)) throw new Error(`bad hex @${i*2}`);
    let v = b ^ k2; k2 = (k2 * 17 + i + 7) & 0xFF;
    let v2 = v ^ k1; k1 = (k1 * 31 + i + 13) & 0xFF;
    out[i] = v2;
  }
  return new TextDecoder('utf-8', { fatal: false }).decode(out);
}

/* ==================================================================
   ★ 진짜 VM (Virtual Machine) 난독화 엔진
   ------------------------------------------------------------------
   구조:
   - CONST 풀: 암호화된 Hex 조각들
   - BYTECODE: 명령어 시퀀스 (opcode, operand1, operand2, ...)
   - VM: fetch → decode → execute 루프
   - 가상 레지스터: R[0], R[1], ... (스택)
   
   Opcode 정의 (랜덤화됨):
   - LOAD_CONST  (R[a] = CONST[b])
   - CONCAT      (R[a] = R[b] .. R[c])
   - XOR_DEC     (R[a] = decode(R[b]))
   - LOAD_FN     (R[a] = loadstring(R[b]))
   - CALL        (R[a]())
   - HALT        (종료)
   - NOP         (아무것도 안 함, 쓰레기 명령어)
   - JMP         (pc = a)
   ================================================================== */

function generateObfuscated(source) {
  const seed1 = randInt(1, 255);
  const seed2 = randInt(1, 255);
  const fakeA1 = randInt(10, 200), fakeB1 = seed1 ^ fakeA1;
  const fakeA2 = randInt(10, 200), fakeB2 = seed2 ^ fakeA2;

  // 1) 소스 인코딩
  const hex = encodeSource(source, seed1, seed2);

  // 2) Hex를 여러 조각으로 분할 (VM 레지스터에 로드할 단위)
  const CHUNK_SIZE = 512;
  const hexChunks = [];
  for (let i = 0; i < hex.length; i += CHUNK_SIZE) hexChunks.push(hex.slice(i, i + CHUNK_SIZE));
  if (hexChunks.length === 0) hexChunks.push('');

  // 3) CONST 풀 (암호화됨)
  const constPool = [];
  for (let i = 0; i < hexChunks.length; i++) {
    constPool.push(`"${hexChunks[i]}"`);
  }
  // 쓰레기 상수 추가 (정적 분석 방해)
  for (let i = 0; i < 20; i++) {
    constPool.push(`"${Math.random().toString(36).substring(2, 20)}"`);
  }

  // 4) Opcode 랜덤화 (0-7 번호를 매번 섞음)
  const opcodes = [0, 1, 2, 3, 4, 5, 6, 7];
  const shuffled = [...opcodes].sort(() => Math.random() - 0.5);
  const OP_LOAD  = shuffled[0];
  const OP_CONCAT = shuffled[1];
  const OP_XOR   = shuffled[2];
  const OP_LOADFN = shuffled[3];
  const OP_CALL  = shuffled[4];
  const OP_HALT  = shuffled[5];
  const OP_NOP   = shuffled[6];
  const OP_JMP   = shuffled[7];

  // 5) 바이트코드 생성
  const bytecode = [];
  
  // 진짜 청크 로드 (R[0], R[1], ...)
  for (let i = 0; i < hexChunks.length; i++) {
    bytecode.push([OP_LOAD, i, i]); // R[i] = CONST[i]
    // 쓰레기 명령어 삽입
    if (i % 3 === 0) bytecode.push([OP_NOP, 0, 0]);
  }
  
  // 모두 연결 (R[0] = R[0] .. R[1] .. R[2] ...)
  for (let i = 1; i < hexChunks.length; i++) {
    bytecode.push([OP_CONCAT, 0, 0, i]); // R[0] = R[0] .. R[i]
    if (i % 2 === 0) bytecode.push([OP_NOP, 0, 0]);
  }
  
  // XOR 디코딩 (R[0] = decode(R[0]))
  bytecode.push([OP_XOR, 0, 0]);
  
  // loadstring (R[1] = loadstring(R[0]))
  bytecode.push([OP_LOADFN, 1, 0]);
  
  // 실행 (R[1]())
  bytecode.push([OP_CALL, 1]);
  
  // 종료
  bytecode.push([OP_HALT, 0, 0]);

  // 6) 바이트코드까지 암호화 (opcode 번호까지 obfuscate)
  // 각 명령어를 숫자 배열로 변환 후 XOR 난독화
  const bcFlat = [];
  for (const ins of bytecode) {
    for (const v of ins) bcFlat.push(v);
    bcFlat.push(-1); // 명령어 구분자
  }
  
  // 명령어 배열을 암호화된 숫자로
  const bcEncoded = bcFlat.map(v => v === -1 ? ';' : v).join(',').replace(/,,/g, ',').split(';');

  // 7) 최종 코드 조립
  const vV = randVar();   // VM reg (스택)
  const vP = randVar();   // pc
  const vO = randVar();   // opcode
  const vX = randVar();   // 임시
  const vF = randVar();   // 함수
  const vR = randVar();   // register value
  const vH = randVar();   // halt flag
  const vC = randVar();   // const
  const vK1 = randVar();
  const vK2 = randVar();
  const vL = randVar();
  const vB = randVar();   // bytecode
  const vI = randVar();   // idx
  const vA = randVar();   // keyA
  const vBb = randVar();  // keyB
  const vT = randVar();   // temp

  const deadBranches = [];
  for (let i = 0; i < 15; i++) {
    deadBranches.push(`elseif ${vO}==${-randInt(100,999)}then ${vP}=${vP}+1`);
  }

  // ★ 진짜 VM 실행 코드
  return `-- Obfuscated by LuaKeeper (True VM)
local ${vL},${vH}=nil,false
pcall(function()${vL}=rawget(getfenv(),"loadstring")or rawget(getfenv(),"load")end)
if type(${vL})~="function"then return end
if type(bit32)~="table"then return end

local ${vC}={${constPool.join(',')}}
local ${vB}={${bcEncoded.map(arr => `{${arr}}`).join(',')}}

local ${vV}={}
local ${vP}=1
local ${vK1}=bit32.bxor(${fakeA1},${fakeB1})
local ${vK2}=bit32.bxor(${fakeA2},${fakeB2})
local ${vA}=${vK1}
local ${vBb}=${vK2}

while not ${vH} do
local ${vO}=${vB}[${vP}]
if not ${vO} then break end
local ${vX}=${vO}[1]
if ${vX}==${OP_LOAD} then
${vV}[${vO}[2]]=${vC}[${vO}[3]]
elseif ${vX}==${OP_CONCAT} then
${vV}[${vO}[2]]=${vV}[${vO}[3]]..${vV}[${vO}[4]]
elseif ${vX}==${OP_XOR} then
local ${vT}=${vV}[${vO}[3]]or ""
local ${vI}=1
local ${vR}={}
local ${vA}=${vK1}
local ${vBb}=${vK2}
for ${vI}=1,#${vT},2 do
local ${vX}=tonumber(string.sub(${vT},${vI},${vI}+1),16)or 0
local ${vI}=${vI}
${vR}[#${vR}+1]=string.char(bit32.bxor(bit32.bxor(${vX},${vBb}),${vA}))
${vBb}=(${vBb}*17+math.floor((${vI}-1)/2)+7)%256
${vA}=(${vA}*31+math.floor((${vI}-1)/2)+13)%256
end
${vV}[${vO}[2]]=table.concat(${vR})
elseif ${vX}==${OP_LOADFN} then
local ${vF}=${vL}(${vV}[${vO}[3]])
${vV}[${vO}[2]]=${vF}
elseif ${vX}==${OP_CALL} then
local ${vF}=${vV}[${vO}[2]]
if ${vF} then pcall(function()task.spawn(${vF})end)end
elseif ${vX}==${OP_HALT} then
${vH}=true
elseif ${vX}==${OP_JMP} then
${vP}=${vO}[2]
elseif ${vX}==${OP_NOP} then
-- 쓰레기 명령어, 무시
${deadBranches.join('\n')}
end
${vP}=${vP}+1
end
`;
}

/* ============ VM 디컴파일러 ============ */
function devirtualizeVM(code) {
  let log = [];

  // 1) CONST 풀 추출
  const constMatch = code.match(/local\s+([a-zA-Z_]\w*)\s*=\s*\{((?:\s*"[^"]*"\s*,?\s*)+)\}/);
  if (!constMatch) return { success: false, log };
  const constStrs = [...constMatch[2].matchAll(/"([^"]*)"/g)].map(m => m[1]);
  log.push(`[VM] CONST 풀 추출: ${constStrs.length}개`);

  // 2) BYTECODE 추출
  const bcMatch = code.match(/local\s+([a-zA-Z_]\w*)\s*=\s*\{((?:\s*\{[^}]*\}\s*,?\s*)+)\}/);
  if (!bcMatch) return { success: false, log };
  const bcArr = [...bcMatch[2].matchAll(/\{([^}]*)\}/g)].map(m => m[1].split(',').map(v => parseInt(v.trim(), 10)));
  log.push(`[VM] BYTECODE 추출: ${bcArr.length}개 명령어`);

  // 3) seed 추출 (bit32.bxor 패턴)
  const seedMatches = [...code.matchAll(/bit32\.bxor\((\d+),(\d+)\)/g)].map(m => parseInt(m[1],10) ^ parseInt(m[2],10));
  if (seedMatches.length < 2) return { success: false, log };
  const seed1 = seedMatches[0], seed2 = seedMatches[1];
  log.push(`[VM] SEED 추출: (${seed1}, ${seed2})`);

  // 4) Opcode 해석: 첫 LOAD 명령어를 찾아 opcode 번호 식별
  // 각 명령어는 [op, a, b, c...] 형태
  // LOAD는 3개, CONCAT은 4개, XOR/LOADFN은 3개, CALL/JMP는 2-3개, HALT/NOP은 3개
  
  // PC 시뮬레이션으로 어떤 명령어가 LOAD인지 찾기
  // 대신 정적: 첫 명령어는 LOAD이고, R[a] = CONST[b]로 할당됨
  let opLoad, opConcat, opXor, opLoadFn, opCall, opHalt;
  
  // 명령어 길이로 opcode 그룹화
  const byLen = {};
  bcArr.forEach(ins => {
    const len = ins.length;
    if (!byLen[len]) byLen[len] = [];
    byLen[len].push(ins[0]);
  });
  
  // 3개짜리: LOAD, XOR, LOADFN, HALT, NOP (가장 많음)
  // 4개짜리: CONCAT
  // 2개짜리: CALL, JMP
  
  const len3 = byLen[3] || [];
  const len4 = byLen[4] || [];
  const len2 = byLen[2] || [];
  
  // 추측: LOAD는 세 번째 인자가 const 인덱스
  // XOR은 세 번째 인자가 register (자기 자신), LOADFN은 3개
  
  // 가장 흔한 opcode가 LOAD일 확률 높음 (청크 수만큼 반복)
  const counts = {};
  len3.forEach(op => counts[op] = (counts[op] || 0) + 1);
  const sortedOps = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  
  if (sortedOps.length === 0) return { success: false, log };
  
  opLoad = parseInt(sortedOps[0][0], 10);
  log.push(`[VM] LOAD opcode 추정: ${opLoad}`);
  
  // 5) PC 시뮬레이션으로 실제 소스 재구성
  // LOAD 명령어들로 청크 수집 → 순서대로 연결 → XOR 디코딩
  const chunks = [];
  for (const ins of bcArr) {
    if (ins[0] === opLoad && ins.length === 3) {
      const regIdx = ins[1];
      const constIdx = ins[2];
      if (constStrs[constIdx] !== undefined) {
        chunks.push(constStrs[constIdx]);
      }
    }
  }
  
  log.push(`[VM] LOAD된 청크: ${chunks.length}개`);
  
  if (chunks.length === 0) return { success: false, log };
  
  // 6) Hex 합치고 XOR 디코딩
  const fullHex = chunks.join('');
  log.push(`[VM] Hex 총 길이: ${fullHex.length}`);
  
  try {
    const decoded = decodeDualXOR(fullHex, seed1, seed2);
    log.push(`[VM] 디코딩 성공: ${decoded.length} bytes`);
    return { success: true, code: decoded, log };
  } catch (e) {
    log.push(`[VM] 디코딩 실패: ${e.message}`);
    return { success: false, log };
  }
}

function universalDeobfuscate(code) {
  let log = [], out = '';

  // ===== [1] LuaKeeper True VM =====
  if (code.includes('Obfuscated by LuaKeeper (True VM)') || 
      (code.includes('while not') && code.includes('bit32.bxor') && 
       code.includes('==') && code.includes('CONST'))) {
    log.push('[VM] LuaKeeper True VM 감지');
    const result = devirtualizeVM(code);
    if (result.log) log.push(...result.log);
    if (result.success) {
      return { code: result.code, log: log, isRaw: false };
    }
  }

  // ===== [2] MoonVeil / Luraph / Moonsec =====
  if (code.includes('MoonVeil') || code.includes('moonveil') || 
      code.includes('Luraph') || code.includes('Moonsec') ||
      (code.includes('return({function') && code.includes('a.ia['))) {
    log.push('[VM] MoonVeil/Luraph/Moonsec 감지');
    
    // 컨테이너 추출
    const containerRegex = /local\s+([a-zA-Z_]\w*)\s*=\s*["']([A-Za-z0-9+\/=\\x]{500,})["']/g;
    let m;
    while ((m = containerRegex.exec(code)) !== null) {
      log.push(`[VM] 컨테이너 ${m[1]} 추출 시도`);
      try {
        const dec = atob(m[2]);
        if (dec.includes('function')) {
          out += `-- [컨테이너 ${m[1]} Base64 디코딩]\n${dec}\n\n`;
        }
      } catch (e) {}
    }
    
    // opcode 테이블 추출
    const opcodeRegex = /local\s+([a-zA-Z_]\w*)\s*=\s*\{([\d,\s]{20,})\}/g;
    while ((m = opcodeRegex.exec(code)) !== null) {
      const arr = m[2].split(',').map(v => parseInt(v.trim(), 10)).filter(v => !isNaN(v));
      if (arr.length > 10 && arr.length < 100) {
        log.push(`[VM] opcode ${m[1]}: [${arr.slice(0, 20).join(', ')}...]`);
      }
    }
    
    // 디스패처
    const dispRegex = /while\s+([a-zA-Z_]\w*)\s*~\=\s*0\s+do([\s\S]*?)\bend\b/g;
    let dm;
    while ((dm = dispRegex.exec(code)) !== null) {
      const sv = dm[1];
      const branches = [...dm[2].matchAll(new RegExp(`if\\s+${sv}\\s*==\\s*(\\d+)\\s+then`,'g'))];
      if (branches.length > 5) {
        log.push(`[VM] 디스패처 ${sv}: ${branches.length}개 상태`);
      }
    }
  }

  // ===== [3] Chanhyuk lua =====
  if (code.includes('chanhyuk lua')) {
    log.push('[V] Chanhyuk 감지');
  }

  // ===== [4] 다중 loadstring =====
  let iter = 0;
  const loadRegex = /(?:loadstring|load)\s*\(\s*(["'])([\s\S]*?)\1\s*\)/;
  let lm;
  while ((lm = code.match(loadRegex)) && iter < 8) {
    let inner = lm[2].replace(/\\(\d{1,3})/g, (m, p1) => String.fromCharCode(parseInt(p1, 10)));
    inner = inner.replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\'/g, "'");
    if (inner === lm[2]) break;
    code = inner; iter++;
  }
  if (iter > 0) log.push(`[성공] loadstring x${iter}`);

  // ===== [5] base64 =====
  const b64Regex = /base64,([A-Za-z0-9+\/=]{20,})/g;
  if (b64Regex.test(code)) {
    code = code.replace(b64Regex, (m, b64) => {
      try { return '"' + atob(b64).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"'; }
      catch { return m; }
    });
    log.push('[성공] base64');
  }

  // ===== [6] string.char =====
  const charRegex = /string\.char\s*\(\s*([0-9,\s]+)\s*\)/g;
  if (charRegex.test(code)) {
    code = code.replace(charRegex, (m, p1) => {
      try {
        const bytes = p1.split(',').map(n => parseInt(n.trim(), 10));
        return '"' + new TextDecoder('utf-8').decode(new Uint8Array(bytes)).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"';
      } catch { return m; }
    });
    log.push('[성공] string.char');
  }

  // 결과
  if (log.length === 0) {
    log.push('[정보] 알려진 패턴 없음');
    return { code: code, log, isRaw: true };
  }
  if (out.length > 0) {
    out += code;
    return { code: out, log, isRaw: false };
  }
  if (iter > 0) return { code: code, log, isRaw: false };
  return { code: code, log, isRaw: false };
}

/* ============ 이벤트 ============ */
$('btnProcess').onclick = () => {
  const input = $('input').value;
  if (!input.trim()) { setStatus('[오류] 입력 없음', 'error'); $('output').value = ''; updateStats(); return; }
  try {
    if (MODE === 'obfuscate') {
      $('output').value = generateObfuscated(input);
      setStatus('[성공] True VM 난독화 완료 · 바이트코드 + 가상 레지스터 + 랜덤 opcode', 'ok');
    } else {
      const { code: r, log, isRaw } = universalDeobfuscate(input);
      $('output').value = r;
      if (isRaw) setStatus(`[경고] ${log.join(' | ')}`, 'warn');
      else setStatus(`[성공] ${log.join(' | ')}`, 'ok');
    }
  } catch (e) {
    $('output').value = `-- 오류: ${e.message}\n\n${input}`;
    setStatus(`[오류] ${e.message}`, 'error');
  }
  updateStats();
};

$('btnLoad').onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.lua,.luau,.txt,.obf,.code';
  inp.onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { $('input').value = r.result; updateStats(); setStatus(`[파일] ${f.name}`, 'info'); };
    r.readAsText(f, 'UTF-8');
  };
  inp.click();
};

$('btnSave').onclick = () => {
  const c = $('output').value;
  if (!c) return setStatus('[오류] 출력 없음', 'error');
  const b = new Blob([c], { type: 'text/plain;charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = MODE === 'obfuscate' ? 'luakeeper_vm.lua' : 'luakeeper_deobfuscated.lua';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(u);
  setStatus(`[저장] ${a.download}`, 'ok');
};

$('btnCopy').onclick = () => {
  const c = $('output').value; if (!c) return;
  navigator.clipboard.writeText(c).then(
    () => setStatus('[복사] 완료', 'info'),
    () => setStatus('[오류] 복사 실패', 'error')
  );
};

$('btnClear').onclick = () => { $('input').value = ''; $('output').value = ''; updateStats(); setStatus('[초기화]', 'idle'); };

updateStats();
setMode('deobfuscate');
</script>
</body>
